# Route matrix — one primary search intent per indexable core page.
#
# Rules enforced by scripts/validate-route-matrix.mjs:
#   - url + primary_keyword must be unique (case-insensitive)
#   - cta/evidence internal paths must exist (checked against dist/ when built)
#   - every core marketing page must appear here (no orphan landing pages)
#
# Keep keywords真实: they describe the page's actual primary topic. Do not add a
# page here until the content and evidence exist.
version: 1
site: https://inflatablepoolfactory.com
updated: '2026-11-17'

routes:
