    primary_keyword: inflatable pool manufacturer
    secondary_keywords:
      - inflatable pool factory
      - drop stitch pool supplier
    intent: commercial
    page_type: homepage
    cta: /request-quotation/
    evidence:
      - /about/
      - /quality-control/
    indexable: true

