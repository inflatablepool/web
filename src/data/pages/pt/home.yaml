content_compliance:
  tagline: Cuidado e Segurança
  title: Fácil de possuir,<br />Fácil de amar
  subtitle: Da entrega ao primeiro mergulho e ao armazenamento no final da temporada, possuir uma piscina Inflatable Pool Factory permanece simples.
  items:
    - title: Configuração em minutos
      description: 'Desembale e encha com a bomba incluída em 5 a 15 minutos e, em seguida, encha com uma mangueira de jardim – o tempo de enchimento varia de acordo com o tamanho da piscina e o abastecimento de água.'
