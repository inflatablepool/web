    - title: Cuidados simples com a água
      description: As portas padrão da bomba de filtro de 32/38 mm, verificações regulares de pH e uma tampa ajustada nos modelos redondos mantêm a água limpa.
      icon: tabler:droplet
    - title: Limpar, drenar e armazenar
      description: Escorra, seque, enrole e coloque a piscina em seu saco de armazenamento para o inverno. Nenhuma instalação permanente para manter.
      icon: tabler:package
    - title: Segurança em primeiro lugar
      description: As crianças devem ser supervisionadas ativamente por um adulto em todos os momentos. Siga o manual, as regras locais e as orientações de uso seguro.
      icon: tabler:shield-check
