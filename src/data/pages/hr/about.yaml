hero:
  tagline: O nama
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory bazen na napuhavanje
  title: |
    Čini plivanje jednostavnim, <br />
    na <span class="text-accent dark:text-white">Inflatable Pool Factory</span> način
  subtitle: Inflatable Pool Factory je vrhunski Drop Stitch brend bazena na napuhavanje koji je dizajnirao Inflatable Pool Team · Qingdao Vatrad Group. Vjerujemo da svaka obitelj zaslužuje pravi bazen u dvorištu - bez izgradnje, dozvola ili trajne instalacije. Naši se bazeni napuhavaju u roku od nekoliko minuta, prežive puna ljeta obiteljske zabave i spakiraju se na kraju sezone.
stats:
  title: Po brojkama
  columns: 4
  stats:
    - title: Zbirke bazena
      amount: '4'
    - title: 'Vrijeme napuhavanja'
      amount: '5-15 min'
    - title: Nazivni tlak
      amount: 4-5 PSI
    - title: Kontakt
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: Što gradimo
  subtitle: Fokusirana linija proizvoda koju poznajemo iznutra — visokotlačni bazeni na napuhavanje Drop Stitch.
  columns: 3
  isBeforeContent: true
  items:
    - title: Pravokutni bazeni
      description: Pravokutni Drop Stitch bazeni obiteljske veličine koji povećavaju prostor za plivanje u vašem prostoru.
      icon: tabler:rectangle
    - title: Okrugli plavi bazeni
      description: Klasični dvorišni bazen — živopisna plava boja, kruti Drop Stitch zidovi, brzo postavljanje.
      icon: tabler:circle
    - title: Okrugli sivi bazeni
      description: Naša vrhunska linija s modernom sivom završnom obradom i dodatnom uklopljenom navlakom.
      icon: tabler:circle-dot
    - title: SPA bazeni s hidromasažnom kadom
      description: 'Izolirani modeli hidromasažne kade s ugrađenim sjedalima i 5 mm izoliranim dnom — za korištenje s vanjskim grijačima (grijač nije uključen).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Kompletni paketi
      description: Svaki bazen se isporučuje s električnom pumpom za zrak, kompletom za popravak i torbom za pohranu.
      icon: tabler:package
    - title: Prilagođene veličine
      description: OEM veličine, boje i poklopci za robne marke, distributere i ugostiteljske projekte.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Proizvodnja pod privatnom robnom markom s ispisom logotipa i pakiranjem spremnim za maloprodaju.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Inflatable Pool Factory pravokutni Drop Stitch bazen na napuhavanje
