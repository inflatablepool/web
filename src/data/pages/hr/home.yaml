content_compliance:
  tagline: Njega i sigurnost
  title: Jednostavan za posjedovanje,<br />Lako za voljeti
  subtitle: Od isporuke preko prvog kupanja do skladištenja na kraju sezone, posjedovanje bazena Inflatable Pool Factory ostaje jednostavno.
  items:
    - title: Postavljanje u nekoliko minuta
      description: 'Raspakirajte i napuhajte priloženom pumpom za 5-15 minuta, zatim napunite vrtnim crijevom — vrijeme punjenja ovisi o veličini bazena i opskrbi vodom.'
      icon: tabler:rocket
    - title: Jednostavna njega vode
      description: Standardni 32/38 mm otvori za filtar-pumpu, redovite pH provjere i postavljeni poklopac na okruglim modelima održavaju vodu čistom.
      icon: tabler:droplet
    - title: Očistite, ocijedite i pohranite
      description: Ocijedite, osušite, smotajte i spakirajte bazen u vreću za zimu. Nema trajne instalacije za održavanje.
      icon: tabler:package
    - title: Sigurnost prije svega
      description: Djeca moraju cijelo vrijeme biti pod aktivnim nadzorom odrasle osobe. Slijedite priručnik, lokalna pravila i smjernice za sigurnu uporabu.
      icon: tabler:shield-check
