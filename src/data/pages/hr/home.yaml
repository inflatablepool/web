faqs:
  title: Često postavljana pitanja o bazenu na napuhavanje
  subtitle: Uobičajena pitanja o Inflatable Pool Factory bazenima na napuhavanje.
  columns: 2
  items:
    - title: Koliko dugo traje postavljanje?
      description: 'Napuhavanje traje 5-15 minuta s uključenom električnom zračnom pumpom, ovisno o modelu. Vrijeme punjenja ovisi o kapacitetu bazena i vašoj zalihi vode.'
      icon: tabler:clock
      category: all
    - title: Koliko je krut drop stitch bazen?
      description: Vrlo krut. Drop Stitch stijenke snažno se napuhavaju pri 4-5 PSI — slično dasci za veslanje na napuhavanje — tako da bazen zadržava svoj oblik kada se napuni vodom.
      icon: tabler:hexagon
      category: all
    - title: Mogu li djeca koristiti bazen?
      description: Da, uz aktivni nadzor odrasle osobe cijelo vrijeme. Djeca se nikada ne smiju ostavljati bez nadzora u bazenu ili u blizini bazena — pridržavajte se priručnika i lokalnih sigurnosnih pravila.
      icon: tabler:users
      category: all
    - title: Kako čuvati bazen zimi?
      description: Ispustite vodu, ispuhnite bazen, pustite da se potpuno osuši, zatim ga smotajte i spremite u priloženu vrećicu za pohranu na mjesto zaštićeno od smrzavanja.
      icon: tabler:package
      category: all
    - title: Što je uključeno u bazen?
      description: Svaki Inflatable Pool Factory bazen uključuje električnu zračnu pumpu, pribor za popravak i torbu za pohranu. Okrugli modeli imaju izborni poklopac.
      icon: tabler:box
      category: all
    - title: Koje su veličine dostupne?
      description: 48 standardnih SKU-ova u četiri kolekcije — okrugli bazeni do 10 m u promjeru, pravokutni bazeni do 6 × 5 m i SPA kade s ugrađenim sjedalima. Za poslovne partnere dostupne su prilagođene veličine.
      icon: tabler:ruler-2
      category: all
    - title: Na koje podloge može stajati bazen?
      description: 'Bilo koja ravna, ravna površina bez oštrih predmeta - travnjak, terasa ili terasa. Na grubim površinama preporuča se brušenje. Napunjeni bazen je težak: postavite ga samo na površinu koja može izdržati punu težinu, a uzdignute palube, balkone i krovove najprije strukturno procijenite.'
      icon: tabler:layout-grid
      category: all
    - title: Kako održavam vodu čistom?
      description: Upotrijebite filtarsku pumpu gdje je ugrađena, očistite ostatke, provjerite pH i pokrijte bazen kada se ne koristi. Trajanje vode ovisi o veličini bazena, korištenju i filtraciji — testirajte redovito umjesto da se oslanjate na fiksni raspored.
      icon: tabler:droplet
      category: all
