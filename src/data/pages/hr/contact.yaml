hero_text:
  tagline: Kontakt
  title: JAVITE SE
contact_form:
  id: form
  title: Pošaljite nam poruku
  subtitle: Za ponude, tehnička pitanja ili upite o partnerstvu, javite nam se.
  email_to: info@inflatablepoolfactory.com
  submit_button: Pošaljite upit → Zatražite ponudu
  success_message: Hvala! Vaša poruka je stigla u naš inbox.
  error_message: Nešto nije u redu prilikom slanja vaše poruke. Pokušajte ponovno ili nam izravno pošaljite e-poruku.
  default_country_code: '+86'
  captcha:
    label: 'Zaštita od spama: riješite sljedeće'
  fields:
    - name: firstName
      label: Ime
      row: 1
    - name: lastName
      label: Prezime
      row: 1
    - name: companyName
      label: Naziv tvrtke
      row: 2
    - name: address
      label: Adresa
      row: 3
    - name: zip
      label: Poštanski broj
      row: 4
    - name: country
      label: Zemlja
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Procijenjeni opseg narudžbe
      row: 6
      type: select
      options:
        - value: ''
          label: Odaberite svoju procijenjenu količinu...
        - value: sample
          label: Samo uzorci / prototipovi
        - value: 100-500
          label: 100–500 jedinica
        - value: 500-plus
          label: 500+ jedinica (količinska cijena)
    - name: customization
      label: Potrebna prilagodba?
      row: 7
      type: select
      options:
        - value: ''
          label: Odaberite vrstu prilagodbe...
        - value: none
          label: Standardni proizvod (bez prilagodbe)
        - value: logo
          label: Samo prilagođeni logotip / robna marka
        - value: full
          label: Puni OEM (veličina, boja, grafika, pakiranje)
        - value: consultation
          label: Nisam siguran — potrebna je konzultacija
    - name: productInterest
      label: Bazen interesa
      row: 8
      type: select
      options:
        - value: ''
          label: Odaberite vrstu bazena...
        - value: all
          label: Svi bazeni / Cijeli katalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Predmet
      row: 9
    - name: message
      label: Poruka
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Drugi načini da dođete do nas
  columns: 3
  items:
    - title: Prodajni upiti
      description: Skupne ponude, veleprodajne cijene i skupne narudžbe.
      icon: tabler:shopping-bag
    - title: Tehnička podrška
      description: Pomoć pri postavljanju, popravci, rezervni dijelovi i pitanja o održavanju.
      icon: tabler:tool
    - title: OEM / ODM
      description: Prilagođene veličine, boje, omoti, robna marka i pakiranja.
      icon: tabler:palette
    - title: E-mail
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Web stranica
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Javite nam se
  subtitle: Kontaktirajte Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

