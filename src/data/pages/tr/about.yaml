hero:
  tagline: Hakkımızda
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory şişme yüzme havuzu
  title: |
    Yüzmeyi basitleştirmek, <br />
     <span class="text-accent dark:text-white">Inflatable Pool Factory</span> tarzı
  subtitle: Inflatable Pool Factory, Inflatable Pool Team · Qingdao Vatrad Group tarafından tasarlanan birinci sınıf bir Drop Stitch şişme havuz markasıdır. Her ailenin arka bahçede inşaat, izin veya kalıcı kurulum olmadan gerçek bir havuzu hak ettiğine inanıyoruz. Havuzlarımız birkaç dakika içinde sert bir şekilde şişer, yazları ailece eğlenerek geçirir ve sezon sonunda küçük küçük toplanıp toplanır.
