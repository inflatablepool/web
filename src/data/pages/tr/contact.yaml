hero_text:
  tagline: Temas etmek
  title: İLETİŞİME GEÇİN
contact_form:
  id: form
  title: Bize bir mesaj gönderin
  subtitle: Fiyat teklifleri, teknik sorular veya ortaklık sorularınız için bize bir satır bırakın.
  email_to: info@inflatablepoolfactory.com
  submit_button: Talep Gönder → Teklif Al
  success_message: Teşekkürler! Mesajınız gelen kutumuza ulaştı.
  error_message: Mesajınızı gönderirken bir şeyler ters gitti. Lütfen tekrar deneyin veya doğrudan bize e-posta gönderin.
  default_country_code: '+86'
  captcha:
    label: 'Spam önleme: lütfen aşağıdakileri çözün'
  fields:
    - name: firstName
      label: İlk adı
      row: 1
    - name: lastName
      label: Soy isim
      row: 1
    - name: companyName
      label: Firma Adı
      row: 2
    - name: address
      label: Adres
      row: 3
    - name: zip
      label: Posta Kodu / Posta Kodu
      row: 4
    - name: country
      label: Ülke
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-posta
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Tahmini Sipariş Hacmi
      row: 6
      type: select
      options:
        - value: ''
          label: Tahmini hacminizi seçin...
        - value: sample
          label: Yalnızca numuneler / Prototipler
        - value: 100-500
          label: 100–500 adet
        - value: 500-plus
          label: 500+ birim (Toplu fiyatlandırma)
    - name: customization
      label: Özelleştirme Gerekli mi?
      row: 7
      type: select
      options:
        - value: ''
          label: Özelleştirme türünü seçin...
        - value: none
          label: Standart ürün (özelleştirme yok)
        - value: logo
          label: Yalnızca Özel Logo / Markalama
        - value: full
          label: OEM (boyut, renk, grafikler, ambalaj)
        - value: consultation
          label: Emin değilim — danışmaya ihtiyacım var
    - name: productInterest
      label: İlgi Havuzu
      row: 8
      type: select
      options:
        - value: ''
          label: Havuz tipini seçin...
        - value: all
          label: Tüm havuzlar / Tam katalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Ders
      row: 9
    - name: message
      label: Mesaj
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Bize ulaşmanın diğer yolları
  columns: 3
  items:
    - title: Satış soruları
      description: Havuz fiyatları, toptan fiyatlandırma ve toplu siparişler.
      icon: tabler:shopping-bag
    - title: Teknik destek
      description: Kurulum yardımı, onarımlar, yedek parçalar ve bakımla ilgili sorular.
      icon: tabler:tool
    - title: OEM / ODM
      description: Özel boyutlar, renkler, kapaklar, markalama ve paketleme.
      icon: tabler:palette
    - title: E-posta
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Web sitesi
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: İletişime Geçin
  subtitle: Inflatable Pool Factory ile iletişime geçin
  address: inflatablepoolfactory.com
  zoom: 15

