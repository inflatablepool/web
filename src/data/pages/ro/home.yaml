blog_latest:
  title: Ghiduri și informații despre piscină
  information: |
    Ghiduri de configurare, sfaturi de îngrijire și sfaturi de cumpărare pentru piscine gonflabile
    din echipa Inflatable Pool Factory.
faqs:
  title: Întrebări frecvente ale piscinei gonflabile
  subtitle: Întrebări frecvente despre piscinele gonflabile Inflatable Pool Factory.
  columns: 2
  items:
    - title: Cât durează configurarea?
      description: 'Umflarea durează 5-15 minute cu pompa electrică de aer inclusă în funcție de model. Timpul de umplere variază în funcție de capacitatea piscinei și de alimentarea cu apă.'
      icon: tabler:clock
      category: all
    - title: Cât de rigidă este o piscină Drop Stitch?
      description: Foarte rigid. Pereții Drop Stitch se umflă puternic la 4-5 PSI - asemănător cu o placă gonflabilă cu vâsle - astfel încât piscina își păstrează forma atunci când este umplută cu apă.
      icon: tabler:hexagon
      category: all
    - title: Copiii pot folosi piscina?
      description: Da, cu supraveghere activă a unui adult în orice moment. Copiii nu trebuie lăsați niciodată nesupravegheați în sau lângă piscină - urmați manualul și regulile locale de siguranță.
      icon: tabler:users
      category: all
    - title: Cum depozitez piscina iarna?
      description: Scurgeți apa, dezumflați piscina, lăsați-o să se usuce complet, apoi rulați-o și depozitați-o în punga de depozitare inclusă într-un loc ferit de îngheț.
      icon: tabler:package
      category: all
    - title: Ce este inclus cu piscina?
      description: Fiecare piscină Inflatable Pool Factory include o pompă de aer electrică, un kit de reparații și o pungă de depozitare. Modelele rotunde au o husă montată opțional.
      icon: tabler:box
      category: all
    - title: Ce dimensiuni sunt disponibile?
      description: 48 de SKU-uri standard din patru colecții — piscine rotunde cu o lungime de până la 10 m, piscine dreptunghiulare de până la 6 × 5 m și căzi SPA cu scaune încorporate. Dimensiunile personalizate sunt disponibile pentru partenerii de afaceri.
      icon: tabler:ruler-2
      category: all
    - title: Pe ce suprafete poate sta piscina?
      description: 'Orice suprafață plană, plană, fără obiecte ascuțite - gazon, terasă sau terasă. Se recomandă o foaie de pământ pe suprafețele aspre. O piscină umplută este grea: instalați numai pe o suprafață care suportă toată greutatea și aveți mai întâi punți, balcoane și acoperișuri înalte evaluate structural.'
      icon: tabler:layout-grid
      category: all
    - title: Cum păstrez apa curată?
      description: Utilizați o pompă de filtru acolo unde este prevăzută, îndepărtați resturile, verificați pH-ul și acoperiți piscina atunci când nu este utilizată. Cât de mult durează apa depinde de dimensiunea piscinei, de utilizare și de filtrare - testați în mod regulat, mai degrabă decât să vă bazați pe un program fix.
      icon: tabler:droplet
      category: all
