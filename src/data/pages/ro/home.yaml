content_compliance:
  tagline: Îngrijire și siguranță
  title: Ușor de deținut,<br />Ușor de iubit
  subtitle: De la livrare la prima înot până la depozitarea la sfârșitul sezonului, deținerea unei piscine Inflatable Pool Factory rămâne simplă.
  items:
    - title: Configurare în minute
      description: 'Despachetați și umflați cu pompa inclusă în 5-15 minute, apoi umpleți cu un furtun de grădină - timpul de umplere variază în funcție de dimensiunea piscinei și de alimentarea cu apă.'
      icon: tabler:rocket
    - title: Îngrijire simplă a apei
      description: Porturile standard pentru pompa de filtru de 32/38 mm, verificări regulate ale pH-ului și un capac montat pe modelele rotunde mențin apa curată.
      icon: tabler:droplet
    - title: Curățați, scurgeți și depozitați
      description: Scurgeți, uscați, rulați și împachetați piscina în geanta de depozitare pentru iarnă. Fără instalație permanentă de întreținut.
      icon: tabler:package
    - title: Siguranța pe primul loc
      description: Copiii trebuie să fie supravegheați activ de un adult în orice moment. Urmați manualul, regulile locale și îndrumările de utilizare în siguranță.
      icon: tabler:shield-check
steps:
  title: De la cutie la curte
  items:
    - title: 'Pasul 1: <span class="font-medium">Alegeți piscina dvs</span>'
      description: Comparați formele și dimensiunile pentru a se potrivi cu spațiul dvs., gospodăria și modul în care intenționați să utilizați apa.
      icon: tabler:pool
    - title: 'Pasul 2: <span class="font-medium">Setează-l</span>'
      description: Așezați pe un teren ferm, plan, umflați cu pompa electrică inclusă și umpleți cu un furtun de grădină.
      icon: tabler:rocket
    - title: 'Pasul 3: <span class="font-medium">Înot toată vara</span>'
      description: Păstrați apa proaspătă cu o îngrijire simplă - degresați, acoperiți și verificați pH-ul ca orice piscină mică.
      icon: tabler:ripple
    - title: 'Pasul 4: <span class="font-medium">Păstrați-l departe</span>'
      description: Când se termină sezonul, scurgeți, uscați, rulați și depozitați piscina în geantă până vara viitoare.
      icon: tabler:package
