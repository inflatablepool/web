hero:
  tagline: Despre noi
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Piscina gonflabila Inflatable Pool Factory
  title: |
    Faceți înotul simplu, <br />
    în stil <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory este o marcă premium pentru piscine gonflabile Drop Stitch, proiectată de Inflatable Pool Team · Qingdao Vatrad Group. Credem că fiecare familie merită o piscină adevărată în curtea din spate - fără construcție, autorizații sau o instalare permanentă. Piscinele noastre se umflă rigid în câteva minute, supraviețuiesc verilor pline de distracție în familie și se împachetează puțin la sfârșitul sezonului.
stats:
  title: După cifre
  columns: 4
  stats:
    - title: Colecții de piscină
      amount: '4'
    - title: 'Timp de umflare'
      amount: '5-15 min'
    - title: Presiune nominală
      amount: 4-5 PSI
    - title: Contact
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: Ce construim
  subtitle: O linie de produse concentrată pe care o cunoaștem pe dinafară - piscine gonflabile Drop Stitch de înaltă presiune.
  columns: 3
  isBeforeContent: true
  items:
    - title: Piscine dreptunghiulare
      description: Piscine Drop Stitch dreptunghiulare de dimensiuni familiale care maximizează zona de înot pentru spațiul dumneavoastră.
      icon: tabler:rectangle
    - title: Piscine rotunde albastre
      description: Piscina clasică din curte — albastru vibrant, pereți Drop Stitch rigizi, instalare rapidă.
      icon: tabler:circle
    - title: Piscine rotunde gri
      description: Linia noastră premium cu finisaj gri modern și husă opțională montată.
      icon: tabler:circle-dot
    - title: Cadă cu hidromasaj piscine SPA
      description: 'Modele de cada cu hidromasaj izolate cu scaune încorporate și fund izolat de 5 mm — pentru utilizare cu încălzitoare externe (încălzitorul nu este inclus).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Pachete complete
      description: Fiecare piscină se livrează cu o pompă de aer electrică, un kit de reparații și o pungă de depozitare.
      icon: tabler:package
    - title: Dimensiuni personalizate
      description: Dimensiuni, culori și huse OEM pentru mărci, distribuitori și proiecte de ospitalitate.
      icon: tabler:adjustments
    - title: OEM/ODM
      description: Fabricare cu etichete private cu imprimare de logo și ambalare pregătită pentru vânzarea cu amănuntul.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Piscină gonflabilă dreptunghiulară Inflatable Pool Factory Drop Stitch
steps2_values:
  title: Valorile noastre
  subtitle: Trei principii care modelează fiecare piscină pe care o construim.
  items:
    - title: Construiește așa cum familia ta l-ar folosi
      description: Fiecare cusătură, perete și supapă este tratată ca și cum propriile noastre familii ar înota în el.
      icon: tabler:heart
    - title: Inginer înainte de a vinde
      description: Construcție Drop Stitch de înaltă presiune, testată peste presiunea sa nominală, înainte ca orice piscină să fie expediată.
      icon: tabler:settings
    - title: Sprijin care durează mai mult decât sezonul
      description: Questions, spare parts, or warranty — contact us at info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: Repere
  subtitle: O versiune scurtă a poveștii Inflatable Pool Factory.
  isReversed: true
  items:
    - title: Axat pe piscine gonflabile
      description: 'Inflatable Pool Factory a fost fondată cu un singur accent: piscinele gonflabile premium Drop Stitch.'
      icon: tabler:pool
    - title: Trei colecții de semnături
      description: Linii de piscine dreptunghiulare, rotunde albastre și rotunde gri, fiecare cu capace opționale și dimensiuni personalizate.
      icon: tabler:circle-check
    - title: OEM/ODM pentru parteneri din întreaga lume
      description: Producție la comandă pentru mărci, distribuitori, hoteluri și operatori de glamping.
      icon: tabler:world
