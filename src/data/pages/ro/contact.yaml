hero_text:
  tagline: Contact
  title: INTRAȚI CONTACTUL
contact_form:
  id: form
  title: Trimite-ne un mesaj
  subtitle: Pentru oferte, întrebări tehnice sau întrebări de parteneriat, scrieți-ne.
  email_to: info@inflatablepoolfactory.com
  submit_button: Trimiteți întrebarea → Obțineți o cotație
  success_message: Mulţumesc! Mesajul dvs. a ajuns în căsuța noastră de e-mail.
  error_message: A apărut o eroare la trimiterea mesajului dvs. Vă rugăm să încercați din nou sau să ne trimiteți un e-mail direct.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: vă rugăm să rezolvați următoarele'
  fields:
    - name: firstName
      label: Prenume
      row: 1
    - name: lastName
      label: Nume
      row: 1
    - name: companyName
      label: Numele companiei
      row: 2
    - name: address
      label: Adresa
      row: 3
    - name: zip
      label: Zip / Cod Poştal
      row: 4
    - name: country
      label: Ţară
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Volumul estimat al comenzii
      row: 6
      type: select
      options:
        - value: ''
          label: Selectați volumul estimat...
        - value: sample
          label: Numai mostre/prototipuri
        - value: 100-500
          label: 100-500 de unități
        - value: 500-plus
          label: Peste 500 de unități (preț pentru volum)
    - name: customization
      label: Personalizare necesară?
      row: 7
      type: select
      options:
        - value: ''
          label: Selectați tipul de personalizare...
        - value: none
          label: Produs standard (fără personalizare)
        - value: logo
          label: Doar logo personalizat / branding
        - value: full
          label: OEM (dimensiune, culoare, grafică, ambalaj)
        - value: consultation
          label: Nu sunt sigur - trebuie consultat
    - name: productInterest
      label: Fondul de interes
      row: 8
      type: select
      options:
        - value: ''
          label: Selectați tipul de piscină...
        - value: all
          label: Toate piscinele / Catalog complet
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Subiect
      row: 9
    - name: message
      label: Mesaj
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Alte modalități de a ajunge la noi
  columns: 3
  items:
    - title: Întrebări de vânzări
      description: Cotații de grup, prețuri cu ridicata și comenzi în vrac.
      icon: tabler:shopping-bag
    - title: Suport tehnic
      description: Ajutor pentru configurare, reparații, piese de schimb și întrebări de îngrijire.
      icon: tabler:tool
    - title: OEM/ODM
      description: Dimensiuni, culori, coperți, branding și ambalaje personalizate.
      icon: tabler:palette
    - title: E-mail
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Site-ul web
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Luați legătura
  subtitle: Contactați Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

