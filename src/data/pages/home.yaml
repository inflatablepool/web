b2b_faqs:
  title: 'B2B Purchasing FAQ'
  subtitle: 'Practical answers for brands, importers and commercial buyers.'
  columns: 2
  items:
    - title: 'Can you manufacture to our drawings?'
      description: 'Share your drawings, reference sample or target specification. Our team will review the requirement and confirm whether the project fits an OEM or ODM path, what technical details are needed and whether any design work is included. <a href="/oem-odm" class="text-primary dark:text-sky-400 hover:underline">See OEM/ODM details</a>.'
      icon: tabler:file-text
    - title: 'What determines MOQ and lead time?'
      description: 'MOQ and production lead time depend on the product platform, customization level, order volume and production season. Final terms are confirmed in your project quotation.'
      icon: tabler:calendar-stats
    - title: 'What can be customized?'
      description: 'Depending on the project, options can include dimensions, wall thickness, colors, logo placement, covers, valves/fittings and packaging. We confirm the available options after reviewing your requirements.'
      icon: tabler:adjustments
    - title: 'What quality documentation can buyers request?'
      description: 'Inspection and test requirements are agreed per product and project. Tell us the standards, records or third-party inspection requirements your market needs, and we will confirm what can be provided. See <a href="/quality-control" class="text-primary dark:text-sky-400 hover:underline">Quality Control</a>.'
      icon: tabler:file-check
    - title: 'Do you support private-label programs?'
      description: 'Private-label options are reviewed per project, including branding, packaging and documentation requirements. See <a href="/private-label" class="text-primary dark:text-sky-400 hover:underline">Private Label Pools</a>.'
      icon: tabler:tag
    - title: 'What information do you need for a quote?'
      description: 'Product type or reference product, target dimensions, materials or performance requirements, branding and packaging needs, estimated quantity, target market and delivery date. <a href="/request-quotation" class="text-primary dark:text-sky-400 hover:underline">Request a quotation</a>.'
      icon: tabler:file-invoice

