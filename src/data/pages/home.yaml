features:
  id: features
  tagline: Drop Stitch Technology
  title: 'Why an Inflatable Pool Factory Pool<br />Is Different'
  subtitle: 'High-pressure drop stitch construction makes our pools rigid, durable, and effortless to store.'
  columns: 2
  items:
    - title: Rigid Drop Stitch Walls
      description: 'Thousands of internal threads lock the wall layers together, so the pool inflates rigid at the rated 4-5 PSI and keeps its shape when filled.'
      icon: tabler:hexagon
    - title: Fast, Tool-Free Setup
      description: 'Inflate with the included electric pump in minutes, then fill with a garden hose. No tools, no construction, no professional installation.'
      icon: tabler:rocket
    - title: Packs Away Small
      description: 'Drain, deflate, roll up, and store the pool in its bag over winter — a full-size pool that packs down small for indoor storage.'
      icon: tabler:package
    - title: Durable & UV-Resistant
      description: 'Double-layer PVC drop stitch fabric, engineered to resist punctures and UV exposure through a full season of family use.'
      icon: tabler:shield
    - title: Complete Package
      description: 'Every pool ships with an electric air pump, repair kit, and storage bag. Fitted covers available for round models.'
      icon: tabler:box
    - title: Safety-Conscious Design
      description: 'Residential pool design referencing EN 16582-1 and ASTM F2666 — model-specific safety information is provided in the product documentation. Constant adult supervision is always required.'
      icon: tabler:shield-check

