      description: 'Unbox and inflate with the included pump in 5-15 minutes, then fill with a garden hose — filling time varies with pool size and water supply.'
      icon: tabler:rocket
    - title: 'Simple Water Care'
      description: 'Standard 32/38 mm filter-pump ports, regular pH checks, and a fitted cover on round models keep water clean.'
      icon: tabler:droplet
    - title: 'Clean, Drain & Store'
      description: 'Drain, dry, roll up, and pack the pool into its storage bag for winter. No permanent installation to maintain.'
      icon: tabler:package
    - title: 'Safety First'
      description: 'Children must be actively supervised by an adult at all times. Follow the manual, local rules, and safe-use guidance.'
      icon: tabler:shield-check

