faqs:
  title: Pool Ownership FAQ
  subtitle: 'Common questions about setup, care and storage of Inflatable Pool Factory pools.'
  columns: 2
  items:
    - title: How long does setup take?
      description: 'Inflating takes 5-15 minutes with the included electric air pump depending on the model. Filling time varies with pool capacity and your water supply.'
      icon: tabler:clock
      category: all
    - title: How rigid is a drop stitch pool?
      description: 'Very rigid. The drop stitch walls inflate hard at 4-5 PSI — similar to an inflatable paddle board — so the pool keeps its shape when filled with water.'
      icon: tabler:hexagon
      category: all
    - title: Can children use the pool?
      description: 'Yes, with active adult supervision at all times. Children must never be left unattended in or near the pool — follow the manual and local safety rules.'
      icon: tabler:users
      category: all
    - title: How do I store the pool in winter?
      description: 'Drain the water, deflate the pool, let it dry completely, then roll it up and store it in the included storage bag in a frost-free place.'
      icon: tabler:package
      category: all
    - title: What is included with the pool?
      description: 'Every Inflatable Pool Factory pool includes an electric air pump, a repair kit, and a storage bag. Round models have an optional fitted cover.'
      icon: tabler:box
      category: all
    - title: What sizes are available?
      description: '48 standard SKUs across four collections — round pools up to 10 m across, rectangular pools up to 6 × 5 m, and SPA tubs with built-in seats. Custom sizes are available for business partners.'
      icon: tabler:ruler-2
      category: all
    - title: What surfaces can the pool stand on?
      description: 'Any flat, level surface free of sharp objects — lawn, patio, or deck. A ground sheet is recommended on rough surfaces. A filled pool is heavy: install only on a surface that supports the full weight, and have elevated decks, balconies, and rooftops structurally assessed first.'
      icon: tabler:layout-grid
      category: all
    - title: How do I keep the water clean?
      description: 'Use a filter pump where fitted, skim debris, check pH, and cover the pool when not in use. How long water lasts depends on pool size, usage, and filtration — test regularly rather than relying on a fixed schedule.'
      icon: tabler:droplet
      category: all

