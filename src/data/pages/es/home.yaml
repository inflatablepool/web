faqs:
  title: Preguntas frecuentes sobre piscinas inflables
  subtitle: Preguntas habituales sobre las piscinas hinchables Inflatable Pool Factory.
  columns: 2
  items:
    - title: ¿Cuánto tiempo lleva la configuración?
      description: 'El inflado tarda entre 5 y 15 minutos con la bomba de aire eléctrica incluida, según el modelo. El tiempo de llenado varía según la capacidad de la piscina y su suministro de agua.'
      icon: tabler:clock
      category: all
    - title: ¿Qué tan rígida es una piscina Drop Stitch?
      description: Muy rígido. Las paredes Drop Stitch se inflan con fuerza a 4-5 PSI, similar a una tabla de remo inflable, para que la piscina mantenga su forma cuando se llena de agua.
      icon: tabler:hexagon
      category: all
    - title: ¿Pueden los niños utilizar la piscina?
      description: Sí, con supervisión activa de un adulto en todo momento. Nunca se debe dejar a los niños solos dentro o cerca de la piscina; siga el manual y las reglas de seguridad locales.
      icon: tabler:users
      category: all
    - title: ¿Cómo guardo la piscina en invierno?
      description: Escurre el agua, desinfla la piscina, déjala secar por completo, luego enróllala y guárdala en la bolsa de almacenamiento incluida en un lugar libre de heladas.
      icon: tabler:package
      category: all
    - title: ¿Qué incluye la piscina?
      description: Cada piscina Inflatable Pool Factory incluye una bomba de aire eléctrica, un kit de reparación y una bolsa de almacenamiento. Los modelos redondos tienen una cubierta incorporada opcional.
      icon: tabler:box
      category: all
    - title: ¿Qué tallas hay disponibles?
      description: '48 SKU estándar en cuatro colecciones: piscinas redondas de hasta 10 m de ancho, piscinas rectangulares de hasta 6 × 5 m y bañeras de SPA con asientos incorporados. Hay tamaños personalizados disponibles para socios comerciales.'
      icon: tabler:ruler-2
      category: all
    - title: ¿Sobre qué superficies se puede apoyar la piscina?
      description: 'Cualquier superficie plana y nivelada libre de objetos punzantes: césped, patio o terraza. Se recomienda una lámina de suelo en superficies rugosas. Una piscina llena es pesada: instálela solo en una superficie que soporte todo el peso y haga que primero evalúen estructuralmente las plataformas, balcones y techos elevados.'
      icon: tabler:layout-grid
      category: all
    - title: ¿Cómo mantengo el agua limpia?
      description: Utilice una bomba de filtrado, si está instalada, retire los residuos, compruebe el pH y cubra la piscina cuando no esté en uso. La duración del agua depende del tamaño, el uso y la filtración de la piscina; pruébela periódicamente en lugar de depender de un horario fijo.
      icon: tabler:droplet
      category: all
