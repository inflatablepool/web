features:
  id: features
  tagline: Tecnología Drop Stitch
  title: Por qué una piscina Inflatable Pool Factory<br />es diferente
  subtitle: La construcción Drop Stitch de alta presión hace que nuestras piscinas sean rígidas, duraderas y fáciles de almacenar.
  columns: 2
  items:
    - title: Paredes rígidas Drop Stitch
      description: 'Miles de roscas internas unen las capas de la pared, por lo que la piscina se infla rígidamente a una velocidad nominal de 4-5 PSI y mantiene su forma cuando se llena.'
      icon: tabler:hexagon
    - title: Configuración rápida y sin herramientas
      description: Infle con la bomba eléctrica incluida en minutos y luego llénelo con una manguera de jardín. Sin herramientas, sin construcción, sin instalación profesional.
      icon: tabler:rocket
    - title: Se guarda en tamaño pequeño
      description: 'Drena, desinfla, enrolla y guarda la piscina en su bolsa durante el invierno: una piscina de tamaño completo que se pliega en un tamaño pequeño para guardarla en interiores.'
      icon: tabler:package
    - title: Durable y resistente a los rayos UV
      description: 'Tejido PVC drop stitch de doble capa, diseñado para resistir pinchazos y exposición UV durante una temporada completa de uso familiar.'
      icon: tabler:shield
    - title: Paquete completo
      description: Cada piscina se envía con una bomba de aire eléctrica, un kit de reparación y una bolsa de almacenamiento. Fundas ajustadas disponibles para modelos redondos.
      icon: tabler:box
    - title: Diseño consciente de la seguridad
      description: 'Diseño de piscina residencial que hace referencia a EN 16582-1 y ASTM F2666: la información de seguridad específica del modelo se proporciona en la documentación del producto. Siempre se requiere la supervisión constante de un adulto.'
      icon: tabler:shield-check
