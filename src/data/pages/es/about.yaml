hero:
  tagline: Sobre nosotros
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Piscina hinchable Inflatable Pool Factory
  title: |
    Simplificando la natación, <br />
    a la <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory es una marca premium de piscinas inflables drop stitch diseñada por Inflatable Pool Team · Qingdao Vatrad Group. Creemos que cada familia merece una verdadera piscina en el patio trasero, sin construcción, permisos ni instalación permanente. Nuestras piscinas se inflan rígidamente en minutos, sobreviven veranos llenos de diversión familiar y se guardan pequeñas al final de la temporada.
