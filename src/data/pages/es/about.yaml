features3_what_we_build:
  title: lo que construimos
  subtitle: 'Una línea de productos enfocada que conocemos al dedillo: piscinas inflables Drop Stitch de alta presión.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Piscinas rectangulares
      description: Piscinas Drop Stitch rectangulares de tamaño familiar que maximizan el área de baño de su espacio.
      icon: tabler:rectangle
    - title: Piscinas azules redondas
      description: 'La clásica piscina del patio trasero: azul vibrante, paredes rígidas Drop Stitch, instalación rápida.'
      icon: tabler:circle
    - title: Piscinas grises redondas
      description: Nuestra línea premium con un moderno acabado gris y cubierta integrada opcional.
      icon: tabler:circle-dot
    - title: Jacuzzi piscinas SPA
      description: 'Modelos de jacuzzi aislados con asientos incorporados y fondos aislados de 5 mm, para uso con calentadores externos (calentador no incluido).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Paquetes completos
      description: Cada piscina se envía con una bomba de aire eléctrica, un kit de reparación y una bolsa de almacenamiento.
      icon: tabler:package
    - title: Tamaños personalizados
      description: Tamaños, colores y cubiertas OEM para marcas, distribuidores y proyectos de hostelería.
      icon: tabler:adjustments
    - title: OEM/ODM
      description: Fabricación de etiquetas privadas con impresión de logotipos y embalajes listos para la venta al por menor.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Piscina hinchable Inflatable Pool Factory rectangular drop stitch
steps2_values:
  title: Nuestros valores
  subtitle: Tres principios que dan forma a cada piscina que construimos.
  items:
    - title: Construye como si tu familia lo usara
      description: Cada costura, pared y válvula se trata como si nuestras propias familias fueran a nadar en ellas.
      icon: tabler:heart
    - title: Ingeniero antes de vender
      description: Construcción Drop Stitch de alta presión, probada por encima de su presión nominal, antes de enviar cualquier piscina.
      icon: tabler:settings
    - title: Soporte que dura más que la temporada
      description: Questions, spare parts, or warranty — reach us any time at info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: Hitos
  subtitle: Una versión corta de la historia de Inflatable Pool Factory.
  isReversed: true
  items:
