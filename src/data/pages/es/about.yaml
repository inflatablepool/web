    - title: Tres colecciones exclusivas
      description: Líneas de piscinas rectangulares, redondas azules y redondas grises, cada una con cubiertas opcionales y tamaños personalizados.
      icon: tabler:circle-check
    - title: OEM/ODM para socios en todo el mundo
      description: Fabricación a medida para marcas, distribuidores, hoteles y operadores de glamping.
      icon: tabler:world
