hero_text:
  tagline: Ota yhteyttä
  title: OTA YHTEYTTÄ
contact_form:
  id: form
  title: Lähetä meille viesti
  subtitle: Tarjouksia, teknisiä kysymyksiä tai kumppanuuskyselyitä varten ota meihin yhteyttä. Vastaamme yhden arkipäivän kuluessa.
  email_to: info@inflatablepoolfactory.com
  submit_button: Lähetä kysely → Pyydä tarjous
  success_message: Kiitos! Viestisi on päätynyt postilaatikkoomme. Vastaamme yhden arkipäivän kuluessa.
  error_message: Jotain meni pieleen viestisi lähettämisessä. Yritä uudelleen tai lähetä meille sähköpostia.
  default_country_code: '+86'
  captcha:
    label: 'Roskapostin esto: ratkaise seuraavat asiat'
  fields:
    - name: firstName
      label: Etunimi
      row: 1
    - name: lastName
      label: Sukunimi
      row: 1
    - name: companyName
      label: Yrityksen nimi
      row: 2
    - name: address
      label: Osoite
      row: 3
    - name: zip
      label: Postinumero
      row: 4
    - name: country
      label: Maa
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: Sähköposti
      row: 5
      type: email
    - name: tel
      label: PUH
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Arvioitu tilausmäärä
      row: 6
      type: select
      options:
        - value: ''
          label: Valitse arvioitu äänenvoimakkuus...
        - value: sample
          label: Vain näytteet / prototyypit
        - value: 5-10
          label: 5–10 yksikköä (standardi MOQ)
        - value: 100-500
          label: 100-500 yksikköä
        - value: 500-plus
          label: Yli 500 yksikköä (määrähinta)
    - name: customization
      label: Tarvitaanko mukauttamista?
      row: 7
      type: select
      options:
        - value: ''
          label: Valitse mukautustyyppi...
        - value: none
          label: Vakiotuote (ei mukauttamista)
        - value: logo
          label: Vain mukautettu logo / brändäys
        - value: full
          label: Täysi OEM (koko, väri, grafiikka, pakkaus)
        - value: consultation
          label: Etkö ole varma - tarvitsee konsultaatiota
    - name: productInterest
      label: Kiinnostuksen kohde
      row: 8
      type: select
      options:
        - value: ''
          label: Valitse allastyyppi...
        - value: all
          label: Kaikki uima-altaat / Täysi luettelo
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Aihe
      row: 9
    - name: message
      label: Viesti
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Muita tapoja tavoittaa meidät
  columns: 3
  items:
    - title: Myynnin tiedustelut
      description: Pool-tarjoukset, tukkuhinnat ja joukkotilaukset.
      icon: tabler:shopping-bag
    - title: Tekninen tuki
      description: Asennusohjeet, korjaukset, varaosat ja huoltokysymykset.
      icon: tabler:tool
    - title: OEM / ODM
      description: Mukautetut koot, värit, kannet, tuotemerkit ja pakkaukset.
      icon: tabler:palette
    - title: Sähköposti
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Verkkosivusto
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: Vastausaika
      description: Vastaamme yhden arkipäivän kuluessa.
      icon: tabler:clock
map:
  title: Ota yhteyttä
  subtitle: Ota yhteyttä Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

