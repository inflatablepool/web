content_workshop:
  isReversed: true
  tagline: Yrityksille
  title: Uima-altaat yrityksille,<br />Liian
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Inflatable Pool Factory liikekumppaneille</h3>
  items:
    - title: Loma-asunnot ja vieraanvaraisuus
      description: Sesonkiajan mukavuudet loma-asunnoille, käyntikohteille ja putiikkeille – nopea ottaa käyttöön, helppo ylläpitää, helppo säilyttää.
    - title: Vähittäismyynti- ja brändikumppanit
      description: Tukkuohjelmat ja vähittäismyyntivalmiit Drop Stitch-altaat puutarhakeskuksiin, allaskauppoihin ja verkkokauppoihin.
    - title: Mukautettu ja yksityinen etiketti
      description: Räätälöidyt koot, värit, kannet, logopainatus ja vähittäismyyntipakkaukset tuotemerkeille – valmistuskumppanimme rakentamia.
content_compliance:
  tagline: Huolto ja turvallisuus
  title: Helppo omistaa,<br />Helppo rakastaa
  subtitle: Inflatable Pool Factory-uima-altaan omistaminen on helppoa toimituksesta ensimmäiseen uintiin kauden lopun säilytykseen.
  items:
    - title: Asennus minuuteissa
      description: 'Pura pakkauksesta ja täytä mukana tulevalla pumpulla 5–15 minuutissa, täytä sitten puutarhaletkulla – täyttöaika vaihtelee altaan koon ja vesihuollon mukaan.'
      icon: tabler:rocket
    - title: Yksinkertainen vedenhoito
      description: Tavalliset 32/38 mm:n suodatinpumppuportit, säännölliset pH-tarkastukset ja pyöreissä malleissa asennettu kansi pitävät veden puhtaana.
      icon: tabler:droplet
    - title: Puhdista, tyhjennä ja säilytä
      description: Tyhjennä, kuivaa, rullaa ja pakkaa allas säilytyspussiinsa talvea varten. Ei pysyvää asennusta ylläpidettäväksi.
      icon: tabler:package
    - title: Turvallisuus ennen kaikkea
      description: Lapset on aina aikuisen aktiivisessa valvonnassa. Noudata käsikirjaa, paikallisia sääntöjä ja turvallista käyttöä koskevia ohjeita.
      icon: tabler:shield-check
steps:
  title: Boksista takapihalle
  items:
    - title: 'Vaihe 1: <span class="font-medium">Valitse allas</span>'
      description: Vertaa muotoja ja kokoja tilan, kotitalouden ja veden käyttötavan mukaan.
      icon: tabler:pool
    - title: 'Vaihe 2: <span class="font-medium">Määritä se</span>'
      description: Aseta kiinteälle, tasaiselle alustalle, täytä mukana tulevalla sähköpumpulla ja täytä puutarhaletkulla.
      icon: tabler:rocket
    - title: 'Vaihe 3: <span class="font-medium">Ui koko kesän</span>'
      description: Pidä vesi raikkaana yksinkertaisella huolella – kuori, peitä ja tarkista pH kuten mikä tahansa pieni uima-allas.
      icon: tabler:ripple
    - title: 'Vaihe 4: <span class="font-medium">Säilytä se pois</span>'
      description: Kun kausi päättyy, valuta, kuivaa, rullaa ja säilytä allas pussissaan ensi kesään asti.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory pyöreä Drop Stitch puhallettava uima-allas
blog_latest:
  title: Allasoppaat ja näkemykset
  information: |
    Ilmatäytteisten uima-altaiden asennusoppaita, hoitovinkkejä ja ostoneuvoja
    Inflatable Pool Factory joukkueesta.
faqs:
  title: Puhallettava uima-allas UKK
  subtitle: Yleisiä kysymyksiä Inflatable Pool Factory puhallettavista uima-altaista.
  columns: 2
  items:
    - title: Kuinka kauan asennus kestää?
      description: 'Täyttö kestää mallista riippuen 5-15 minuuttia mukana tulevalla sähköpumpulla. Täyttöaika vaihtelee altaan kapasiteetin ja vesihuollon mukaan.'
      icon: tabler:clock
      category: all
    - title: Kuinka jäykkä Drop Stitch-allas on?
      description: Erittäin jäykkä. Drop Stitch-seinät puhalletaan kovaa 4-5 PSI:n paineella – kuten puhallettava melalauta – joten allas säilyttää muotonsa vedellä täytettynä.
      icon: tabler:hexagon
      category: all
    - title: Voivatko lapset käyttää uima-allasta?
      description: Kyllä, aktiivisen aikuisen valvonnassa koko ajan. Lapsia ei saa koskaan jättää ilman valvontaa uima-altaaseen tai sen lähelle – noudata käyttöohjeita ja paikallisia turvallisuussääntöjä.
      icon: tabler:users
      category: all
    - title: Kuinka säilyttää allas talvella?
      description: Tyhjennä vesi, tyhjennä allas, anna sen kuivua kokonaan, rullaa se sitten rullalle ja säilytä mukana tulevassa säilytyspussissa pakkaselta suojatussa paikassa.
      icon: tabler:package
      category: all
    - title: Mitä altaan hintaan sisältyy?
      description: Jokainen Inflatable Pool Factory-allas sisältää sähköisen ilmapumpun, korjaussarjan ja säilytyspussin. Pyöreissä malleissa on lisävarusteena asennettu kansi.
      icon: tabler:box
      category: all
    - title: Mitä kokoja on saatavilla?
      description: 48 standardia SKU:ta neljässä kokoelmassa – pyöreät altaat, joiden halkaisija on enintään 10 m, suorakaiteen muotoiset altaat jopa 6 × 5 m ja SPA-altaat sisäänrakennetuilla istuimilla. Liikekumppaneille on saatavilla räätälöityjä kokoja.
      icon: tabler:ruler-2
      category: all
    - title: Millä pinnoilla allas voi seistä?
      description: 'Mikä tahansa tasainen, tasainen pinta, jossa ei ole teräviä esineitä – nurmikko, patio tai kansi. Hiomalevyä suositellaan karkeille pinnoille. Täytetty uima-allas on raskas: asenna vain alustalle, joka kestää täyden painon, ja arvioi ensin kohotetut kannet, parvekkeet ja katot rakenteellisesti.'
      icon: tabler:layout-grid
      category: all
    - title: Miten pidän veden puhtaana?
      description: Käytä suodatinpumppua, jos se on asennettu, kuori roskat, tarkista pH ja peitä allas, kun se ei ole käytössä. Veden säilyvyys riippuu altaan koosta, käytöstä ja suodatuksesta – testaa säännöllisesti sen sijaan, että luottaisi kiinteään aikatauluun.
      icon: tabler:droplet
      category: all
