features:
  id: features
  tagline: Drop Stitch -tekniikka
  title: Miksi Inflatable Pool Factory-allas<br />On Erilainen
  subtitle: Korkeapaineinen Drop Stitch-rakenne tekee altaistamme jäykkiä, kestäviä ja vaivatonta säilyttää.
  columns: 2
  items:
    - title: Jäykät Drop Stitch seinät
      description: 'Tuhannet sisäkierteet lukitsevat seinäkerrokset yhteen, joten allas täyttyy jäykästi 4-5 PSI:llä ja säilyttää muotonsa täytettäessä.'
      icon: tabler:hexagon
    - title: Nopea, työkaluton asennus
      description: Täytä mukana tulevalla sähköpumpulla muutamassa minuutissa ja täytä sitten puutarhaletkulla. Ei työkaluja, ei rakentamista, ei ammattimaista asennusta.
      icon: tabler:rocket
    - title: Pakkaukset pois pieneksi
      description: 'Tyhjennä, tyhjennä, rullaa ja säilytä allas pussissaan talven yli – täysikokoinen allas, joka pakataan pieneksi sisäsäilytystä varten.'
      icon: tabler:package
    - title: Kestävä ja UV-kestävä
      description: 'Kaksikerroksinen PVC drop stitch -kangas, joka on suunniteltu kestämään puhkaisuja ja UV-altistusta koko perhekäytön ajan.'
      icon: tabler:shield
    - title: Täydellinen paketti
      description: Jokaisen uima-altaan mukana toimitetaan sähköinen ilmapumppu, korjaussarja ja säilytyspussi. Pyöreisiin malleihin saatavilla kiinteät kannet.
      icon: tabler:box
    - title: Turvallisuustietoinen suunnittelu
      description: 'Asuin uima-altaan suunnittelu, jossa viitataan standardeihin EN 16582-1 ja ASTM F2666 – mallikohtaiset turvallisuustiedot on annettu tuotedokumentaatiossa. Jatkuva aikuisen valvonta vaaditaan aina.'
      icon: tabler:shield-check
