hero:
  tagline: Tietoja meistä
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory puhallettava uima-allas
  title: |
    Uinti on helppoa, <br />
     <span class="text-accent dark:text-white">Inflatable Pool Factory</span>-tyyliin
  subtitle: Inflatable Pool Factory on Inflatable Pool Team · Qingdao Vatrad Groupin suunnittelema korkealuokkainen Drop Stitch puhallettava uima-allasbrändi. Uskomme, että jokainen perhe ansaitsee todellisen uima-altaan takapihalle ilman rakentamista, lupia tai pysyvää asennusta. Altaamme täyttyvät jäykäksi muutamassa minuutissa, selviytyvät koko perheen kesistä ja pakataan pieniksi kauden lopussa.
