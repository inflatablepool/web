hero:
  tagline: معلومات عنا
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: حوض سباحة قابل للنفخ في Inflatable Pool Factory
  title: |
    جعل السباحة بسيطة، <br />
    على طريقة <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory هي علامة تجارية فاخرة لحمام السباحة القابل للنفخ Drop Stitch من قبل Inflatable Pool Team · Qingdao Vatrad Group. نحن نؤمن بأن كل عائلة تستحق حمام سباحة حقيقي في الفناء الخلفي - بدون بناء أو تصاريح أو تركيب دائم. يتم نفخ حمامات السباحة الخاصة بنا بشكل قوي في دقائق، وتظل على قيد الحياة في الصيف الكامل من المرح العائلي، ويتم تعبئتها بكميات صغيرة في نهاية الموسم.
stats:
  title: بالأرقام
  columns: 4
  stats:
    - title: مجموعات حمامات السباحة
      amount: '4'
    - title: 'وقت النفخ'
      amount: '5-15 min'
    - title: الضغط المقدر
      amount: 4-5 PSI
    - title: اتصال
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: ما نبنيه
  subtitle: خط إنتاج مركّز نعرفه من الداخل إلى الخارج - حمامات سباحة قابلة للنفخ Drop Stitch عالية الضغط.
  columns: 3
  isBeforeContent: true
  items:
    - title: حمامات سباحة مستطيلة
      description: برك Drop Stitch مستطيلة بحجم عائلي تزيد من مساحة السباحة في مساحتك.
      icon: tabler:rectangle
    - title: حمامات سباحة زرقاء مستديرة
      description: حوض السباحة الكلاسيكي في الفناء الخلفي — أزرق نابض بالحياة، جدران Drop Stitch صلبة، وإعداد سريع.
      icon: tabler:circle
    - title: حمامات رمادية مستديرة
      description: خطنا المتميز ذو اللون الرمادي الحديث والغطاء الاختياري المجهز.
      icon: tabler:circle-dot
    - title: حوض استحمام ساخن حمامات سبا
      description: 'نماذج أحواض استحمام ساخنة معزولة بمقاعد مدمجة وقيعان معزولة 5 mm - للاستخدام مع السخانات الخارجية (السخان غير متضمن).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: حزم كاملة
      description: يأتي كل حمام سباحة مزودًا بمضخة هواء كهربائية ومجموعة إصلاح وحقيبة تخزين.
      icon: tabler:package
    - title: أحجام مخصصة
      description: أحجام وألوان وأغطية OEM للعلامات التجارية والموزعين ومشاريع الضيافة.
      icon: tabler:adjustments
    - title: تصنيع المعدات الأصلية / أوديإم
      description: تصنيع الملصقات الخاصة مع طباعة الشعار والتعبئة الجاهزة للبيع بالتجزئة.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: حمام سباحة Drop Stitch قابل للنفخ مستطيل من Inflatable Pool Factory
steps2_values:
  title: قيمنا
  subtitle: ثلاثة مبادئ تشكل كل حمام سباحة نبنيه.
  items:
    - title: قم بالبناء كما لو أن عائلتك سوف تستخدمه
      description: يتم التعامل مع كل التماس والجدار والصمام كما لو أن عائلاتنا سوف تسبح فيه.
      icon: tabler:heart
    - title: مهندس قبل أن نبيع
      description: هيكل Drop Stitch عالي الضغط، تم اختباره أعلى من الضغط المقدر، قبل شحن أي حمام سباحة.
      icon: tabler:settings
    - title: الدعم الذي يدوم هذا الموسم
      description: أسئلة أو قطع غيار أو ضمان — تواصل معنا عبر info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: المعالم
  subtitle: نسخة قصيرة من قصة Inflatable Pool Factory.
  isReversed: true
  items:
    - title: تركز على حمامات السباحة القابلة للنفخ
      description: 'تم تأسيس Inflatable Pool Factory بتركيز واحد: برك سباحة Drop Stitch قابلة للنفخ فاخرة.'
      icon: tabler:pool
    - title: ثلاث مجموعات التوقيع
      description: خطوط حمام سباحة مستطيلة، وزرقاء مستديرة، ورمادية مستديرة، كل منها مزود بأغطية اختيارية وأحجام مخصصة.
      icon: tabler:circle-check
    - title: OEM/ODM للشركاء في جميع أنحاء العالم
      description: تصنيع مخصص للعلامات التجارية والموزعين والفنادق ومشغلي التخييم.
      icon: tabler:world
features2_locations:
  title: تواصل معنا
  tagline: اتصال
  columns: 3
  items:
