hero_text:
  tagline: اتصال
  title: تواصل معنا
contact_form:
  id: form
  title: أرسل لنا رسالة
  subtitle: للحصول على عروض الأسعار أو الأسئلة الفنية أو استفسارات الشراكة، راسلنا. نقوم بالرد خلال يوم عمل واحد.
  email_to: info@inflatablepoolfactory.com
  submit_button: أرسل استفسار → احصل على عرض أسعار
  success_message: شكرًا! لقد وصلت رسالتك إلى صندوق البريد الوارد لدينا. سوف نقوم بالرد خلال يوم عمل واحد.
  error_message: حدث خطأ أثناء إرسال رسالتك. يرجى المحاولة مرة أخرى أو مراسلتنا عبر البريد الإلكتروني مباشرة.
  default_country_code: '+86'
  captcha:
    label: 'مكافحة البريد العشوائي: الرجاء حل ما يلي'
  fields:
    - name: firstName
      label: الاسم الأول
      row: 1
    - name: lastName
      label: اسم العائلة
      row: 1
    - name: companyName
      label: اسم الشركة
      row: 2
    - name: address
      label: عنوان
      row: 3
    - name: zip
      label: الرمز البريدي / الرمز البريدي
      row: 4
    - name: country
      label: دولة
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: بريد إلكتروني
      row: 5
      type: email
    - name: tel
      label: هاتف
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: حجم الطلب المقدر
      row: 6
      type: select
      options:
        - value: ''
          label: حدد الحجم المقدر...
        - value: sample
          label: عينات/نماذج أولية فقط
        - value: 5-10
          label: 5-10 وحدات (موك القياسي)
        - value: 100-500
          label: 100-500 وحدة
        - value: 500-plus
          label: أكثر من 500 وحدة (تسعير الحجم)
    - name: customization
      label: التخصيص مطلوب؟
      row: 7
      type: select
      options:
        - value: ''
          label: حدد نوع التخصيص...
        - value: none
          label: المنتج القياسي (بدون تخصيص)
        - value: logo
          label: شعار مخصص/العلامة التجارية فقط
        - value: full
          label: OEM كامل (الحجم واللون والرسومات والتعبئة والتغليف)
        - value: consultation
          label: لست متأكدا - بحاجة إلى التشاور
    - name: productInterest
      label: تجمع الاهتمام
      row: 8
      type: select
      options:
        - value: ''
          label: اختر نوع المسبح...
        - value: all
          label: جميع حمامات السباحة / كتالوج كامل
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: موضوع
      row: 9
    - name: message
      label: رسالة
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: طرق أخرى للوصول إلينا
  columns: 3
  items:
    - title: استفسارات المبيعات
      description: عروض أسعار المجمعات وأسعار الجملة والطلبات بالجملة.
      icon: tabler:shopping-bag
    - title: الدعم الفني
      description: تعليمات الإعداد والإصلاحات وقطع الغيار وأسئلة الرعاية.
      icon: tabler:tool
    - title: تصنيع المعدات الأصلية / أوديإم
      description: الأحجام والألوان والأغلفة والعلامات التجارية والتغليف المخصصة.
      icon: tabler:palette
    - title: بريد إلكتروني
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: موقع إلكتروني
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: وقت الاستجابة
      description: نقوم بالرد خلال يوم عمل واحد.
      icon: tabler:clock
map:
  title: تواصل معنا
  subtitle: تواصل مع Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

