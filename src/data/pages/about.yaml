hero:
  tagline: About us
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory inflatable swimming pool
  title: |
    Making swimming simple, <br />
    the <span class="text-accent dark:text-white">Inflatable Pool Factory</span> way
  subtitle: 'Inflatable Pool Factory is a premium drop stitch inflatable pool brand by the Inflatable Pool Team at Qingdao Vatrad Group. We believe every family deserves a real pool in the backyard — without construction, permits, or a permanent installation. Our pools inflate rigid in minutes, survive full summers of family fun, and pack away small at season''s end.'

stats:
  title: By the numbers
  columns: 4
  stats:
    - title: Pool collections
      amount: '4'
    - title: Time to inflate
      amount: '5-15 min'
    - title: Rated pressure
      amount: '4-5 PSI'
    - title: Contact
      amount: info@inflatablepoolfactory.com

features3_what_we_build:
  title: What we build
  subtitle: A focused product line we know inside out — high-pressure drop stitch inflatable swimming pools.
  columns: 3
  isBeforeContent: true
  items:
    - title: Rectangular pools
      description: Family-size rectangular drop stitch pools that maximize the swimming area for your space.
      icon: tabler:rectangle
    - title: Round blue pools
      description: The classic backyard pool — vibrant blue, rigid drop stitch walls, fast setup.
      icon: tabler:circle
    - title: Round grey pools
      description: Our premium line with a modern grey finish and optional fitted cover.
      icon: tabler:circle-dot
    - title: Hot tub SPA pools
      description: Insulated hot tub models with built-in seats and 5 mm insulated bottoms — for use with external heaters (heater not included).
      icon: tabler:ripple

features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Complete packages
      description: Every pool ships with an electric air pump, repair kit, and storage bag.
      icon: tabler:package
    - title: Custom sizes
      description: OEM sizes, colors, and covers for brands, distributors, and hospitality projects.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Private-label manufacturing with logo printing and retail-ready packaging.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Inflatable Pool Factory rectangular drop stitch inflatable swimming pool

steps2_values:
  title: Our values
  subtitle: Three principles that shape every pool we build.
  items:
    - title: Build like your family will use it
      description: Every seam, wall, and valve is treated as if our own families will swim in it.
      icon: tabler:heart
    - title: Engineer before we sell
      description: High-pressure drop stitch construction, checked against the approved model specification before any pool ships.
      icon: tabler:settings
    - title: Support that outlasts the season
      description: Questions, spare parts, or warranty — contact us at info@inflatablepoolfactory.com.
      icon: tabler:headset

steps2_milestones:
  title: Milestones
  subtitle: A short version of the Inflatable Pool Factory story.
  isReversed: true
  items:
    - title: Focused on inflatable pools
      description: 'Inflatable Pool Factory was founded with a single focus: premium drop stitch inflatable swimming pools.'
      icon: tabler:pool
    - title: Three signature collections
      description: Rectangular, round blue, and round grey pool lines, each with optional covers and custom sizes.
      icon: tabler:circle-check
    - title: OEM/ODM for partners worldwide
      description: Custom manufacturing for brands, distributors, hotels, and glamping operators.
      icon: tabler:world

