hero:
  tagline: Apie mus
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory pripučiamas baseinas
  title: |
    Kad plaukimas būtų paprastas, <br />
    pagal <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory yra aukščiausios kokybės „Drop Stitch“ pripučiamų baseinų prekės ženklas, kurį sukūrė Inflatable Pool Team · Qingdao Vatrad Group. Manome, kad kiekviena šeima nusipelno tikro baseino kieme – be statybų, leidimų ar nuolatinio įrengimo. Mūsų baseinai išsipučia per kelias minutes, išgyvena visas šeimos linksmybių vasaras, o sezono pabaigoje supakuoja nedidelius.
