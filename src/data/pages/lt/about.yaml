  columns: 3
  isAfterContent: true
  items:
    - title: Sukomplektuotos pakuotės
      description: Kiekviename baseine yra elektrinis oro siurblys, remonto rinkinys ir laikymo krepšys.
      icon: tabler:package
    - title: Individualūs dydžiai
      description: OEM dydžiai, spalvos ir dangteliai prekės ženklams, platintojams ir svetingumo projektams.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Privačių etikečių gamyba su logotipo spausdinimu ir mažmeninei prekybai paruošta pakuotė.
      icon: tabler:palette
  image:
