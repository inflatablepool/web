hero:
  tagline: Apie mus
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory pripučiamas baseinas
  title: |
    Kad plaukimas būtų paprastas, <br />
    pagal <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory yra aukščiausios kokybės „Drop Stitch“ pripučiamų baseinų prekės ženklas, kurį sukūrė Inflatable Pool Team · Qingdao Vatrad Group. Manome, kad kiekviena šeima nusipelno tikro baseino kieme – be statybų, leidimų ar nuolatinio įrengimo. Mūsų baseinai išsipučia per kelias minutes, išgyvena visas šeimos linksmybių vasaras, o sezono pabaigoje supakuoja nedidelius.
stats:
  title: Pagal skaičius
  columns: 4
  stats:
    - title: Baseino kolekcijos
      amount: '4'
    - title: 'Pripūtimo laikas'
      amount: '5-15 min'
    - title: Vardinis slėgis
      amount: 4-5 PSI
    - title: Susisiekite
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: Ką statome
  subtitle: Tikslinga produktų linija, kurią žinome iš vidaus – aukšto slėgio „Drop Stitch“ pripučiami baseinai.
  columns: 3
  isBeforeContent: true
  items:
    - title: Stačiakampiai baseinai
      description: Šeimos dydžio stačiakampiai „Drop Stitch“ baseinai, kurie maksimaliai padidina jūsų erdvės plaukimo zoną.
      icon: tabler:rectangle
    - title: Apvalūs mėlyni baseinai
      description: Klasikinis kiemo baseinas – ryškiai mėlyna, standžios Drop Stitch sienos, greitas montavimas.
      icon: tabler:circle
    - title: Apvalūs pilki baseinai
      description: Mūsų aukščiausios kokybės linija su modernia pilka apdaila ir pasirenkamu uždėtu dangteliu.
      icon: tabler:circle-dot
    - title: Sūkurinės vonios SPA baseinai
      description: 'Izoliuotų kubilų modeliai su įmontuotomis sėdynėmis ir 5 mm izoliuotu dugnu – skirti naudoti su išoriniais šildytuvais (šildytuvas neįeina).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Sukomplektuotos pakuotės
      description: Kiekviename baseine yra elektrinis oro siurblys, remonto rinkinys ir laikymo krepšys.
      icon: tabler:package
    - title: Individualūs dydžiai
      description: OEM dydžiai, spalvos ir dangteliai prekės ženklams, platintojams ir svetingumo projektams.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Privačių etikečių gamyba su logotipo spausdinimu ir mažmeninei prekybai paruošta pakuotė.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Inflatable Pool Factory stačiakampis Drop Stitch pripučiamas baseinas
steps2_values:
  title: Mūsų vertybės
  subtitle: Trys principai, kurie formuoja kiekvieną mūsų statomą baseiną.
  items:
    - title: Kurkite taip, kaip tuo naudosis jūsų šeima
      description: Su kiekviena siūle, siena ir vožtuvu elgiamasi taip, lyg joje plauks mūsų pačių šeimos.
      icon: tabler:heart
    - title: Inžinierius prieš parduodant
      description: Aukšto slėgio „Drop Stitch“ konstrukcija, išbandyta virš vardinio slėgio, prieš siunčiant baseiną.
      icon: tabler:settings
    - title: Parama, kuri trunka ilgiau nei sezoną
      description: Klausimai, atsarginės dalys ar garantija — susisiekite su mumis adresu info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: Gairės
  subtitle: Trumpa Inflatable Pool Factory istorijos versija.
  isReversed: true
  items:
    - title: Orientuota į pripučiamus baseinus
      description: '„Inflatable Pool Factory“ buvo įkurta vienu tikslu: aukščiausios kokybės „Drop Stitch“ pripučiamiems baseinams.'
      icon: tabler:pool
    - title: Trys parašų rinkiniai
      description: Stačiakampės, apvalios mėlynos ir apvalios pilkos baseino linijos su pasirenkamais dangčiais ir pasirinktiniais dydžiais.
      icon: tabler:circle-check
    - title: OEM/ODM partneriams visame pasaulyje
      description: Gamyba pagal užsakymą prekių ženklams, platintojams, viešbučiams ir glamping operatoriams.
      icon: tabler:world
features2_locations:
  title: Susisiekite
  tagline: Susisiekite
  columns: 3
  items:
    - title: El. paštas
      description: info@inflatablepoolfactory.com
    - title: Svetainė
      description: inflatablepoolfactory.com — naršykite mūsų baseinuose ir paprašykite kainos pasiūlymo.
    - title: OEM / didmeninė prekyba
      description: Verslo partneriams galimi pasirinktiniai dydžiai, spalvos ir prekės ženklas.
