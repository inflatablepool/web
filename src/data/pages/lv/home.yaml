features:
  id: features
  tagline: Drop Stitch tehnoloģija
  title: Kāpēc Inflatable Pool Factory baseins<br />Ir Citādi
  subtitle: Augstspiediena Drop Stitch konstrukcija padara mūsu baseinus stingrus, izturīgus un viegli uzglabājamus.
  columns: 2
  items:
    - title: Stingras Drop Stitch sienas
      description: 'Tūkstošiem iekšējo vītņu savieno sienas slāņus, tāpēc baseins piepūšas stingrs ar nominālo 4-5 PSI un saglabā savu formu, kad tas ir piepildīts.'
      icon: tabler:hexagon
    - title: Ātra iestatīšana bez rīkiem
      description: Piepūšiet ar komplektā iekļauto elektrisko sūkni dažu minūšu laikā, pēc tam piepildiet ar dārza šļūteni. Nav instrumentu, nav konstrukcijas, nav profesionālas uzstādīšanas.
      icon: tabler:rocket
    - title: Pack Away Small
      description: 'Iztukšojiet, iztukšojiet, satiniet un uzglabājiet baseinu somā pa ziemu — pilna izmēra baseinu, kas ir mazs, lai uzglabātu iekštelpās.'
      icon: tabler:package
    - title: Izturīgs un UV izturīgs
      description: 'Divslāņu PVC drop stitch audums, kas izstrādāts tā, lai tas izturētu caurduršanu un UV iedarbību visas ģimenes lietošanas laikā.'
      icon: tabler:shield
    - title: Pilnīga pakete
      description: Katrs baseins tiek piegādāts ar elektrisko gaisa sūkni, remonta komplektu un uzglabāšanas maisiņu. Apaļajiem modeļiem pieejami iebūvēti vāki.
      icon: tabler:box
    - title: Drošību apzinīgs dizains
      description: 'Dzīvojamo baseinu dizains, kas atbilst EN 16582-1 un ASTM F2666 — modeļa specifiskā drošības informācija ir sniegta produkta dokumentācijā. Vienmēr nepieciešama pastāvīga pieaugušo uzraudzība.'
      icon: tabler:shield-check
