faqs:
  title: Bieži uzdotie jautājumi par piepūšamo baseinu
  subtitle: Bieži uzdotie jautājumi par Inflatable Pool Factory piepūšamajiem peldbaseiniem.
  columns: 2
  items:
    - title: Cik ilgi notiek iestatīšana?
      description: 'Piepumpēšana aizņem 5-15 minūtes ar komplektā iekļauto elektrisko gaisa sūkni atkarībā no modeļa. Uzpildīšanas laiks ir atkarīgs no baseina ietilpības un ūdens padeves.'
      icon: tabler:clock
      category: all
    - title: Cik stingrs ir Drop Stitch baseins?
      description: Ļoti stingrs. Drop Stitch sienas smagi piepūšas ar spiedienu 4–5 PSI — līdzīgi kā piepūšamajam airēšanas dēlim, tāpēc baseins saglabā savu formu, kad tas ir piepildīts ar ūdeni.
      icon: tabler:hexagon
      category: all
    - title: Vai bērni var izmantot baseinu?
      description: Jā, visu laiku ar aktīvu pieaugušo uzraudzību. Bērnus nekad nedrīkst atstāt bez uzraudzības baseinā vai tā tuvumā — ievērojiet rokasgrāmatu un vietējos drošības noteikumus.
      icon: tabler:users
      category: all
    - title: Kā es varu uzglabāt baseinu ziemā?
      description: Iztukšojiet ūdeni, iztukšojiet baseinu, ļaujiet tam pilnībā nožūt, pēc tam satiniet to un uzglabājiet komplektā iekļautajā uzglabāšanas maisiņā, kur nav sala.
      icon: tabler:package
      category: all
    - title: Kas ir iekļauts baseinā?
      description: Katrā Inflatable Pool Factory baseinā ir elektriskais gaisa sūknis, remonta komplekts un uzglabāšanas soma. Apaļajiem modeļiem pēc izvēles ir uzstādīts vāks.
      icon: tabler:box
      category: all
    - title: Kādi izmēri ir pieejami?
      description: 48 standarta SKU četrās kolekcijās — apaļie baseini ar diametru līdz 10 m, taisnstūrveida baseini līdz 6 × 5 m un SPA vannas ar iebūvētiem sēdekļiem. Biznesa partneriem ir pieejami pielāgoti izmēri.
      icon: tabler:ruler-2
      category: all
    - title: Uz kādām virsmām baseins var stāvēt?
      description: 'Jebkura plakana, līdzena virsma bez asiem priekšmetiem — zāliens, terase vai klājs. Uz raupjām virsmām ieteicams izmantot slīpētu loksni. Piepildīts baseins ir smags: uzstādiet tikai uz virsmas, kas iztur visu svaru, un vispirms ir jānovērtē paaugstināti klāji, balkoni un jumti.'
      icon: tabler:layout-grid
      category: all
    - title: Kā es varu uzturēt ūdeni tīru?
      description: Izmantojiet filtra sūkni, ja tas ir uzstādīts, noslaukiet gružus, pārbaudiet pH un pārklājiet baseinu, kad to neizmantojat. Tas, cik ilgi ūdens pietiks, ir atkarīgs no baseina lieluma, lietojuma un filtrēšanas — regulāri pārbaudiet, nevis paļaujieties uz noteiktu grafiku.
      icon: tabler:droplet
      category: all
