      icon: tabler:rocket
    - title: '3. darbība: <span class="font-medium">Peldēt visu vasaru</span>'
      description: Uzturiet ūdeni svaigu, veicot vienkāršu aprūpi — noslaukiet, pārklājiet un pārbaudiet pH līmeni kā jebkuram nelielam baseinam.
      icon: tabler:ripple
    - title: '4. darbība: <span class="font-medium">Glabājiet to prom</span>'
      description: Kad sezona beidzas, nosusiniet, nosusiniet, sarullējiet un uzglabājiet baseinu maisā līdz nākamajai vasarai.
      icon: tabler:package
