content_workshop:
  isReversed: true
  tagline: Uzņēmumiem
  title: Baseini biznesam,<br />Arī
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Inflatable Pool Factory biznesa partneriem</h3>
  items:
    - title: Īre brīvdienām un viesmīlība
      description: Sezonas viesu ērtības īrei brīvdienām, apskates vietām un modes preču veikaliem — ātri izvietojamas, viegli uzturamas, vienkārši uzglabājamas.
    - title: Mazumtirdzniecības un zīmolu partneri
      description: Vairumtirdzniecības programmas un mazumtirdzniecībai gatavi Drop Stitch baseini dārzu centriem, baseinu veikaliem un tiešsaistes veikaliem.
    - title: Pielāgota un privāta etiķete
      description: Pielāgoti izmēri, krāsas, vāki, logotipu drukāšana un mazumtirdzniecības iepakojumi zīmoliem — to izstrādājuši mūsu ražošanas partneri.
content_compliance:
  tagline: Aprūpe un drošība
  title: Viegli iegūt īpašumā,<br />Viegli mīlēt
  subtitle: No piegādes līdz pirmajai peldei līdz sezonas beigām, Inflatable Pool Factory baseina īpašumtiesības paliek vienkārši.
  items:
    - title: Iestatīšana minūtēs
      description: 'Izņemiet kastīti un piepūšiet ar komplektā iekļauto sūkni 5–15 minūtēs, pēc tam piepildiet ar dārza šļūteni — uzpildes laiks mainās atkarībā no baseina izmēra un ūdens padeves.'
      icon: tabler:rocket
    - title: Vienkārša ūdens kopšana
      description: Standarta 32/38 mm filtra sūkņa pieslēgvietas, regulāras pH pārbaudes un piestiprināts vāks apaļajiem modeļiem nodrošina ūdens tīrību.
      icon: tabler:droplet
    - title: Notīriet, iztukšojiet un uzglabājiet
      description: Iztukšojiet, nosusiniet, sarullējiet un iesaiņojiet baseinu tā uzglabāšanas maisiņā ziemai. Nav pastāvīgas instalācijas, kas jāuztur.
      icon: tabler:package
    - title: Drošība pirmajā vietā
      description: Bērni visu laiku ir aktīvi jāuzrauga pieaugušajam. Ievērojiet rokasgrāmatu, vietējos noteikumus un drošas lietošanas norādījumus.
      icon: tabler:shield-check
