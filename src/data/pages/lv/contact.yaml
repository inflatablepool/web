hero_text:
  tagline: Sazināties
  title: SAZINIETIES
contact_form:
  id: form
  title: Nosūtiet mums ziņu
  subtitle: Lai saņemtu piedāvājumus, tehniskus jautājumus vai partnerības jautājumus, rakstiet mums. Mēs atbildam vienas darba dienas laikā.
  email_to: info@inflatablepoolfactory.com
  submit_button: Sūtīt pieprasījumu → Saņemt piedāvājumu
  success_message: Paldies! Jūsu ziņojums ir nonācis mūsu iesūtnē. Mēs atbildēsim vienas darba dienas laikā.
  error_message: Nosūtot ziņojumu, radās kļūda. Lūdzu, mēģiniet vēlreiz vai rakstiet mums tieši.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: lūdzu, atrisiniet tālāk norādīto'
  fields:
    - name: firstName
      label: Vārds
      row: 1
    - name: lastName
      label: Uzvārds
      row: 1
    - name: companyName
      label: Uzņēmuma nosaukums
      row: 2
    - name: address
      label: Adrese
      row: 3
    - name: zip
      label: Pasta indekss
      row: 4
    - name: country
      label: Valsts
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-pasts
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Paredzamais pasūtījumu apjoms
      row: 6
      type: select
      options:
        - value: ''
          label: Atlasiet aptuveno apjomu...
        - value: sample
          label: Tikai paraugi/prototipi
        - value: 5-10
          label: 5–10 vienības (standarta MOQ)
        - value: 100-500
          label: 100–500 vienības
        - value: 500-plus
          label: Vairāk nekā 500 vienību (apjoma cena)
    - name: customization
      label: Nepieciešama pielāgošana?
      row: 7
      type: select
      options:
        - value: ''
          label: Izvēlieties pielāgošanas veidu...
        - value: none
          label: Standarta produkts (bez pielāgošanas)
        - value: logo
          label: Tikai pielāgots logotips/zīmols
        - value: full
          label: Pilns OEM (izmērs, krāsa, grafika, iepakojums)
        - value: consultation
          label: Neesat pārliecināts - nepieciešama konsultācija
    - name: productInterest
      label: Interešu fonds
      row: 8
      type: select
      options:
        - value: ''
          label: Izvēlieties baseina veidu...
        - value: all
          label: Visi baseini / Pilns katalogs
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Priekšmets
      row: 9
    - name: message
      label: Ziņojums
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Citi veidi, kā ar mums sazināties
  columns: 3
  items:
    - title: Pārdošanas jautājumi
      description: Baseina piedāvājumi, vairumtirdzniecības cenas un lielapjoma pasūtījumi.
      icon: tabler:shopping-bag
    - title: Tehniskais atbalsts
      description: Iestatīšanas palīdzība, remonts, rezerves daļas un kopšanas jautājumi.
      icon: tabler:tool
    - title: OEM / ODM
      description: Pielāgoti izmēri, krāsas, vāki, zīmols un iepakojums.
      icon: tabler:palette
    - title: E-pasts
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Tīmekļa vietne
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: Atbildes laiks
      description: Mēs atbildam vienas darba dienas laikā.
      icon: tabler:clock
map:
  title: Sazinieties
  subtitle: Sazinieties ar Felizbaju
  address: inflatablepoolfactory.com
  zoom: 15

