  isBeforeContent: true
  items:
    - title: Taisnstūra baseini
      description: Ģimenes izmēra taisnstūrveida Drop Stitch baseini, kas maksimāli palielina peldēšanas zonu jūsu telpai.
      icon: tabler:rectangle
    - title: Apaļi zili baseini
      description: Klasiskais piemājas baseins — koši zilas, stingras Drop Stitch sienas, ātra uzstādīšana.
      icon: tabler:circle
