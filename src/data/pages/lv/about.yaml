      description: Mūsu augstākās kvalitātes līnija ar modernu pelēku apdari un pēc izvēles piestiprinātu vāku.
      icon: tabler:circle-dot
    - title: Karstās vannas SPA baseini
      description: 'Izolēti burbuļvannu modeļi ar iebūvētiem sēdekļiem un 5 mm izolētiem dibeniem — izmantošanai ar ārējiem sildītājiem (sildītājs nav iekļauts komplektā).'
      icon: tabler:ripple
