hero:
  tagline: Par mums
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory piepūšamais peldbaseins
  title: |
    Peldēšana ir vienkārša, <br />
    pēc <span class="text-accent dark:text-white">Inflatable Pool Factory</span> parauga
  subtitle: Inflatable Pool Factory ir augstākās klases piepūšamo baseinu zīmols Drop Stitch, ko izstrādājis Inflatable Pool Team · Qingdao Vatrad Group. Mēs uzskatām, ka katra ģimene ir pelnījusi īstu baseinu pagalmā — bez būvniecības, atļaujām vai pastāvīgas uzstādīšanas. Mūsu baseini dažu minūšu laikā kļūst stingrāki, izdzīvo visas vasaras ģimenes izklaidēs un sezonas beigās iepako mazus.
