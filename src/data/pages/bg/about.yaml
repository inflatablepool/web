hero:
  tagline: За нас
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Надуваем басейн Inflatable Pool Factory
  title: |
    Опростяване на плуването, <br />
    в стила на <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory е първокласна марка за надуваеми басейни Drop Stitch, проектирана от Inflatable Pool Team · Qingdao Vatrad Group. Вярваме, че всяко семейство заслужава истински басейн в задния двор - без строителство, разрешителни или постоянна инсталация. Нашите басейни се надуват стабилно за минути, преживяват пълни лета на семейни забавления и се събират малки в края на сезона.
