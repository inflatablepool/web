features3_what_we_build:
  title: Какво изграждаме
  subtitle: Фокусирана продуктова линия, която познаваме отвътре навън — надуваеми басейни Drop Stitch с високо налягане.
  columns: 3
  isBeforeContent: true
  items:
    - title: Правоъгълни басейни
      description: Правоъгълни Drop Stitch басейни със семеен размер, които увеличават максимално площта за плуване за вашето пространство.
      icon: tabler:rectangle
    - title: Кръгли сини басейни
      description: Класическият басейн в задния двор — ярко синьо, твърди стени Drop Stitch, бърза настройка.
      icon: tabler:circle
    - title: Кръгли сиви басейни
      description: Нашата първокласна линия с модерно сиво покритие и опционално монтирано покритие.
      icon: tabler:circle-dot
    - title: Гореща вана СПА басейни
      description: 'Изолирани модели с гореща вана с вградени седалки и 5 mm изолирани дъна — за използване с външни нагреватели (нагревателят не е включен).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Пълни пакети
      description: Всеки басейн се доставя с електрическа въздушна помпа, ремонтен комплект и чанта за съхранение.
      icon: tabler:package
    - title: Персонализирани размери
      description: OEM размери, цветове и корици за марки, дистрибутори и хотелиерски проекти.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Производство на собствена марка с отпечатване на лого и опаковки, готови за продажба на дребно.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Правоъгълен надуваем басейн Inflatable Pool Factory Drop Stitch
steps2_values:
  title: Нашите ценности
  subtitle: Три принципа, които оформят всеки басейн, който изграждаме.
  items:
    - title: Изградете така, сякаш вашето семейство ще го използва
      description: Всеки шев, стена и клапа се третират така, сякаш собствените ни семейства ще плуват в тях.
      icon: tabler:heart
    - title: Инженер преди да продадем
      description: Конструкция Drop Stitch с високо налягане, тествана над номиналното си налягане, преди да бъде изпратен басейн.
      icon: tabler:settings
    - title: Поддръжка, която надживява сезона
      description: Questions, spare parts, or warranty — reach us any time at info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: Важни етапи
  subtitle: Кратка версия на историята на Inflatable Pool Factory.
  isReversed: true
  items:
    - title: Фокусира се върху надуваемите басейни
      description: 'Inflatable Pool Factory е основана с един единствен фокус: първокласни надуваеми басейни Drop Stitch.'
      icon: tabler:pool
    - title: Три колекции от подписи
      description: Правоъгълни, кръгли сини и кръгли сиви линии за басейн, всяка с опционални капаци и персонализирани размери.
      icon: tabler:circle-check
    - title: OEM/ODM за партньори по целия свят
      description: Производство по поръчка за марки, дистрибутори, хотели и оператори на глемпинг.
      icon: tabler:world
