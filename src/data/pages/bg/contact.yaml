hero_text:
  tagline: Контакт
  title: СВЪРЖЕТЕ СЕ
contact_form:
  id: form
  title: Изпратете ни съобщение
  subtitle: За оферти, технически въпроси или запитвания за партньорство, пишете ни.
  email_to: info@inflatablepoolfactory.com
  submit_button: Изпратете запитване → Получете оферта
  success_message: благодаря Вашето съобщение пристигна в нашата пощенска кутия.
  error_message: Нещо се обърка при изпращането на вашето съобщение. Моля, опитайте отново или ни пишете директно.
  default_country_code: '+86'
  captcha:
    label: 'Анти-спам: моля, решете следното'
  fields:
    - name: firstName
      label: Първо име
      row: 1
    - name: lastName
      label: Фамилия
      row: 1
    - name: companyName
      label: Име на компанията
      row: 2
    - name: address
      label: Адрес
      row: 3
    - name: zip
      label: Пощенски код
      row: 4
    - name: country
      label: държава
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: Имейл
      row: 5
      type: email
    - name: tel
      label: ТЕЛ
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Очакван обем на поръчката
      row: 6
      type: select
      options:
        - value: ''
          label: Изберете своя прогнозен обем...
        - value: sample
          label: Само мостри / прототипи
        - value: 100-500
          label: 100–500 единици
        - value: 500-plus
          label: 500+ единици (ценообразуване на обем)
    - name: customization
      label: Необходима ли е персонализация?
      row: 7
      type: select
      options:
        - value: ''
          label: Изберете тип персонализиране...
        - value: none
          label: Стандартен продукт (без персонализиране)
        - value: logo
          label: Само персонализирано лого/брандиране
        - value: full
          label: Пълен OEM (размер, цвят, графика, опаковка)
        - value: consultation
          label: Не съм сигурен — имам нужда от консултация
    - name: productInterest
      label: Пул от интереси
      row: 8
      type: select
      options:
        - value: ''
          label: Изберете тип басейн...
        - value: all
          label: Всички басейни / Пълен каталог
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Предмет
      row: 9
    - name: message
      label: Съобщение
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Други начини да стигнете до нас
  columns: 3
  items:
    - title: Запитвания за продажби
      description: Обединени котировки, цени на едро и групови поръчки.
      icon: tabler:shopping-bag
    - title: Техническа поддръжка
      description: Помощ за настройка, ремонти, резервни части и въпроси за поддръжка.
      icon: tabler:tool
    - title: OEM / ODM
      description: Персонализирани размери, цветове, корици, марка и опаковки.
      icon: tabler:palette
    - title: Имейл
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: уебсайт
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Свържете се с нас
  subtitle: Свържете се с Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

