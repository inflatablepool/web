hero_text:
  tagline: Kontakte
  title: TA KONTAKT
contact_form:
  id: form
  title: Send os en besked
  subtitle: For tilbud, tekniske spørgsmål eller partnerskabsforespørgsler, send os en linje.
  email_to: info@inflatablepoolfactory.com
  submit_button: Send forespørgsel → Få et tilbud
  success_message: Tak! Din besked er landet i vores indbakke.
  error_message: Noget gik galt med at sende din besked. Prøv venligst igen eller send os en e-mail direkte.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: løs venligst følgende'
  fields:
    - name: firstName
      label: Fornavn
      row: 1
    - name: lastName
      label: Efternavn
      row: 1
    - name: companyName
      label: Firmanavn
      row: 2
    - name: address
      label: Adresse
      row: 3
    - name: zip
      label: Postnummer
      row: 4
    - name: country
      label: Land
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TLF
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Estimeret ordrevolumen
      row: 6
      type: select
      options:
        - value: ''
          label: Vælg din estimerede mængde...
        - value: sample
          label: Kun prøver/prototyper
        - value: 100-500
          label: 100-500 enheder
        - value: 500-plus
          label: 500+ enheder (volumenpris)
    - name: customization
      label: Brug for tilpasning?
      row: 7
      type: select
      options:
        - value: ''
          label: Vælg tilpasningstype...
        - value: none
          label: Standardprodukt (ingen tilpasning)
        - value: logo
          label: Kun tilpasset logo/branding
        - value: full
          label: OEM (størrelse, farve, grafik, emballage)
        - value: consultation
          label: Ikke sikker - har brug for konsultation
    - name: productInterest
      label: Interessepulje
      row: 8
      type: select
      options:
        - value: ''
          label: Vælg pooltype...
        - value: all
          label: Alle pools / Fuldt katalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Emne
      row: 9
    - name: message
      label: Besked
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Andre måder at nå os på
  columns: 3
  items:
    - title: Salgsforespørgsler
      description: Puljetilbud, engrospriser og masseordrer.
      icon: tabler:shopping-bag
    - title: Teknisk support
      description: Opsætningshjælp, reparationer, reservedele og plejespørgsmål.
      icon: tabler:tool
    - title: OEM / ODM
      description: Brugerdefinerede størrelser, farver, covers, branding og emballage.
      icon: tabler:palette
    - title: E-mail
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Hjemmeside
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Tag kontakt
  subtitle: Kontakt Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

