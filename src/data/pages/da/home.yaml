content_compliance:
  tagline: Pleje & Sikkerhed
  title: Nem at eje,<br />Nem at elske
  subtitle: Fra levering til første svømmetur til slut-af-sæsonopbevaring forbliver det enkelt at eje en Inflatable Pool Factory-pool.
  items:
    - title: Opsætning på få minutter
      description: 'Pak ud og pust op med den medfølgende pumpe på 5-15 minutter, og fyld derefter med en haveslange - påfyldningstiden varierer med poolstørrelse og vandforsyning.'
      icon: tabler:rocket
    - title: Enkel vandpleje
      description: Standard 32/38 mm filterpumpeporte, regelmæssige pH-kontroller og et monteret dæksel på runde modeller holder vandet rent.
      icon: tabler:droplet
    - title: Rengør, dræn og opbevar
      description: Dræn, tør, rul sammen og pak poolen i opbevaringstasken til vinteren. Ingen permanent installation at vedligeholde.
      icon: tabler:package
    - title: Sikkerhed først
      description: Børn skal til enhver tid være aktivt under opsyn af en voksen. Følg manualen, lokale regler og vejledning om sikker brug.
      icon: tabler:shield-check
steps:
  title: Fra kasse til baghave
  items:
    - title: 'Trin 1: <span class="font-medium">Vælg din pool</span>'
      description: Sammenlign former og størrelser for at matche dit rum, din husstand, og hvordan du planlægger at bruge vandet.
      icon: tabler:pool
    - title: 'Trin 2: <span class="font-medium">Sæt det op</span>'
      description: Placer på et fast, plant underlag, pust op med den medfølgende elektriske pumpe, og fyld med en haveslange.
      icon: tabler:rocket
    - title: 'Trin 3: <span class="font-medium">Svøm hele sommeren</span>'
      description: Hold vandet frisk med enkel omhu - skum, dæk og kontroller pH som enhver lille pool.
      icon: tabler:ripple
    - title: 'Trin 4: <span class="font-medium">Gem det væk</span>'
      description: Når sæsonen slutter, skal du dræne, tørre, rulle op og opbevare poolen i posen indtil næste sommer.
      icon: tabler:package
