features:
  id: features
  tagline: Drop Stitch-teknologi
  title: Hvorfor en Inflatable Pool Factory Pool<br />er anderledes
  subtitle: Højtryks-Drop Stitch-konstruktion gør vores pools stive, holdbare og ubesværede at opbevare.
  columns: 2
  items:
    - title: Stive Drop Stitch-vægge
      description: 'Tusindvis af indvendige gevind låser væglagene sammen, så poolen puster sig stivt op med de nominelle 4-5 PSI og holder sin form, når den fyldes.'
      icon: tabler:hexagon
    - title: Hurtig, værktøjsfri opsætning
      description: Pust op med den medfølgende elektriske pumpe på få minutter, og fyld derefter med en haveslange. Ingen værktøj, ingen konstruktion, ingen professionel installation.
      icon: tabler:rocket
    - title: Pakker småt væk
      description: 'Tøm, tøm luften ud, rul op og opbevar poolen i tasken over vinteren - en pool i fuld størrelse, der pakkes ned til indendørs opbevaring.'
      icon: tabler:package
    - title: Holdbar og UV-bestandig
      description: 'Dobbelt-lags PVC drop stitch stof, konstrueret til at modstå punkteringer og UV-eksponering gennem en hel sæson med familiebrug.'
      icon: tabler:shield
    - title: Komplet pakke
      description: Hver pool leveres med en elektrisk luftpumpe, reparationssæt og opbevaringstaske. Monterede betræk fås til runde modeller.
      icon: tabler:box
    - title: Sikkerhedsbevidst design
      description: 'Pooldesign til beboelse, der refererer til EN 16582-1 og ASTM F2666 — modelspecifik sikkerhedsinformation findes i produktdokumentationen. Konstant voksenopsyn er altid påkrævet.'
      icon: tabler:shield-check
