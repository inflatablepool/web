hero:
  tagline: Om os
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory oppustelig swimmingpool
  title: |
    Gør svømning enkel, <br />
    på <span class="text-accent dark:text-white">Inflatable Pool Factory</span>-vis
  subtitle: Inflatable Pool Factory er et premium drop stitch oppustelig poolmærke designet af Inflatable Pool Team · Qingdao Vatrad Group. Vi mener, at enhver familie fortjener en rigtig pool i baghaven - uden byggeri, tilladelser eller en permanent installation. Vores pools pustes op på få minutter, overlever hele somre med familiehygge og pakker småt sammen ved sæsonens afslutning.
