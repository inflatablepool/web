hero:
  tagline: Biz haqimizda
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory shamollatiladigan suzish havzasi
  title: |
    Suzishni oddiy qilish, <br />
     <span class="text-accent dark:text-white">Inflatable Pool Factory</span> uslubida
  subtitle: Inflatable Pool Factory - bu Inflatable Pool Team · Qingdao Vatrad Group tomonidan ishlab chiqilgan yuqori sifatli Drop Stitch puflama hovuz brendidir. Biz ishonamizki, har bir oila hovlida haqiqiy hovuzga loyiqdir - qurilish, ruxsatnomalar yoki doimiy o'rnatishsiz. Bizning basseynlarimiz bir necha daqiqada qattiq shishiradi, to'liq yozda oilaviy o'yin-kulgidan omon qoladi va mavsum oxirida kichik hajmda yig'iladi.
