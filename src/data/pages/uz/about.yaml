features3_what_we_build:
  title: Biz nima quramiz
  subtitle: Biz biladigan yo'naltirilgan mahsulot liniyasi - yuqori bosimli Drop Stitch shishiriladigan suzish havzalari.
  columns: 3
  isBeforeContent: true
  items:
    - title: To'rtburchak hovuzlar
      description: Sizning makoningiz uchun suzish maydonini maksimal darajada oshiradigan oilaviy o'lchamdagi to'rtburchaklar Drop Stitch hovuzlari.
      icon: tabler:rectangle
    - title: Dumaloq ko'k hovuzlar
      description: Klassik hovli hovuzi - jonli ko'k, qattiq Drop Stitch devorlari, tez sozlash.
      icon: tabler:circle
    - title: Dumaloq kulrang hovuzlar
      description: Zamonaviy kulrang qoplama va ixtiyoriy o'rnatilgan qopqoq bilan bizning premium liniyamiz.
      icon: tabler:circle-dot
    - title: Issiq vanna SPA basseynlari
      description: 'O''rnatilgan o''rindiqli va 5 mm izolyatsiyalangan taglikka ega izolyatsiyalangan issiq vannalar modellari - tashqi isitgichlar bilan ishlash uchun (isitgich qo''shilmaydi).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: To'liq paketlar
      description: Har bir hovuz elektr havo pompasi, ta'mirlash to'plami va saqlash sumkasi bilan birga keladi.
      icon: tabler:package
    - title: Maxsus o'lchamlar
      description: Brendlar, distribyutorlar va mehmondo'stlik loyihalari uchun OEM o'lchamlari, ranglari va qoplamalari.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Logotip chop etish va chakana savdoga tayyor qadoqlash bilan xususiy yorliqli ishlab chiqarish.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Inflatable Pool Factory to'rtburchaklar Drop Stitch shishiriladigan suzish havzasi
