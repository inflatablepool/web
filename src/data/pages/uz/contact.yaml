hero_text:
  tagline: Aloqa
  title: ALOQA BO'LING
contact_form:
  id: form
  title: Bizga xabar yuboring
  subtitle: Kotirovkalar, texnik savollar yoki hamkorlik so'rovlari uchun bizga liniyani qoldiring. Biz bir ish kuni ichida javob beramiz.
  email_to: info@inflatablepoolfactory.com
  submit_button: So'rov yuboring → Narx oling
  success_message: Rahmat! Sizning xabaringiz pochta qutimizga tushdi. Biz bir ish kuni ichida javob beramiz.
  error_message: Xabarni yuborishda nimadir xato ketdi. Iltimos, qayta urinib ko'ring yoki bizga to'g'ridan-to'g'ri elektron pochta orqali yuboring.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: iltimos, quyidagilarni hal qiling'
  fields:
    - name: firstName
      label: Ism
      row: 1
    - name: lastName
      label: Familiya
      row: 1
    - name: companyName
      label: Shirkat nomi
      row: 2
    - name: address
      label: Manzil
      row: 3
    - name: zip
      label: Pochta / pochta indeksi
      row: 4
    - name: country
      label: Mamlakat
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Taxminiy buyurtma hajmi
      row: 6
      type: select
      options:
        - value: ''
          label: Taxminiy hajmni tanlang...
        - value: sample
          label: Namunalar/faqat prototiplar
        - value: 5-10
          label: 5–10 birlik (Standart MOQ)
        - value: 100-500
          label: 100-500 birlik
        - value: 500-plus
          label: 500+ birlik (Hajm narxi)
    - name: customization
      label: Moslashtirish kerakmi?
      row: 7
      type: select
      options:
        - value: ''
          label: Moslashtirish turini tanlang...
        - value: none
          label: Standart mahsulot (sozlash yo'q)
        - value: logo
          label: Faqatgina maxsus logotip / brending
        - value: full
          label: To'liq OEM (hajmi, rangi, grafikasi, qadoqlash)
        - value: consultation
          label: Ishonchim komil emas - maslahat kerak
    - name: productInterest
      label: Qiziqishlar hovuzi
      row: 8
      type: select
      options:
        - value: ''
          label: Hovuz turini tanlang...
        - value: all
          label: Barcha hovuzlar / To'liq katalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Mavzu
      row: 9
    - name: message
      label: Xabar
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Biz bilan bog'lanishning boshqa usullari
  columns: 3
  items:
    - title: Savdo so'rovlari
      description: Hovuz kotirovkalari, ulgurji narxlar va ommaviy buyurtmalar.
      icon: tabler:shopping-bag
    - title: Texnik yordam
      description: O'rnatish bo'yicha yordam, ta'mirlash, ehtiyot qismlar va parvarish bo'yicha savollar.
      icon: tabler:tool
    - title: OEM / ODM
      description: Maxsus o'lchamlar, ranglar, qopqoqlar, brending va qadoqlash.
      icon: tabler:palette
    - title: Elektron pochta
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Veb-sayt
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: Javob vaqti
      description: Biz bir ish kuni ichida javob beramiz.
      icon: tabler:clock
map:
  title: Aloqa qiling
  subtitle: Inflatable Pool Factory bilan bog'laning
  address: inflatablepoolfactory.com
