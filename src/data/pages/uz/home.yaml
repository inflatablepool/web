features:
  id: features
  tagline: Drop Stitch texnologiyasi
  title: Nima uchun Inflatable Pool Factory hovuzi<br />Turli
  subtitle: Yuqori bosimli Drop Stitch konstruktsiyasi bizning hovuzlarimizni qattiq, bardoshli va saqlashni osonlashtiradi.
  columns: 2
  items:
    - title: Qattiq Drop Stitch devorlari
      description: 'Minglab ichki iplar devor qatlamlarini bir-biriga bog''lab turadi, shuning uchun hovuz 4-5 PSI nominalida qattiq shishiradi va to''ldirilganda shaklini saqlaydi.'
      icon: tabler:hexagon
    - title: Tez, asboblarsiz sozlash
      description: Bir necha daqiqada kiritilgan elektr nasos bilan puflang, keyin bog 'shlangi bilan to'ldiring. Asboblar, qurilish yo'q, professional o'rnatish yo'q.
      icon: tabler:rocket
    - title: Kichik paketlar
      description: 'Hovuzni to''kib tashlang, o''chiring, o''rab oling va qishda o''z sumkasida saqlang - yopiq xonada saqlash uchun kichik hajmdagi to''liq o''lchamli hovuz.'
      icon: tabler:package
    - title: Bardoshli va UV nuriga chidamli
      description: 'Ikki qavatli PVC drop stitch mato, oilaviy foydalanishning to''liq mavsumi davomida teshilish va UV ta''siriga qarshi turish uchun ishlab chiqilgan.'
      icon: tabler:shield
    - title: Toʻliq toʻplam
      description: Har bir hovuz elektr havo pompasi, ta'mirlash to'plami va saqlash sumkasi bilan birga keladi. Dumaloq modellar uchun o'rnatilgan qopqoqlar mavjud.
      icon: tabler:box
    - title: Xavfsizlik nuqtai nazaridan dizayn
      description: 'EN 16582-1 va ASTM F2666 standartlariga mos keladigan turar-joy hovuzining dizayni - modelga oid xavfsizlik ma''lumotlari mahsulot hujjatlarida keltirilgan. Doimiy kattalar nazorati doimo talab qilinadi.'
      icon: tabler:shield-check
