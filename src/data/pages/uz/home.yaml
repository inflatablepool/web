  items:
    - title: Oilalar uchun hovli hovuzlari
      description: Kosmosni rejalashtirish, haqiqiy foydalanish mumkin bo'lgan o'lchamlar va hovlida oilaviy yoz uchun oson parvarishlash.
      icon: tabler:home
      cta: Fikrlarni oling
      cta_href: /pool-ideas/backyard-pools-for-families
    - title: Kichik hovlilar uchun hovuzlar
      description: 'Qattiq tashqi makonlarga mos keladigan ixcham yumaloq va kvadrat modellar - salqinlash uchun xona va oilaviy suv vaqti.'
      icon: tabler:layout-grid
      cta: Fikrlarni oling
      cta_href: /pool-ideas/pools-for-small-backyards
    - title: Yig'ilishlar uchun katta hovuzlar
      description: Yoz kunlarida butun ekipaj uchun haqiqiy suzish maydoni bo'lgan katta to'rtburchaklar hovuzlar.
      icon: tabler:users
      cta: Fikrlarni oling
      cta_href: /pool-ideas/large-pools-for-family-gatherings
    - title: Ochiq havoda namlash va dam olish
      description: Uyda har kuni shamollash uchun o'rnatilgan o'rindiqli va izolyatsiyalangan tagliklari bo'lgan SPA vannalari.
      icon: tabler:ripple
      cta: Fikrlarni oling
      cta_href: /pool-ideas/outdoor-soaking-pools
    - title: Dam olish uchun ijaraga olingan basseynlar
      description: Tez o'rnatiladigan va mavsumdan tashqari saqlanadigan mavsumiy mehmonlar uchun qulaylik.
      icon: tabler:beach
      cta: Fikrlarni oling
      cta_href: /pool-ideas/pools-for-vacation-rentals
    - title: Glamping va mehmondo'stlik
      description: O'ziga xos ochiq turar joy - glamping saytlari, butiklar va tadbirlar o'tkaziladigan joylar.
      icon: tabler:tent
      cta: Fikrlarni oling
      cta_href: /pool-ideas/pools-for-glamping-and-hospitality
content_categories:
  tagline: Do'konlar basseynlari
  title: Hovuzlarimizni o'rganing
