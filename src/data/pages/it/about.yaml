      description: Ogni cucitura, parete e valvola viene trattata come se le nostre stesse famiglie vi nuotassero dentro.
      icon: tabler:heart
    - title: Ingegnere prima di vendere
      description: Costruzione Drop Stitch ad alta pressione, testata al di sopra della pressione nominale, prima di qualsiasi spedizione in piscina.
      icon: tabler:settings
    - title: Supporto che dura tutta la stagione
      description: Questions, spare parts, or warranty — reach us any time at info@inflatablepoolfactory.com.
      icon: tabler:headset
