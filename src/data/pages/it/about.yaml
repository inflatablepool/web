hero:
  tagline: Chi siamo
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Piscina gonfiabile Inflatable Pool Factory
  title: |
    Rendere il nuoto semplice, <br />
    alla <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory è un marchio premium di piscine gonfiabili Drop Stitch progettato da Inflatable Pool Team · Qingdao Vatrad Group. Crediamo che ogni famiglia meriti una vera piscina nel cortile di casa, senza costruzioni, permessi o installazioni permanenti. Le nostre piscine si gonfiano in pochi minuti, sopravvivono a estati piene di divertimento in famiglia e si ripongono in piccole dimensioni alla fine della stagione.
