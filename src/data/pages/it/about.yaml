  columns: 3
  isAfterContent: true
  items:
    - title: Pacchetti completi
      description: Ogni piscina viene fornita con una pompa ad aria elettrica, un kit di riparazione e una custodia.
      icon: tabler:package
    - title: Dimensioni personalizzate
      description: Dimensioni, colori e coperture OEM per marchi, distributori e progetti di ospitalità.
      icon: tabler:adjustments
    - title: OEM/ODM
      description: Produzione a marchio privato con stampa del logo e confezione pronta per la vendita al dettaglio.
