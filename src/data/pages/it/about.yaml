features3_what_we_build:
  title: Cosa costruiamo
  subtitle: 'Una linea di prodotti mirata che conosciamo a fondo: piscine gonfiabili Drop Stitch ad alta pressione.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Piscine rettangolari
      description: Piscine Drop Stitch rettangolari per famiglie che massimizzano l'area di nuoto per il tuo spazio.
      icon: tabler:rectangle
    - title: Piscine blu rotonde
      description: 'La classica piscina da giardino: blu vibrante, pareti rigide Drop Stitch, installazione rapida.'
      icon: tabler:circle
    - title: Piscine rotonde grigie
      description: La nostra linea premium con una moderna finitura grigia e copertura attrezzata opzionale.
      icon: tabler:circle-dot
    - title: Piscine SPA con idromassaggio
      description: 'Modelli di vasche idromassaggio isolate con sedili integrati e fondo isolato da 5 mm - da utilizzare con riscaldatori esterni (riscaldatore non incluso).'
      icon: tabler:ripple
