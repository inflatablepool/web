hero_text:
  tagline: Contatto
  title: METTITI IN CONTATTO
contact_form:
  id: form
  title: Mandaci un messaggio
  subtitle: Per preventivi, domande tecniche o richieste di partnership, scriveteci.
  email_to: info@inflatablepoolfactory.com
  submit_button: Invia richiesta → Richiedi un preventivo
  success_message: Grazie! Il tuo messaggio è arrivato nella nostra casella di posta.
  error_message: Qualcosa è andato storto durante l'invio del tuo messaggio. Riprova o inviaci direttamente un'e-mail.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: risolvere quanto segue'
  fields:
    - name: firstName
      label: Nome di battesimo
      row: 1
    - name: lastName
      label: Cognome
      row: 1
    - name: companyName
      label: Nome dell'azienda
      row: 2
    - name: address
      label: Indirizzo
      row: 3
    - name: zip
      label: Zip / Codice postale
      row: 4
    - name: country
      label: Paese
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Volume degli ordini stimato
      row: 6
      type: select
      options:
        - value: ''
          label: Seleziona il volume stimato...
        - value: sample
          label: Solo campioni/prototipi
        - value: 100-500
          label: 100-500 unità
        - value: 500-plus
          label: Oltre 500 unità (prezzi a volume)
    - name: customization
      label: Personalizzazione necessaria?
      row: 7
      type: select
      options:
        - value: ''
          label: Seleziona il tipo di personalizzazione...
        - value: none
          label: Prodotto standard (nessuna personalizzazione)
        - value: logo
          label: Solo logo/marchio personalizzato
        - value: full
          label: OEM (dimensioni, colore, grafica, confezione)
        - value: consultation
          label: 'Non sono sicuro: ho bisogno di una consulenza'
    - name: productInterest
      label: Gruppo di interesse
      row: 8
      type: select
      options:
        - value: ''
          label: Seleziona il tipo di piscina...
        - value: all
          label: Tutte le piscine / Catalogo completo
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Soggetto
      row: 9
    - name: message
      label: Messaggio
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Altri modi per raggiungerci
  columns: 3
  items:
    - title: Richieste di vendita
      description: Preventivi in ​​pool, prezzi all'ingrosso e ordini all'ingrosso.
      icon: tabler:shopping-bag
    - title: Supporto tecnico
      description: Aiuto per l'installazione, riparazioni, pezzi di ricambio e domande sulla cura.
      icon: tabler:tool
    - title: OEM/ODM
      description: Dimensioni, colori, copertine, marchio e packaging personalizzati.
      icon: tabler:palette
    - title: E-mail
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Sito web
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Mettiti in contatto
  subtitle: Contatta Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

