hero_text:
  tagline: OEM / ODM Quote
  title: 'Request an Inflatable Pool<br />OEM/ODM Quote'
  subtitle: |
    Share your product requirements, estimated order quantity and target market. Our team will review the information and determine the next steps for product selection, customization or manufacturing quotation.<br />
    If you have technical drawings, reference photos or packaging requirements, include them with your inquiry.
steps2_process:
  title: How It Works
  subtitle: 'Four simple steps from inquiry to quotation.'
  items:
    - title: 'Step 1: Submit Your Requirements'
      description: 'Fill out the form below with your buyer type, product type, quantity, customization level and target market. The more detail you provide, the more accurate your quotation.'
      icon: tabler:file-text
    - title: 'Step 2: We Review & Advise'
      description: 'Our team reviews your requirements and may contact you for clarification. We provide recommendations on sizes, colors, accessories and the appropriate OEM or ODM path.'
      icon: tabler:users
    - title: 'Step 3: Receive Your Quote'
      description: 'You receive a detailed quotation covering the agreed scope, unit pricing, lead time, payment terms and shipping options. We review the requirements and reply with the next steps; complex projects may require technical clarification.'
      icon: tabler:currency-dollar
    - title: 'Step 4: Order & Delivery'
      description: 'After quote acceptance, we arrange production and shipping. Regular updates throughout the process.'
      icon: tabler:truck-delivery
content_form:
  id: rfq
  tagline: Project RFQ
  title: 'Tell Us About Your Inflatable Pool Project'
  subtitle: 'Fields marked * are required. If a detail is not confirmed yet, enter “TBD” and our team will follow up.'
  email_to: info@inflatablepoolfactory.com
  email_subject: OEM/ODM quotation request
  submit_button: 'Submit Project RFQ'
  success_message: 'Thanks — your project brief has been received. Our team will review the requirements and reply with the next steps. If a detail is missing, we may ask for clarification on target sizes, quantities, market or packaging before quoting.'
  error_message: 'Something went wrong sending your RFQ. Please try again or email us directly at info@inflatablepoolfactory.com.'
  default_country_code: '+86'
  fields:
    - name: firstName
      label: First Name
      row: 1
      type: text
      required: true
    - name: lastName
      label: Last Name
      row: 1
      type: text
      required: true
    - name: email
      label: Business Email
      row: 2
      type: email
      required: true
    - name: companyName
      label: Company Name
      row: 2
      type: text
      required: true
    - name: buyerType
      label: Buyer Type
      row: 3
      type: select
      required: true
      placeholder: Select buyer type
      options:
        - Brand Owner / Private Label
        - Importer / Distributor
        - Retailer / E-commerce
        - Hotel / Resort / Hospitality
        - Commercial Project
        - Other
    - name: productType
      label: Product Type
      row: 3
      type: select
      required: true
      placeholder: Select product type
      options:
        - Rectangular Drop-Stitch Pool
        - Round Pool (Blue)
        - Round Pool (Grey)
        - SPA / Hot Tub
        - Custom OEM / ODM
        - Not Sure Yet
    - name: quantity
      label: Estimated Quantity
      row: 4
      type: text
      required: true
      placeholder: e.g., target quantity or TBD
    - name: customizationLevel
      label: Customization Level
      row: 4
      type: select
      required: true
      placeholder: Select customization level
      options:
        - Standard Product
        - Logo / Branding Only
        - Custom Sizes, Colors or Packaging
        - ODM / Product Development
        - Not Sure Yet
    - name: country
      label: Country / Target Market
      row: 5
      type: text
      required: true
      placeholder: e.g. Germany, UAE, USA
    - name: targetDelivery
      label: Target Delivery Date
      row: 5
      type: text
      required: false
      placeholder: e.g. Q2 2027, or TBD
    - name: message
      label: Project Brief
      row: 6
      type: textarea
      required: false
      rows: 5
      placeholder: Product dimensions, materials, branding, packaging and any other requirements...

content_rfq_types:
  tagline: 3-Tier RFQ System
  title: 'Choose the Right<br />Inquiry Level'
  subtitle: 'Different orders need different levels of detail. Select the form that matches your buying stage.'
  items:
    - title: 'Quick Inquiry'
      description: '5-6 fields, 30 seconds. For initial contact, general questions, or pool availability. Our team reviews each inquiry and follows up with next steps.'
      icon: tabler:bolt
    - title: 'Standard RFQ'
      description: '8-10 fields, 2 minutes. For specific pool quotations with model selection, quantity, and delivery requirements. Detailed quotation prepared against the confirmed requirements.'
      icon: tabler:file-text
    - title: 'Project RFQ'
      description: '10-14 fields, 5 minutes. For resort fleets, glamping projects, retail programs, or OEM/ODM manufacturing requiring custom configuration. Dedicated project manager assigned.'
      icon: tabler:clipboard-list

form_quick:
  title: Quick Inquiry
  subtitle: 'Fast contact for general questions and initial information requests.'
  fields:
    - name: fullName
      label: Full Name
      type: text
      required: true
      placeholder: Your full name
    - name: businessEmail
      label: Email
      type: email
      required: true
      placeholder: you@example.com
    - name: companyName
      label: Company Name (optional)
      type: text
      required: false
      placeholder: Your company
    - name: buyerType
      label: I am a...
      type: select
      required: true
      options:
        - Family / Individual Customer
        - Distributor / Importer
        - Brand Owner / Private Label
        - Hotel / Resort / Glamping
        - Retailer
        - Other
    - name: productInterest
      label: Pool of Interest
      type: multiselect
      required: true
      options:
        - Rectangular Drop Stitch Pool
        - Round Drop Stitch Pool (Blue)
        - Round Drop Stitch Pool (Grey)
        - Pool with Cover
        - OEM/ODM Custom
    - name: message
      label: What do you need?
      type: textarea
      required: false
      placeholder: Brief description of your requirements...

form_standard:
  title: Standard RFQ
  subtitle: 'Detailed quotation request for specific pools and quantities.'
  fields:
    - name: fullName
      label: Full Name
      type: text
      required: true
    - name: businessEmail
      label: Email
      type: email
      required: true
    - name: companyName
      label: Company Name
      type: text
      required: false
    - name: buyerType
      label: Buyer Type
      type: select
      required: true
      options:
        - Family / Individual Customer
        - Distributor / Importer
        - Brand Owner / Private Label
        - Hotel / Resort / Glamping
        - Retailer
        - Other
    - name: productModel
      label: Pool Model / Type
      type: text
      required: true
      placeholder: e.g., Rectangular pool, round grey pool with cover
    - name: quantity
      label: Estimated Quantity
      type: text
      required: true
      placeholder: e.g., target quantity or trial order
    - name: targetMarket
      label: Target Market / Region
      type: text
      required: true
      placeholder: e.g., EU, North America, Middle East
    - name: deliveryTimeline
      label: Desired Delivery
      type: select
      required: true
      options:
        - Within 30 days
        - 30-60 days
        - 60-90 days
