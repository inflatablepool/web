faq:
  title: 'Quotation FAQ'
  subtitle: 'What to expect before and after you submit your project brief.'
  columns: 2
  items:
    - title: 'What information is needed for an accurate quotation?'
      description: 'Product type or reference product, target dimensions, materials or performance requirements, branding and packaging needs, estimated quantity, target market and delivery date. If a detail is still open, enter “TBD”.'
      icon: tabler:file-invoice
    - title: 'How long does it take to receive a quote?'
      description: 'Quotation timing depends on the product scope and technical details. We review each request and reply with the next steps, including any clarification needed before pricing.'
      icon: tabler:clock
    - title: 'Can I upload drawings or reference images?'
      description: 'Yes. Use the optional attachment field to upload a spec sheet, drawing, reference image or packaging artwork. Accepted formats include PDF, PNG, JPG, WebP, AI, PSD, DWG, DXF and ZIP, up to 20 MB.'
      icon: tabler:paperclip
    - title: 'Does submitting an RFQ create an order?'
      description: 'No. The RFQ starts a project discussion. Commercial terms, samples, tooling and production are only confirmed after both sides agree in writing.'
      icon: tabler:checklist

cta:
  title: 'Prefer to discuss by email?'
  subtitle: 'Send your inquiry directly to our team at info@inflatablepoolfactory.com and we will review it and reply with the next steps.'
  actions:
    - variant: primary
      text: Email us directly
      href: mailto:info@inflatablepoolfactory.com
