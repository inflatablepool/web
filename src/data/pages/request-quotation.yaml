form_project:
  title: Project RFQ
  subtitle: 'Comprehensive project inquiry for resort, retail, or OEM/ODM programs.'
  fields:
    - name: fullName
      label: Full Name
      type: text
      required: true
    - name: businessEmail
      label: Email
      type: email
      required: true
    - name: companyName
      label: Company Name
      type: text
      required: true
    - name: buyerType
      label: Buyer Type
      type: select
      required: true
      options:
        - Distributor / Importer
        - Brand Owner / Private Label
        - Hotel / Resort / Glamping
        - Retail Chain
        - Other
    - name: projectType
      label: Project Type
      type: select
      required: true
      options:
        - Resort / Hotel Pools
        - Glamping / Holiday Park
