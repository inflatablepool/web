hero_text:
  tagline: Get a Quote
  title: 'Request a Quotation<br />for Your Pool Order'
  subtitle: 'Tell us about your requirements and our team will respond with a detailed quotation within 2 business days.'
steps2_process:
  title: How It Works
  subtitle: 'Four simple steps from inquiry to quotation.'
  items:
    - title: 'Step 1: Submit Your Requirements'
      description: 'Fill out the form below with your pool type, size, and quantity. The more detail you provide, the more accurate your quotation.'
      icon: tabler:file-text
    - title: 'Step 2: We Review & Advise'
      description: 'Our team reviews your requirements and may contact you for clarification. We provide recommendations on sizes, colors, and accessories.'
      icon: tabler:users
    - title: 'Step 3: Receive Your Quote'
      description: 'You receive a detailed quotation including unit pricing, lead time, payment terms, and shipping options. Typically within 48 hours.'
      icon: tabler:currency-dollar
    - title: 'Step 4: Order & Delivery'
      description: 'After quote acceptance, we arrange production and shipping. Regular updates throughout the process.'
      icon: tabler:truck-delivery
content_form:
  tagline: Quotation Form
  title: 'Tell Us What You Need'
  subtitle: 'All fields with * are required.'
  fields:
    - name: Pool Type
      type: select
      options:
        - Rectangular Drop Stitch Pool
        - Round Drop Stitch Pool (Blue)
        - Round Drop Stitch Pool (Grey)
        - Round Pool with Cover
        - Custom OEM/ODM
    - name: Pool Size
      type: text
      placeholder: e.g. 4 m x 2.5 m x 1.2 m, or diameter 3 m
    - name: Quantity
      type: text
      placeholder: e.g. 50 units
    - name: Target Market
      type: text
      placeholder: e.g. Europe, North America, Middle East
    - name: Delivery Country
      type: text
      placeholder: e.g. Italy, UAE, USA, Australia
    - name: Color / Finish
      type: select
      options:
        - No Preference
        - Blue
        - Grey
        - Custom Color
    - name: Cover Needed
      type: select
      options:
        - Yes
        - No
        - Not sure
    - name: Customization Required
      type: text
      placeholder: e.g. custom colors, branding/logo, packaging, special fittings
    - name: Timeline
      type: text
      placeholder: e.g. delivery within 90 days
    - name: Additional Requirements
      type: textarea
      placeholder: Describe your application, technical specifications, or any special requirements
    - name: Upload Specification
      type: file
      placeholder: Upload your spec sheet, drawing, or reference document (PDF, images)
    - name: Upload Logo / Artwork
      type: file
      placeholder: Upload your logo or artwork for custom branding (AI, EPS, PNG)

content_rfq_types:
  tagline: 3-Tier RFQ System
  title: 'Choose the Right<br />Inquiry Level'
  subtitle: 'Different orders need different levels of detail. Select the form that matches your buying stage.'
  items:
    - title: 'Quick Inquiry'
      description: '5-6 fields, 30 seconds. For initial contact, general questions, or pool availability. We respond within 24 hours.'
      icon: tabler:bolt
    - title: 'Standard RFQ'
      description: '8-10 fields, 2 minutes. For specific pool quotations with model selection, quantity, and delivery requirements. Detailed quotation within 48 hours.'
      icon: tabler:file-text
    - title: 'Project RFQ'
      description: '10-14 fields, 5 minutes. For resort fleets, glamping projects, retail programs, or OEM/ODM manufacturing requiring custom configuration. Dedicated project manager assigned.'
      icon: tabler:clipboard-list

form_quick:
  title: Quick Inquiry
  subtitle: 'Fast contact for general questions and initial information requests.'
  fields:
    - name: fullName
      label: Full Name
      type: text
      required: true
      placeholder: Your full name
    - name: businessEmail
      label: Email
      type: email
      required: true
      placeholder: you@example.com
    - name: companyName
      label: Company Name (optional)
      type: text
      required: false
      placeholder: Your company
    - name: buyerType
      label: I am a...
      type: select
      required: true
      options:
        - Family / Individual Customer
        - Distributor / Importer
        - Brand Owner / Private Label
        - Hotel / Resort / Glamping
        - Retailer
        - Other
    - name: productInterest
      label: Pool of Interest
      type: multiselect
      required: true
      options:
        - Rectangular Drop Stitch Pool
        - Round Drop Stitch Pool (Blue)
        - Round Drop Stitch Pool (Grey)
        - Pool with Cover
        - OEM/ODM Custom
    - name: message
      label: What do you need?
      type: textarea
      required: false
      placeholder: Brief description of your requirements...

form_standard:
  title: Standard RFQ
  subtitle: 'Detailed quotation request for specific pools and quantities.'
  fields:
    - name: fullName
      label: Full Name
      type: text
      required: true
    - name: businessEmail
      label: Email
      type: email
      required: true
    - name: companyName
      label: Company Name
      type: text
      required: false
    - name: buyerType
      label: Buyer Type
      type: select
      required: true
      options:
        - Family / Individual Customer
        - Distributor / Importer
        - Brand Owner / Private Label
        - Hotel / Resort / Glamping
        - Retailer
        - Other
    - name: productModel
      label: Pool Model / Type
      type: text
      required: true
      placeholder: e.g., Rectangular pool, round grey pool with cover
    - name: quantity
      label: Estimated Quantity
      type: text
      required: true
      placeholder: e.g., 10-20 units
    - name: targetMarket
      label: Target Market / Region
      type: text
      required: true
      placeholder: e.g., EU, North America, Middle East
    - name: deliveryTimeline
      label: Desired Delivery
      type: select
      required: true
      options:
        - Within 30 days
        - 30-60 days
        - 60-90 days
        - Planning ahead (90+ days)
        - Just researching
    - name: message
      label: Additional Details
      type: textarea
      required: false

form_project:
  title: Project RFQ
  subtitle: 'Comprehensive project inquiry for resort, retail, or OEM/ODM programs.'
  fields:
    - name: fullName
      label: Full Name
      type: text
      required: true
    - name: businessEmail
      label: Email
      type: email
      required: true
    - name: companyName
      label: Company Name
      type: text
      required: true
    - name: buyerType
      label: Buyer Type
      type: select
      required: true
      options:
        - Distributor / Importer
        - Brand Owner / Private Label
        - Hotel / Resort / Glamping
        - Retail Chain
        - Other
    - name: projectType
      label: Project Type
      type: select
      required: true
      options:
        - Resort / Hotel Pools
        - Glamping / Holiday Park
        - Retail Program
        - Private Label / OEM
        - Dealer Stock Order
        - Other
    - name: poolTypes
      label: Pool Types Required
      type: multiselect
      required: true
      options:
        - Rectangular Drop Stitch Pools
        - Round Blue Pools
        - Round Grey Pools
        - Pools with Covers
        - Custom Sizes
    - name: fleetSize
      label: Quantity Range
      type: text
      required: true
      placeholder: e.g., 20-50 units over 12 months
    - name: customRequirements
      label: Custom Configuration Needs
      type: textarea
      required: false
      placeholder: Sizes, colors, covers, branding requirements...
    - name: targetMarket
      label: Target Market
      type: text
      required: true
    - name: budgetRange
      label: Budget Range
      type: select
      required: false
      options:
        - Under $10,000
        - $10,000 - $50,000
        - $50,000 - $200,000
        - $200,000+
        - Prefer not to say
    - name: deliveryTimeline
      label: Project Timeline
      type: select
      required: true
      options:
        - Urgent (within 30 days)
        - Standard (30-60 days)
        - Planned (60-90 days)
        - Future planning (90+ days)
    - name: message
      label: Project Details & Requirements
      type: textarea
      required: false
      placeholder: Describe your project and any specific requirements...

cta:
  title: 'Prefer to discuss by email?'
  subtitle: 'Send your inquiry directly to our team at info@inflatablepoolfactory.com and we will respond within 24 hours.'
  actions:
    - variant: primary
      text: Email us directly
      href: mailto:info@inflatablepoolfactory.com
