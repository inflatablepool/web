hero_text:
  tagline: Kontakt
  title: Nehmen Sie Kontakt auf
contact_form:
  id: form
  title: Senden Sie uns eine Nachricht
  subtitle: Für Angebote, technische Fragen oder Kooperationsanfragen schreiben Sie uns einfach eine E-Mail. Wir antworten innerhalb eines Werktages.
  email_to: info@inflatablepoolfactory.com
  submit_button: Anfrage senden → Angebot einholen
  success_message: Danke! Ihre Nachricht ist in unserem Posteingang gelandet. Wir werden innerhalb eines Werktages antworten.
  error_message: Beim Senden Ihrer Nachricht ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut oder senden Sie uns direkt eine E-Mail.
  default_country_code: '+86'
  captcha:
    label: 'Anti-Spam: Bitte lösen Sie Folgendes'
  fields:
    - name: firstName
      label: Vorname
      row: 1
    - name: lastName
      label: Nachname
      row: 1
    - name: companyName
      label: Name der Firma
      row: 2
    - name: address
      label: Adresse
      row: 3
    - name: zip
      label: Postleitzahl
      row: 4
    - name: country
      label: Land
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Geschätztes Bestellvolumen
      row: 6
      type: select
      options:
        - value: ''
          label: Wählen Sie Ihr geschätztes Volumen...
        - value: sample
          label: Nur Muster/Prototypen
        - value: 5-10
          label: 5–10 Einheiten (Standard-MOQ)
        - value: 100-500
          label: 100–500 Einheiten
        - value: 500-plus
          label: 500+ Einheiten (Mengenpreis)
    - name: customization
      label: Anpassung erforderlich?
      row: 7
      type: select
      options:
        - value: ''
          label: Wählen Sie den Anpassungstyp aus...
        - value: none
          label: Standardprodukt (keine Anpassung)
        - value: logo
          label: Nur individuelles Logo/Branding
        - value: full
          label: Vollständiger OEM (Größe, Farbe, Grafik, Verpackung)
        - value: consultation
          label: Ich bin mir nicht sicher – brauche Beratung
    - name: productInterest
      label: Interessenpool
      row: 8
      type: select
      options:
        - value: ''
          label: Pooltyp auswählen...
        - value: all
          label: Alle Pools / Kompletter Katalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Thema
      row: 9
    - name: message
      label: Nachricht
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Weitere Möglichkeiten, uns zu erreichen
  columns: 3
  items:
    - title: Verkaufsanfragen
      description: Pool-Angebote, Großhandelspreise und Großbestellungen.
      icon: tabler:shopping-bag
    - title: Technische Unterstützung
      description: Einrichtungshilfe, Reparaturen, Ersatzteile und Fragen zur Pflege.
      icon: tabler:tool
    - title: OEM/ODM
      description: Individuelle Größen, Farben, Einbände, Branding und Verpackung.
      icon: tabler:palette
    - title: E-Mail
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Webseite
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: Ansprechzeit
      description: Wir antworten innerhalb eines Werktages.
      icon: tabler:clock
map:
  title: Nehmen Sie Kontakt auf
  subtitle: Kontaktieren Sie Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

