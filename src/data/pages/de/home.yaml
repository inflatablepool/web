faqs:
  title: Häufig gestellte Fragen zu aufblasbaren Pools
  subtitle: Häufige Fragen zu den aufblasbaren Inflatable Pool Factory-Schwimmbecken.
  columns: 2
  items:
    - title: Wie lange dauert die Einrichtung?
      description: 'Das Aufblasen dauert mit der mitgelieferten elektrischen Luftpumpe je nach Modell 5-15 Minuten. Die Füllzeit hängt von der Poolkapazität und Ihrer Wasserversorgung ab.'
      icon: tabler:clock
      category: all
    - title: Wie steif ist ein Drop-Stitch-Pool?
      description: Sehr starr. Die Drop-Stitch-Wände werden mit 4–5 PSI stark aufgepumpt – ähnlich wie bei einem aufblasbaren Paddle-Board –, sodass der Pool seine Form behält, wenn er mit Wasser gefüllt ist.
      icon: tabler:hexagon
      category: all
    - title: Können Kinder den Pool nutzen?
      description: Ja, jederzeit unter aktiver Aufsicht eines Erwachsenen. Kinder dürfen niemals unbeaufsichtigt im oder in der Nähe des Pools gelassen werden – befolgen Sie das Handbuch und die örtlichen Sicherheitsvorschriften.
      icon: tabler:users
      category: all
    - title: Wie lagere ich den Pool im Winter?
      description: Lassen Sie das Wasser ab, lassen Sie die Luft aus dem Pool ab, lassen Sie ihn vollständig trocknen, rollen Sie ihn dann auf und lagern Sie ihn im mitgelieferten Aufbewahrungsbeutel an einem frostfreien Ort.
      icon: tabler:package
      category: all
    - title: Was ist im Pool enthalten?
      description: Zu jedem Inflatable Pool Factory-Pool gehören eine elektrische Luftpumpe, ein Reparaturset und eine Aufbewahrungstasche. Runde Modelle verfügen optional über eine passgenaue Abdeckung.
      icon: tabler:box
      category: all
    - title: Welche Größen sind verfügbar?
      description: 48 Standard-SKUs in vier Kollektionen – runde Pools mit bis zu 10 m Durchmesser, rechteckige Pools mit bis zu 6 × 5 m und SPA-Badewannen mit integrierten Sitzen. Für Geschäftspartner stehen Sondergrößen zur Verfügung.
      icon: tabler:ruler-2
      category: all
    - title: Auf welchen Untergründen kann der Pool stehen?
      description: 'Jede flache, ebene Oberfläche ohne scharfe Gegenstände – Rasen, Terrasse oder Deck. Auf rauen Untergründen empfiehlt sich eine Bodenplane. Ein gefüllter Pool ist schwer: Installieren Sie ihn nur auf einer Oberfläche, die das volle Gewicht tragen kann, und lassen Sie erhöhte Decks, Balkone und Dächer zunächst strukturell beurteilen.'
      icon: tabler:layout-grid
      category: all
    - title: Wie halte ich das Wasser sauber?
      description: Verwenden Sie ggf. eine Filterpumpe, entfernen Sie Schmutz, überprüfen Sie den pH-Wert und decken Sie den Pool ab, wenn er nicht verwendet wird. Wie lange das Wasser reicht, hängt von der Poolgröße, der Nutzung und der Filterung ab – testen Sie es regelmäßig, anstatt sich auf einen festen Zeitplan zu verlassen.
      icon: tabler:droplet
      category: all
