content_compliance:
  tagline: Pflege und Sicherheit
  title: Einfach zu besitzen,<br />Leicht zu lieben
  subtitle: Von der Lieferung über das erste Schwimmen bis zur Lagerung am Ende der Saison bleibt der Besitz eines Inflatable Pool Factory-Pools einfach.
  items:
    - title: Einrichtung in wenigen Minuten
      description: 'Auspacken und mit der mitgelieferten Pumpe in 5–15 Minuten aufpumpen, dann mit einem Gartenschlauch füllen – die Füllzeit variiert je nach Poolgröße und Wasserversorgung.'
      icon: tabler:rocket
    - title: Einfache Wasserpflege
      description: Standardmäßige 32/38-mm-Filterpumpenanschlüsse, regelmäßige pH-Kontrollen und eine passende Abdeckung bei runden Modellen halten das Wasser sauber.
      icon: tabler:droplet
    - title: Reinigen, abtropfen lassen und aufbewahren
      description: Lassen Sie den Pool abtropfen, trocknen Sie ihn, rollen Sie ihn auf und packen Sie ihn für den Winter in die Aufbewahrungstasche. Keine permanente Installation erforderlich.
      icon: tabler:package
    - title: Sicherheit geht vor
      description: Kinder müssen jederzeit aktiv von einem Erwachsenen beaufsichtigt werden. Befolgen Sie das Handbuch, die örtlichen Vorschriften und die Hinweise zur sicheren Verwendung.
      icon: tabler:shield-check
