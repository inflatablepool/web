hero:
  tagline: Über uns
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Aufblasbares Inflatable Pool Factory-Schwimmbecken
  title: |
    Schwimmen einfach machen, <br />
    auf <span class="text-accent dark:text-white">Inflatable Pool Factory</span>-Art
  subtitle: Inflatable Pool Factory ist eine Premium-Marke für aufblasbare Drop-Stitch-Pools, entwickelt von Inflatable Pool Team · Qingdao Vatrad Group. Wir glauben, dass jede Familie einen echten Pool im Hinterhof verdient – ​​ohne Bauarbeiten, Genehmigungen oder dauerhafte Installation. Unsere Pools sind in wenigen Minuten fest aufgeblasen, überstehen ganze Sommer voller Familienspaß und lassen sich am Ende der Saison klein zusammenpacken.
