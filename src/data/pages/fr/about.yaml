hero:
  tagline: À propos de nous
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Piscine gonflable Inflatable Pool Factory
  title: |
    Rendre la natation simple, <br />
    à la <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory est une marque de piscines gonflables Drop Stitch haut de gamme conçue par Inflatable Pool Team · Qingdao Vatrad Group. Nous pensons que chaque famille mérite une vraie piscine dans son jardin, sans construction, sans permis ni installation permanente. Nos piscines se gonflent en quelques minutes, survivent à des étés complets de plaisir en famille et se rangent petites à la fin de la saison.
stats:
  title: En chiffres
  columns: 4
  stats:
    - title: Collections de piscine
      amount: '4'
    - title: 'Temps de gonflage'
      amount: '5-15 min'
    - title: Pression nominale
      amount: 4-5 PSI
    - title: Contact
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: Ce que nous construisons
  subtitle: 'Une gamme de produits ciblée que nous connaissons parfaitement : les piscines gonflables Drop Stitch haute pression.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Piscines rectangulaires
      description: Piscines Drop Stitch rectangulaires de taille familiale qui maximisent la zone de baignade de votre espace.
      icon: tabler:rectangle
    - title: Piscines rondes bleues
      description: "La piscine d'arrière-cour classique : bleu vif, parois rigides Drop Stitch, installation rapide."
      icon: tabler:circle
    - title: Piscines rondes grises
      description: Notre ligne haut de gamme avec une finition grise moderne et une housse ajustée en option.
      icon: tabler:circle-dot
    - title: Piscines spa spa
      description: 'Modèles de spas isolés avec sièges intégrés et fonds isolés de 5 mm — à utiliser avec des radiateurs externes (appareil de chauffage non inclus).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Forfaits complets
      description: Chaque piscine est livrée avec une pompe à air électrique, un kit de réparation et un sac de rangement.
      icon: tabler:package
    - title: Tailles personnalisées
      description: Tailles, couleurs et couvertures OEM pour les marques, les distributeurs et les projets hôteliers.
      icon: tabler:adjustments
    - title: OEM/ODM
      description: Fabrication de marques privées avec impression de logo et emballage prêt à la vente au détail.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Piscine gonflable rectangulaire Drop Stitch Inflatable Pool Factory
steps2_values:
  title: Nos valeurs
  subtitle: Trois principes qui façonnent chaque piscine que nous construisons.
  items:
    - title: Construisez comme si votre famille l'utiliserait
      description: Chaque couture, mur et valve est traité comme si nos propres familles allaient y nager.
      icon: tabler:heart
    - title: Ingénieur avant de vendre
      description: Construction Drop Stitch haute pression, testée au-dessus de sa pression nominale, avant l'expédition de toute piscine.
      icon: tabler:settings
    - title: Un soutien qui dure toute la saison
      description: Questions, spare parts, or warranty — contact us at info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: Jalons
  subtitle: Une version courte de l'histoire de Inflatable Pool Factory.
  isReversed: true
  items:
    - title: Axé sur les piscines gonflables
      description: 'Inflatable Pool Factory a été fondée avec un seul objectif : les piscines gonflables Drop Stitch haut de gamme.'
      icon: tabler:pool
    - title: Trois collections signatures
      description: Lignes de piscine rectangulaires, rondes bleues et rondes grises, chacune avec des couvertures en option et des tailles personnalisées.
      icon: tabler:circle-check
    - title: OEM/ODM pour les partenaires du monde entier
      description: Fabrication sur mesure pour les marques, distributeurs, hôtels et opérateurs de glamping.
      icon: tabler:world
