content_compliance:
  tagline: Entretien et sécurité
  title: Facile à posséder,<br />Facile à aimer
  subtitle: De la livraison à la première baignade en passant par le stockage de fin de saison, posséder une piscine Inflatable Pool Factory reste simple.
  items:
    - title: Configuration en quelques minutes
      description: 'Déballez et gonflez avec la pompe incluse en 5 à 15 minutes, puis remplissez avec un tuyau d''arrosage — le temps de remplissage varie en fonction de la taille de la piscine et de l''approvisionnement en eau.'
