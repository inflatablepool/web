    - title: Entretien simple de l'eau
      description: Des ports de pompe-filtre standard de 32/38 mm, des contrôles réguliers du pH et un couvercle ajusté sur les modèles ronds maintiennent l'eau propre.
      icon: tabler:droplet
    - title: Nettoyer, égoutter et ranger
      description: Égoutter, sécher, enrouler et ranger la piscine dans son sac de rangement pour l'hiver. Aucune installation permanente à entretenir.
      icon: tabler:package
