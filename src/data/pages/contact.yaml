hero_text:
  tagline: Contact
  title: GET IN TOUCH
contact_form:
  id: form
  title: Send us a message
  subtitle: For quotes, technical questions or partnership enquiries, drop us a line. Our team will review your message and follow up with next steps.
  email_to: info@inflatablepoolfactory.com
  submit_button: Send Inquiry → Get a Quote
  success_message: Thanks! Your message has landed in our inbox. Our team will review your message and follow up with next steps.
  error_message: Something went wrong sending your message. Please try again or email us directly.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: please solve the following'
  fields:
    - name: firstName
      label: First Name
      row: 1
    - name: lastName
      label: Last Name
      row: 1
    - name: companyName
      label: Company Name
      row: 2
    - name: address
      label: Address
      row: 3
    - name: zip
      label: Zip / Postal Code
      row: 4
    - name: country
      label: Country
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Estimated Order Volume
      row: 6
      type: select
      options:
        - value: ''
          label: Select your estimated volume...
        - value: sample
          label: Samples / Prototypes only
        - value: '100-500'
          label: 100–500 units
        - value: '500-plus'
          label: 500+ units (Volume pricing)
    - name: customization
      label: Customization Needed?
      row: 7
      type: select
      options:
        - value: ''
          label: Select customization type...
        - value: none
          label: Standard product (no customization)
        - value: logo
          label: Custom Logo / Branding only
        - value: full
          label: OEM (size, color, graphics, packaging)
        - value: consultation
          label: Not sure — need consultation
    - name: productInterest
      label: Pool of Interest
      row: 8
      type: select
      options:
        - value: ''
          label: Select pool type...
        - value: all
          label: All pools / Full catalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Subject
      row: 9
    - name: message
      label: Message
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Other ways to reach us
  columns: 3
  items:
    - title: Sales enquiries
      description: Pool quotes, wholesale pricing, and bulk orders.
      icon: tabler:shopping-bag
    - title: Technical support
      description: Setup help, repairs, spare parts, and care questions.
      icon: tabler:tool
    - title: OEM / ODM
      description: Custom sizes, colors, covers, branding, and packaging.
      icon: tabler:palette
    - title: Email
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Website
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Get in Touch
  subtitle: Contact Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15
