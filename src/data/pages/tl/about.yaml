hero:
  tagline: Tungkol sa amin
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory inflatable swimming pool
  title: |
    Ginagawang simple ang paglangoy, <br />
    estilo ng <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Ang Inflatable Pool Factory ay isang premium na drop stitch inflatable pool brand na dinisenyo ng Inflatable Pool Team · Qingdao Vatrad Group. Naniniwala kami na ang bawat pamilya ay karapat-dapat sa isang tunay na pool sa likod-bahay — nang walang konstruksyon, mga permit, o isang permanenteng pag-install. Ang aming mga pool ay namumuo nang matibay sa loob ng ilang minuto, nakakaligtas sa buong tag-araw ng kasiyahan ng pamilya, at nag-iimpake ng kaunti sa pagtatapos ng season.
