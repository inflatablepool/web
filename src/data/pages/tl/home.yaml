faqs:
  title: FAQ ng Inflatable Pool
  subtitle: Mga karaniwang tanong tungkol sa Inflatable Pool Factory inflatable swimming pool.
  columns: 2
  items:
    - title: Gaano katagal ang setup?
      description: 'Ang pagpapalaki ay tumatagal ng 5-15 minuto sa kasamang electric air pump depende sa modelo. Ang oras ng pagpuno ay nag-iiba sa kapasidad ng pool at sa iyong supply ng tubig.'
      icon: tabler:clock
      category: all
    - title: Gaano katigas ang isang drop stitch pool?
      description: Napakatigas. Ang mga drop stitch wall ay pumuputok nang husto sa 4-5 PSI — katulad ng isang inflatable paddle board — kaya napanatili ng pool ang hugis nito kapag napuno ng tubig.
      icon: tabler:hexagon
      category: all
    - title: Maaari bang gamitin ng mga bata ang pool?
      description: Oo, na may aktibong pangangasiwa ng nasa hustong gulang sa lahat ng oras. Ang mga bata ay hindi dapat iwanang walang nag-aalaga sa loob o malapit sa pool — sundin ang manu-mano at lokal na mga panuntunan sa kaligtasan.
      icon: tabler:users
      category: all
    - title: Paano ko iimbak ang pool sa taglamig?
      description: Patuyuin ang tubig, i-deflate ang pool, hayaang matuyo ito nang lubusan, pagkatapos ay i-roll up ito at itago ito sa kasamang storage bag sa isang lugar na walang hamog na nagyelo.
      icon: tabler:package
      category: all
    - title: Ano ang kasama sa pool?
      description: Ang bawat pool ng Inflatable Pool Factory ay may kasamang electric air pump, repair kit, at storage bag. Ang mga bilog na modelo ay may opsyonal na fitted cover.
      icon: tabler:box
      category: all
    - title: Anong mga sukat ang magagamit?
      description: 48 karaniwang SKU sa apat na koleksyon — mga bilog na pool hanggang 10 m ang lapad, mga rectangular na pool hanggang 6 × 5 m, at mga SPA tub na may mga built-in na upuan. Available ang mga custom na laki para sa mga kasosyo sa negosyo.
      icon: tabler:ruler-2
      category: all
    - title: Anong mga ibabaw ang maaaring tumayo sa pool?
      description: 'Anumang patag, patag na ibabaw na walang matutulis na bagay — damuhan, patio, o deck. Inirerekomenda ang isang ground sheet sa magaspang na ibabaw. Ang punong pool ay mabigat: i-install lang sa ibabaw na sumusuporta sa buong timbang, at may mga matataas na deck, balkonahe, at rooftop na unang nasuri sa istruktura.'
      icon: tabler:layout-grid
      category: all
    - title: Paano ko mapapanatili na malinis ang tubig?
      description: Gumamit ng filter pump kung saan nilagyan, skim debris, suriin ang pH, at takpan ang pool kapag hindi ginagamit. Kung gaano katagal ang tubig ay depende sa laki ng pool, paggamit, at pagsasala — regular na pagsubok sa halip na umasa sa isang nakapirming iskedyul.
      icon: tabler:droplet
      category: all
