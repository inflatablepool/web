hero_text:
  tagline: Makipag-ugnayan
  title: MAKIPAG-UGNAYAN
contact_form:
  id: form
  title: Padalhan kami ng mensahe
  subtitle: Para sa mga quote, teknikal na tanong o mga katanungan sa pakikipagsosyo, i-drop sa amin ang isang linya.
  email_to: info@inflatablepoolfactory.com
  submit_button: Magpadala ng Pagtatanong → Kumuha ng Quote
  success_message: Salamat! Ang iyong mensahe ay nakarating sa aming inbox.
  error_message: Nagkaproblema sa pagpapadala ng iyong mensahe. Pakisubukang muli o direktang mag-email sa amin.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: mangyaring lutasin ang sumusunod'
  fields:
    - name: firstName
      label: Unang Pangalan
      row: 1
    - name: lastName
      label: Apelyido
      row: 1
    - name: companyName
      label: Pangalan ng Kumpanya
      row: 2
    - name: address
      label: Address
      row: 3
    - name: zip
      label: Zip / Postal Code
      row: 4
    - name: country
      label: Bansa
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Tinantyang Dami ng Order
      row: 6
      type: select
      options:
        - value: ''
          label: Piliin ang iyong tinantyang dami...
        - value: sample
          label: Mga Sample / Prototype lamang
        - value: 100-500
          label: 100–500 unit
        - value: 500-plus
          label: 500+ units (Volume pricing)
    - name: customization
      label: Kailangan ang Customization?
      row: 7
      type: select
      options:
        - value: ''
          label: Pumili ng uri ng pagpapasadya...
        - value: none
          label: Karaniwang produkto (walang pag-customize)
        - value: logo
          label: Custom na Logo / Branding lang
        - value: full
          label: Buong OEM (laki, kulay, graphics, packaging)
        - value: consultation
          label: Hindi sigurado - kailangan ng konsultasyon
    - name: productInterest
      label: Pool ng Interes
      row: 8
      type: select
      options:
        - value: ''
          label: Pumili ng uri ng pool...
        - value: all
          label: Lahat ng pool / Buong catalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Paksa
      row: 9
    - name: message
      label: Mensahe
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Iba pang mga paraan upang maabot kami
  columns: 3
  items:
    - title: Mga katanungan sa pagbebenta
      description: Pool quote, pakyawan pagpepresyo, at maramihang mga order.
      icon: tabler:shopping-bag
    - title: Teknikal na suporta
      description: Tulong sa pag-setup, pag-aayos, mga ekstrang bahagi, at mga tanong sa pangangalaga.
      icon: tabler:tool
    - title: OEM / ODM
      description: Mga custom na laki, kulay, cover, branding, at packaging.
      icon: tabler:palette
    - title: Email
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Website
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Makipag-ugnayan
  subtitle: Makipag-ugnayan kay Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

