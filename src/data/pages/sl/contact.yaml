hero_text:
  tagline: Kontakt
  title: POVEŽITE SE
contact_form:
  id: form
  title: Pošljite nam sporočilo
  subtitle: Za ponudbe, tehnična vprašanja ali poizvedbe o partnerstvu nam pišite. Odgovorimo v enem delovnem dnevu.
  email_to: info@inflatablepoolfactory.com
  submit_button: Pošljite povpraševanje → Zagotovite ponudbo
  success_message: hvala Vaše sporočilo je pristalo v našem nabiralniku. Odgovorili vam bomo v enem delovnem dnevu.
  error_message: Pri pošiljanju vašega sporočila je šlo nekaj narobe. Poskusite znova ali nam neposredno pošljite e-pošto.
  default_country_code: '+86'
  captcha:
    label: 'Zaščita pred neželeno pošto: rešite naslednje'
  fields:
    - name: firstName
      label: Ime
      row: 1
    - name: lastName
      label: Priimek
      row: 1
    - name: companyName
      label: Ime podjetja
      row: 2
    - name: address
      label: Naslov
      row: 3
    - name: zip
      label: Poštna številka
      row: 4
    - name: country
      label: Država
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-pošta
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Predvidena količina naročila
      row: 6
      type: select
      options:
        - value: ''
          label: Izberite predvideno količino ...
        - value: sample
          label: Samo vzorci / prototipi
        - value: 5-10
          label: 5–10 enot (standardna MOQ)
        - value: 100-500
          label: 100–500 enot
        - value: 500-plus
          label: 500+ enot (količinska cena)
    - name: customization
      label: Potrebujete prilagoditev?
      row: 7
      type: select
      options:
        - value: ''
          label: Izberite vrsto prilagajanja ...
        - value: none
          label: Standardni izdelek (brez prilagajanja)
        - value: logo
          label: Samo logotip / blagovna znamka po meri
        - value: full
          label: Popoln OEM (velikost, barva, grafika, embalaža)
        - value: consultation
          label: Nisem prepričan – potrebujem posvet
    - name: productInterest
      label: Skupina interesov
      row: 8
      type: select
      options:
        - value: ''
          label: Izberite vrsto bazena ...
        - value: all
          label: Vsi bazeni / Celoten katalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Predmet
      row: 9
    - name: message
      label: Sporočilo
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Drugi načini, da pridete do nas
  columns: 3
  items:
    - title: Prodajna povpraševanja
      description: Skupne ponudbe, veleprodajne cene in množična naročila.
      icon: tabler:shopping-bag
    - title: Tehnična podpora
      description: Pomoč pri namestitvi, popravila, nadomestni deli in vprašanja o negi.
      icon: tabler:tool
    - title: OEM / ODM
      description: Velikosti, barve, ovitki, blagovna znamka in embalaža po meri.
      icon: tabler:palette
    - title: E-pošta
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Spletna stran
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: Odzivni čas
      description: Odgovorimo v enem delovnem dnevu.
      icon: tabler:clock
map:
  title: Stopite v stik
  subtitle: Kontaktirajte Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

