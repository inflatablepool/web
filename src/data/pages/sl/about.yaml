hero:
  tagline: O nas
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Napihljiv bazen Inflatable Pool Factory
  title: |
    Preprosto plavanje, <br />
    na <span class="text-accent dark:text-white">Inflatable Pool Factory</span> način
  subtitle: Inflatable Pool Factory je blagovna znamka napihljivih bazenov premium drop stitch, ki jo je oblikoval Inflatable Pool Team · Qingdao Vatrad Group. Verjamemo, da si vsaka družina zasluži pravi bazen na dvorišču – brez gradnje, dovoljenj ali stalne postavitve. Naši bazeni se močno napihnejo v nekaj minutah, preživijo polna poletja družinske zabave in se ob koncu sezone pospravijo po malem.
stats:
  title: Po številkah
  columns: 4
  stats:
    - title: Zbirke bazenov
      amount: '4'
    - title: 'Čas za napihovanje'
      amount: '5-15 min'
    - title: Nazivni tlak
      amount: 4-5 PSI
    - title: Kontakt
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: Kaj gradimo
  subtitle: Osredotočena linija izdelkov, ki jo poznamo od znotraj navzven – visokotlačni napihljivi bazeni Drop Stitch.
  columns: 3
  isBeforeContent: true
  items:
    - title: Pravokotni bazeni
      description: Pravokotni bazeni Drop Stitch družinske velikosti, ki povečajo plavalno površino za vaš prostor.
      icon: tabler:rectangle
    - title: Okrogli modri bazeni
      description: Klasični bazen na dvorišču — živahno modra barva, toge stene Drop Stitch, hitra postavitev.
      icon: tabler:circle
    - title: Okrogli sivi bazeni
      description: Naša vrhunska linija s sodobno sivo prevleko in opcijskim prilegajočim se pokrovom.
      icon: tabler:circle-dot
    - title: Vroča kopel SPA bazeni
      description: 'Izolirani modeli masažne kadi z vgrajenimi sedeži in 5 mm izoliranim dnom — za uporabo z zunanjimi grelci (grelec ni priložen).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Popolni paketi
      description: Vsak bazen ima električno zračno črpalko, komplet za popravilo in torbo za shranjevanje.
      icon: tabler:package
    - title: Velikosti po meri
      description: OEM velikosti, barve in pokrovi za blagovne znamke, distributerje in gostinske projekte.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Proizvodnja pod lastno blagovno znamko s tiskanjem logotipa in embalažo, pripravljeno za maloprodajo.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Inflatable Pool Factory pravokotni napihljivi bazen Drop Stitch
