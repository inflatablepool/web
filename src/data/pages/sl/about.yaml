      description: Vsak šiv, stena in ventil je obdelan, kot da bodo v njem plavale naše družine.
      icon: tabler:heart
    - title: Inženir pred prodajo
      description: Visokotlačna konstrukcija Drop Stitch, preizkušena nad nazivnim tlakom, pred pošiljanjem katerega koli bazena.
      icon: tabler:settings
    - title: Podpora, ki preživi sezono
      description: Vprašanja, rezervni deli ali garancija — kontaktirajte nas na info@inflatablepoolfactory.com.
      icon: tabler:headset
