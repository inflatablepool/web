    - title: Dvoriščni bazeni za družine
      description: Načrtovanje prostora, realne uporabne velikosti in enostavno vzdrževanje za družinska poletja na dvorišču.
      icon: tabler:home
      cta: Pridobite ideje
      cta_href: /pool-ideas/backyard-pools-for-families
    - title: Bazeni za majhna dvorišča
      description: 'Kompaktni okrogli in kvadratni modeli, ki se prilegajo ozkim zunanjim prostorom - prostor za ohlajanje in družinski čas za vodo.'
      icon: tabler:layout-grid
      cta: Pridobite ideje
      cta_href: /pool-ideas/pools-for-small-backyards
    - title: Veliki bazeni za srečanja
      description: Veliki pravokotni bazeni s pravim plavalnim prostorom za celotno posadko v poletnih dneh.
      icon: tabler:users
      cta: Pridobite ideje
      cta_href: /pool-ideas/large-pools-for-family-gatherings
    - title: Namakanje in sprostitev na prostem
      description: SPA kadi z vgrajenimi sedeži in izoliranim dnom za vsakodnevno sprostitev doma.
      icon: tabler:ripple
      cta: Pridobite ideje
      cta_href: /pool-ideas/outdoor-soaking-pools
    - title: Bazeni za počitniški najem
      description: Sezonska ponudba za goste, ki se hitro postavi in ​​shrani izven sezone.
      icon: tabler:beach
      cta: Pridobite ideje
      cta_href: /pool-ideas/pools-for-vacation-rentals
    - title: Glamping in gostinstvo
      description: Prepoznavna bivanja na prostem — glampingi, butične nepremičnine in prizorišča za dogodke.
      icon: tabler:tent
      cta: Pridobite ideje
      cta_href: /pool-ideas/pools-for-glamping-and-hospitality
content_categories:
  tagline: Trgovina z bazeni
  title: Raziščite naše bazene
  subtitle: Primerjajte oblike, velikosti in funkcije, da poiščete pravi bazen za svoje dvorišče ali zunanji prostor.
content_workshop:
  isReversed: true
  tagline: Za podjetja
  title: Bazeni za podjetja,<br />Tudi
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Inflatable Pool Factory za poslovne partnerje</h3>
  items:
    - title: Počitniški najem in gostinstvo
      description: Sezonske ugodnosti za goste v počitniških najemih, glampingih in butičnih nepremičninah — hitra uvedba, enostavno vzdrževanje, preprosto shranjevanje.
    - title: Maloprodajni partnerji in partnerji blagovnih znamk
      description: Veleprodajni programi in za maloprodajo pripravljeni bazeni Drop Stitch za vrtne centre, trgovine z bazeni in spletne trgovine.
    - title: Blagovna znamka po meri in zasebna znamka
      description: Velikosti po meri, barve, platnice, tiskanje logotipov in maloprodajna embalaža za blagovne znamke – izdelali so jih naši proizvodni partnerji.
content_compliance:
  tagline: Nega in varnost
  title: Enostaven za lastništvo,<br />Enostaven za ljubezen
  subtitle: Lastništvo bazena Inflatable Pool Factory je preprosto od dostave do prvega plavanja do shranjevanja ob koncu sezone.
  items:
    - title: Nastavitev v nekaj minutah
      description: 'Odstranite škatlo in napihnite s priloženo črpalko v 5–15 minutah, nato napolnite z vrtno cevjo — čas polnjenja je odvisen od velikosti bazena in količine vode.'
      icon: tabler:rocket
    - title: Enostavna nega vode
      description: Standardni 32/38 mm priključki za filtrirne črpalke, redno preverjanje pH in nameščen pokrov na okroglih modelih ohranjajo vodo čisto.
      icon: tabler:droplet
    - title: Očistite, odcedite in shranite
      description: Odcedite, posušite, zvijte in pospravite bazen v vrečo za zimo. Ni stalne namestitve za vzdrževanje.
      icon: tabler:package
    - title: Varnost na prvem mestu
      description: Otroci morajo biti ves čas pod aktivnim nadzorom odrasle osebe. Upoštevajte priročnik, lokalne predpise in navodila za varno uporabo.
      icon: tabler:shield-check
steps:
  title: Od škatle do dvorišča
  items:
    - title: '1. korak: <span class="font-medium">Izberite svoj bazen</span>'
      description: Primerjajte oblike in velikosti, da ustrezajo vašemu prostoru, gospodinjstvu in načinu, kako nameravate uporabljati vodo.
      icon: tabler:pool
    - title: '2. korak: <span class="font-medium">Nastavite</span>'
      description: Postavite na trdna, ravna tla, napihnite s priloženo električno črpalko in napolnite z vrtno cevjo.
      icon: tabler:rocket
    - title: '3. korak: <span class="font-medium">Kopanje vse poletje</span>'
      description: Ohranjajte vodo svežo s preprosto nego - posnemite, pokrijte in preverite pH kot pri vsakem majhnem bazenu.
      icon: tabler:ripple
    - title: '4. korak: <span class="font-medium">Pospravite stran</span>'
      description: Ko se sezona konča, bazen izpraznite, posušite, zvijte in pospravite v vrečko do naslednjega poletja.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Okrogli napihljivi bazen Inflatable Pool Factory Drop Stitch
blog_latest:
  title: Vodniki in vpogledi v bazene
  information: |
    Navodila za namestitev, nasveti za nego in nasveti za nakup napihljivih bazenov
    iz ekipe Inflatable Pool Factory.
faqs:
  title: Pogosta vprašanja o napihljivem bazenu
  subtitle: Pogosta vprašanja o napihljivih bazenih Inflatable Pool Factory.
  columns: 2
  items:
    - title: Kako dolgo traja nastavitev?
      description: 'Napihovanje traja 5-15 minut s priloženo električno zračno črpalko, odvisno od modela. Čas polnjenja je odvisen od kapacitete bazena in vaše zaloge vode.'
      icon: tabler:clock
      category: all
    - title: Kako tog je bazen Drop Stitch?
      description: Zelo tog. Stene Drop Stitch se močno napihnejo pri 4-5 PSI — podobno kot napihljiva deska za veslanje — tako bazen obdrži svojo obliko, ko je napolnjen z vodo.
      icon: tabler:hexagon
      category: all
    - title: Ali lahko otroci uporabljajo bazen?
      description: Da, ves čas pod aktivnim nadzorom odrasle osebe. Otroci nikoli ne smejo biti brez nadzora v ali blizu bazena - upoštevajte priročnik in lokalne varnostne predpise.
      icon: tabler:users
      category: all
    - title: Kako shranim bazen pozimi?
      description: Izpustite vodo, izpraznite bazen, pustite, da se popolnoma posuši, nato ga zvijte in shranite v priloženi vrečki za shranjevanje na mestu, zaščitenem pred zmrzaljo.
      icon: tabler:package
      category: all
    - title: Kaj je vključeno v bazen?
      description: Vsak bazen Inflatable Pool Factory vključuje električno zračno črpalko, komplet za popravilo in torbo za shranjevanje. Okrogli modeli imajo opcijsko nameščen pokrov.
      icon: tabler:box
      category: all
    - title: Katere velikosti so na voljo?
      description: 48 standardnih SKU-jev v štirih zbirkah — okrogli bazeni do 10 m premera, pravokotni bazeni do 6 × 5 m in SPA kadi z vgrajenimi sedeži. Za poslovne partnerje so na voljo velikosti po meri.
      icon: tabler:ruler-2
      category: all
    - title: Na katerih površinah lahko stoji bazen?
      description: 'Vsaka ravna, ravna površina brez ostrih predmetov – travnik, terasa ali paluba. Na grobih površinah je priporočljiva podlaga. Napolnjen bazen je težak: namestite ga samo na površino, ki prenese celotno težo, in najprej strukturno ocenite dvignjene krove, balkone in strehe.'
      icon: tabler:layout-grid
      category: all
    - title: Kako ohranim vodo čisto?
      description: Uporabite filtrirno črpalko, kjer je nameščena, posnemite ostanke, preverite pH in pokrijte bazen, ko ni v uporabi. Dolgotrajnost vode je odvisna od velikosti bazena, uporabe in filtracije – redno testirajte, namesto da se zanašate na določen urnik.
      icon: tabler:droplet
      category: all
