hero_text:
  tagline: Kontakt
  title: JAVITE SE
contact_form:
  id: form
  title: Pošaljite nam poruku
  subtitle: Za ponude, tehnička pitanja ili upite o partnerstvu, pošaljite nam liniju. Odgovaramo u roku od jednog radnog dana.
  email_to: info@inflatablepoolfactory.com
  submit_button: Pošaljite upit → Dobijte ponudu
  success_message: Hvala! Vaša poruka je stigla u naše prijemno sanduče. Odgovorićemo u roku od jednog radnog dana.
  error_message: Nešto nije u redu pri slanju vaše poruke. Pokušajte ponovo ili nam direktno pošaljite email.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: rešite sledeće'
  fields:
    - name: firstName
      label: Ime
      row: 1
    - name: lastName
      label: Prezime
      row: 1
    - name: companyName
      label: Naziv kompanije
      row: 2
    - name: address
      label: Adresa
      row: 3
    - name: zip
      label: Poštanski broj
      row: 4
    - name: country
      label: Država
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Procenjeni obim porudžbine
      row: 6
      type: select
      options:
        - value: ''
          label: Izaberite procenjeni volumen...
        - value: sample
          label: Samo uzorci/prototipovi
        - value: 5-10
          label: 5–10 jedinica (standardni MOK)
        - value: 100-500
          label: 100–500 jedinica
        - value: 500-plus
          label: 500+ jedinica (količina cena)
    - name: customization
      label: Potrebno je prilagođavanje?
      row: 7
      type: select
      options:
        - value: ''
          label: Izaberite tip prilagođavanja...
        - value: none
          label: Standardni proizvod (bez prilagođavanja)
        - value: logo
          label: Samo prilagođeni logotip/brendiranje
        - value: full
          label: Kompletan OEM (veličina, boja, grafika, pakovanje)
        - value: consultation
          label: Nisam siguran - potrebna je konsultacija
    - name: productInterest
      label: Grupa interesa
      row: 8
      type: select
      options:
        - value: ''
          label: Izaberite tip bazena...
        - value: all
          label: Svi bazeni / Kompletan katalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Predmet
      row: 9
    - name: message
      label: Poruka
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Drugi načini da dođete do nas
  columns: 3
  items:
    - title: Pitanja o prodaji
      description: Grupne ponude, veleprodajne cene i velike porudžbine.
      icon: tabler:shopping-bag
    - title: Tehnička podrška
      description: Pomoć za podešavanje, popravke, rezervni delovi i pitanja o nezi.
      icon: tabler:tool
    - title: OEM / ODM
      description: Prilagođene veličine, boje, korice, brendiranje i pakovanje.
      icon: tabler:palette
    - title: Email
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Vebsite
      description: felizbai.com
      icon: tabler:world
    - title: Vreme odgovora
      description: Odgovaramo u roku od jednog radnog dana.
      icon: tabler:clock
map:
  title: Javite se
  subtitle: Kontaktirajte Inflatable Pool Factory
  address: felizbai.com
  zoom: 15

