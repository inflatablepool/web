content_compliance:
  tagline: Briga i bezbednost
  title: Lako za posedovanje,<br />Lako voleti
  subtitle: Od isporuke do prvog kupanja do skladištenja na kraju sezone, posedovanje bazena Inflatable Pool Factory ostaje jednostavno.
  items:
    - title: Podešavanje za nekoliko minuta
      description: 'Otpakujte i naduvajte priloženom pumpom za 5-15 minuta, a zatim napunite baštenskim crevom — vreme punjenja zavisi od veličine bazena i količine vode.'
      icon: tabler:rocket
    - title: Jednostavna nega vode
      description: Standardni otvori za filter-pumpu od 32/38 mm, redovne pH provere i ugrađeni poklopac na okruglim modelima održavaju vodu čistom.
      icon: tabler:droplet
    - title: Očistite, ispraznite i čuvajte
      description: Ocedite, osušite, umotajte i spakujte bazen u vreću za odlaganje za zimu. Nema trajne instalacije za održavanje.
      icon: tabler:package
    - title: Safeti First
      description: Decu u svakom trenutku mora aktivno nadgledati odrasla osoba. Pridržavajte se priručnika, lokalnih pravila i uputstava za bezbednu upotrebu.
      icon: tabler:shield-check
steps:
  title: Od kutije do dvorišta
  items:
    - title: '1. korak: <span class="font-medium">Izaberite svoj bazen</span>'
      description: Uporedite oblike i veličine da odgovaraju vašem prostoru, domaćinstvu i načinu na koji planirate da koristite vodu.
      icon: tabler:pool
    - title: '2. korak: <span class="font-medium">Set It Up</span>'
      description: Postavite na čvrstu, ravnu podlogu, naduvajte priloženom električnom pumpom i napunite baštenskim crevom.
      icon: tabler:rocket
    - title: 'Korak 3: <span class="font-medium">Plivanje celo leto</span>'
      description: Održavajte vodu svežom jednostavnom negom - skinite, pokrijte i proverite pH kao u svakom malom bazenu.
      icon: tabler:ripple
    - title: '4. korak: <span class="font-medium">Čuvajte ga</span>'
      description: Kada se sezona završi, ocedite, osušite, umotajte i čuvajte bazen u torbi do sledećeg leta.
      icon: tabler:package
