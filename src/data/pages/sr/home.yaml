features:
  id: features
  tagline: Drop Stitch tehnologija
  title: Zašto Felizbej bazen<br />Is Different
  subtitle: Konstrukcija Drop Stitch visokog pritiska čini naše bazene čvrstim, izdržljivim i lakim za skladištenje.
  columns: 2
  items:
    - title: Čvrsti Drop Stitch zidovi
      description: 'Hiljade unutrašnjih navoja spaja zidne slojeve, tako da se bazen čvrsto naduvava na nominalnom nivou 4-5 PSI i zadržava oblik kada se napuni.'
      icon: tabler:hexagon
    - title: Brzo podešavanje bez alata
      description: Naduvajte sa uključenom električnom pumpom za nekoliko minuta, a zatim napunite baštenskim crevom. Bez alata, bez konstrukcije, bez profesionalne instalacije.
      icon: tabler:rocket
    - title: Packs Avai Small
      description: 'Ocedite, ispuhnite, namotajte i čuvajte bazen u svojoj torbi tokom zime - bazen pune veličine koji se pakuje kao mali za skladištenje u zatvorenom prostoru.'
      icon: tabler:package
    - title: Izdržljiv i otporan na UV zračenje
      description: 'Dvoslojni PVC drop stitch tkanina, projektovana da se odupre probojima i UV izloženost kroz celu sezonu porodične upotrebe.'
      icon: tabler:shield
    - title: Kompletan paket
      description: Svaki bazen se isporučuje sa električnom vazdušnom pumpom, kompletom za popravku i torbom za odlaganje. Dostupni su ugrađeni poklopci za okrugle modele.
      icon: tabler:box
    - title: Dizajn sa svešću o bezbednosti
      description: 'Referenca za dizajn stambenog bazena EN 16582-1 i ASTM F2666 — bezbednosne informacije specifične za model su date u dokumentaciji proizvoda. Uvek je potreban stalni nadzor odraslih.'
      icon: tabler:shield-check
