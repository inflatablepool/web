faqs:
  title: Često postavljana pitanja o bazenu na naduvavanje
  subtitle: Uobičajena pitanja o Inflatable Pool Factory bazenima na naduvavanje.
  columns: 2
  items:
    - title: Koliko dugo traje podešavanje?
      description: 'Naduvavanje traje 5-15 minuta sa uključenom električnom vazdušnom pumpom u zavisnosti od modela. Vreme punjenja zavisi od kapaciteta bazena i vašeg snabdevanja vodom.'
      icon: tabler:clock
      category: all
    - title: Koliko je čvrst bazen Drop Stitch?
      description: Veoma krut. Zidovi Drop Stitch-a se jako naduvaju pri 4-5 PSI — slično dasci za veslanje na naduvavanje — tako da bazen zadržava svoj oblik kada se napuni vodom.
      icon: tabler:hexagon
      category: all
    - title: Da li deca mogu da koriste bazen?
      description: Da, uz aktivan nadzor odraslih u svakom trenutku. Deca se nikada ne smeju ostavljati bez nadzora u bazenu ili blizu njega — pridržavajte se priručnika i lokalnih bezbednosnih pravila.
      icon: tabler:users
      category: all
    - title: Kako da čuvam bazen zimi?
      description: Ispustite vodu, ispraznite bazen, ostavite da se potpuno osuši, a zatim ga urolajte i odložite u priloženu kesu za skladištenje na mestu bez mraza.
      icon: tabler:package
      category: all
    - title: Šta je uključeno u bazen?
      description: Svaki Inflatable Pool Factory bazen uključuje električnu vazdušnu pumpu, komplet za popravku i torbu za odlaganje. Round models have an optional fitted cover.
      icon: tabler:box
      category: all
    - title: Koje veličine su dostupne?
      description: 48 standardnih SKU-a u četiri kolekcije — okrugli bazeni prečnika do 10 m, pravougaoni bazeni do 6 × 5 m i SPA kade sa ugrađenim sedištima. Za poslovne partnere dostupne su prilagođene veličine.
      icon: tabler:ruler-2
      category: all
    - title: Na kojim površinama može da stoji bazen?
      description: 'Bilo koja ravna, ravna površina bez oštrih predmeta — travnjak, terasa ili paluba. Na grubim površinama preporučuje se brušenje. Napunjeni bazen je težak: instalirajte ga samo na površini koja izdržava punu težinu i prvo treba da procenite strukturu podignutih paluba, balkona i krovova.'
      icon: tabler:layout-grid
      category: all
    - title: Kako da održavam vodu čistom?
      description: Koristite filter pumpu gde je ugrađena, skinite ostatke, proverite pH i pokrijte bazen kada se ne koristi. Koliko dugo voda traje zavisi od veličine bazena, upotrebe i filtracije - testirajte redovno umesto da se oslanjate na fiksni raspored.
      icon: tabler:droplet
      category: all
