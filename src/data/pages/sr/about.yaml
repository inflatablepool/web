hero:
  tagline: O nama
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory bazen na naduvavanje
  title: |
    Učinite plivanje jednostavnim, <br />
    na <span class="text-accent dark:text-white">Inflatable Pool Factory</span> način
  subtitle: Inflatable Pool Factory je vrhunski brend bazena na naduvavanje Drop Stitch koji je dizajnirao Inflatable Pool Team · Qingdao Vatrad Group. Verujemo da svaka porodica zaslužuje pravi bazen u dvorištu - bez izgradnje, dozvola ili stalne instalacije. Naši bazeni se čvrsto naduvaju za nekoliko minuta, preživljavaju puna leta porodične zabave i spakuju se malo na kraju sezone.
