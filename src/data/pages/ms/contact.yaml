hero_text:
  tagline: Kenalan
  title: HUBUNGI
contact_form:
  id: form
  title: Hantar mesej kepada kami
  subtitle: Untuk sebut harga, soalan teknikal atau pertanyaan perkongsian, hubungi kami. Kami membalas dalam satu hari perniagaan.
  email_to: info@inflatablepoolfactory.com
  submit_button: Hantar Pertanyaan → Dapatkan Sebut Harga
  success_message: Terima kasih! Mesej anda telah sampai di peti masuk kami. Kami akan membalas dalam masa satu hari bekerja.
  error_message: Kesilapan telah berlaku semasa menghantar mesej anda. Sila cuba lagi atau e-mel terus kepada kami.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: sila selesaikan perkara berikut'
  fields:
    - name: firstName
      label: Nama Pertama
      row: 1
    - name: lastName
      label: Nama Akhir
      row: 1
    - name: companyName
      label: Nama Syarikat
      row: 2
    - name: address
      label: Alamat
      row: 3
    - name: zip
      label: Poskod / Poskod
      row: 4
    - name: country
      label: Negara
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: e-mel
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Anggaran Jumlah Pesanan
      row: 6
      type: select
      options:
        - value: ''
          label: Pilih anggaran volum anda...
        - value: sample
          label: Sampel / Prototaip sahaja
        - value: 5-10
          label: 5–10 unit (MOQ Standard)
        - value: 100-500
          label: 100–500 unit
        - value: 500-plus
          label: 500+ unit (Harga volum)
    - name: customization
      label: Penyesuaian Diperlukan?
      row: 7
      type: select
      options:
        - value: ''
          label: Pilih jenis penyesuaian...
        - value: none
          label: Produk standard (tiada penyesuaian)
        - value: logo
          label: Logo / Penjenamaan Tersuai sahaja
        - value: full
          label: OEM penuh (saiz, warna, grafik, pembungkusan)
        - value: consultation
          label: Tidak pasti - memerlukan perundingan
    - name: productInterest
      label: Kumpulan Kepentingan
      row: 8
      type: select
      options:
        - value: ''
          label: Pilih jenis kolam...
        - value: all
          label: Semua kolam / Katalog penuh
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Subjek
      row: 9
    - name: message
      label: Mesej
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Cara lain untuk menghubungi kami
  columns: 3
  items:
    - title: Pertanyaan jualan
      description: Sebut harga kumpulan, harga borong dan pesanan pukal.
      icon: tabler:shopping-bag
    - title: Sokongan teknikal
      description: Bantuan persediaan, pembaikan, alat ganti dan soalan penjagaan.
      icon: tabler:tool
    - title: OEM / ODM
      description: Saiz, warna, penutup, penjenamaan dan pembungkusan tersuai.
      icon: tabler:palette
    - title: E-mel
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: laman web
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: Masa tindak balas
      description: Kami membalas dalam satu hari perniagaan.
      icon: tabler:clock
map:
  title: Hubungi
  subtitle: Hubungi Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

