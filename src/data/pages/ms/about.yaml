hero:
  tagline: Tentang kami
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Kolam renang kembung Inflatable Pool Factory
  title: |
    Menjadikan berenang mudah, <br />
    gaya <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory ialah jenama kolam inflatable drop stitch premium yang direka oleh Inflatable Pool Team · Qingdao Vatrad Group. Kami percaya setiap keluarga berhak mendapat kolam sebenar di belakang rumah — tanpa pembinaan, permit atau pemasangan kekal. Kolam renang kami mengembang tegar dalam beberapa minit, bertahan sepanjang musim panas dengan keseronokan keluarga, dan berkemas kecil pada akhir musim.
