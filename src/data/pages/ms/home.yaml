content_compliance:
  tagline: Penjagaan & Keselamatan
  title: Mudah dimiliki,<br />Mudah Dicintai
  subtitle: Dari penghantaran hingga berenang pertama hingga penyimpanan akhir musim, memiliki kolam Inflatable Pool Factory kekal mudah.
  items:
    - title: Persediaan dalam Minit
      description: 'Buka kotak dan tiup dengan pam yang disertakan dalam 5-15 minit, kemudian isi dengan hos taman — masa pengisian berbeza mengikut saiz kolam dan bekalan air.'
      icon: tabler:rocket
    - title: Penjagaan Air Mudah
      description: Port pam penapis 32/38 mm standard, pemeriksaan pH biasa dan penutup yang dipasang pada model bulat memastikan air bersih.
      icon: tabler:droplet
    - title: Bersihkan, Toskan & Simpan
      description: Toskan, keringkan, gulung dan bungkus kolam ke dalam beg simpanannya untuk musim sejuk. Tiada pemasangan kekal untuk diselenggara.
      icon: tabler:package
    - title: Keselamatan Diutamakan
      description: Kanak-kanak mesti diawasi secara aktif oleh orang dewasa pada setiap masa. Ikut manual, peraturan tempatan dan panduan penggunaan selamat.
      icon: tabler:shield-check
