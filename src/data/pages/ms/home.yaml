features:
  id: features
  tagline: Teknologi Drop Stitch
  title: Mengapa Kolam Inflatable Pool Factory<br />Berbeza
  subtitle: Pembinaan Drop Stitch bertekanan tinggi menjadikan kolam kami tegar, tahan lama dan mudah disimpan.
  columns: 2
  items:
    - title: Dinding Drop Stitch Tegar
      description: 'Beribu-ribu benang dalaman mengunci lapisan dinding bersama-sama, jadi kolam mengembang tegar pada nilai 4-5 PSI dan mengekalkan bentuknya apabila diisi.'
      icon: tabler:hexagon
    - title: Persediaan Cepat, Tanpa Alat
      description: Tiup dengan pam elektrik yang disertakan dalam beberapa minit, kemudian isi dengan hos taman. Tiada alat, tiada pembinaan, tiada pemasangan profesional.
      icon: tabler:rocket
    - title: Bungkus Kecil
      description: 'Toskan, kempiskan, gulung dan simpan kolam di dalam begnya sepanjang musim sejuk — kolam bersaiz penuh yang dibungkus kecil untuk simpanan dalaman.'
      icon: tabler:package
    - title: Tahan Lama & Tahan UV
      description: 'Fabrik PVC drop stitch dua lapisan, direka bentuk untuk menahan tusukan dan pendedahan UV sepanjang musim penuh penggunaan keluarga.'
      icon: tabler:shield
    - title: Pakej Lengkap
      description: Setiap kolam dihantar dengan pam udara elektrik, kit pembaikan dan beg penyimpanan. Sarung yang dipasang tersedia untuk model bulat.
      icon: tabler:box
    - title: Reka Bentuk Sedar Keselamatan
      description: 'Reka bentuk kolam kediaman merujuk EN 16582-1 dan ASTM F2666 — maklumat keselamatan khusus model disediakan dalam dokumentasi produk. Pengawasan orang dewasa yang berterusan sentiasa diperlukan.'
      icon: tabler:shield-check
