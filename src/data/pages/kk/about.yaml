hero:
  tagline: Біз туралы
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory үрлемелі бассейні
  title: |
    Жүзуді қарапайым ету, <br />
     <span class="text-accent dark:text-white">Inflatable Pool Factory</span> стилінде
  subtitle: Inflatable Pool Factory - Inflatable Pool Team · Qingdao Vatrad Group әзірлеген жоғары сапалы Drop Stitch үрлемелі бассейн бренді. Әрбір отбасы құрылыссыз, рұқсатсыз немесе тұрақты қондырғысыз аулада нағыз бассейнге лайық деп санаймыз. Біздің бассейндер бірнеше минут ішінде қатты толтырылады, отбасылық көңіл көтерудің толық жазынан аман қалады және маусымның соңында шағын жиналады.
stats:
