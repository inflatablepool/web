features3_what_we_build:
  title: Біз не саламыз
  subtitle: Бізге белгілі бір мақсатты өнім желісі — жоғары қысымды Drop Stitch үрлемелі бассейндер.
  columns: 3
  isBeforeContent: true
  items:
    - title: Тік бұрышты бассейндер
      description: Кеңістігіңіз үшін жүзу аймағын барынша арттыратын отбасылық өлшемді тікбұрышты Drop Stitch бассейндері.
      icon: tabler:rectangle
    - title: Дөңгелек көк бассейндер
      description: Классикалық аула бассейні - жарқын көк, қатты Drop Stitch қабырғалары, жылдам орнату.
      icon: tabler:circle
    - title: Дөңгелек сұр бассейндер
      description: Заманауи сұр түсті және қосымша жабдықталған қақпағы бар біздің премиум желісі.
      icon: tabler:circle-dot
    - title: Ыстық ванна СПА бассейндері
      description: 'Кіріктірілген отырғыштары және 5 mm оқшауланған түбі бар оқшауланған ванна үлгілері — сыртқы жылытқыштармен (жылытқыш қосылмаған) пайдалануға арналған.'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Толық пакеттер
      description: Әрбір бассейнде электрлік ауа сорғысы, жөндеу жинағы және сақтауға арналған сөмке бар.
      icon: tabler:package
    - title: Арнайы өлшемдер
      description: Брендтерге, дистрибьюторларға және қонақжайлылық жобаларына арналған OEM өлшемдері, түстері және мұқабалары.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Логотипті басып шығару және бөлшек саудаға дайын орамасы бар жеке жапсырма өндірісі.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Inflatable Pool Factory тікбұрышты Drop Stitch үрлемелі бассейні
steps2_values:
  title: Біздің құндылықтарымыз
  subtitle: Біз жасайтын әрбір бассейнді қалыптастыратын үш принцип.
  items:
    - title: Оны сіздің отбасыңыз пайдаланатындай құрыңыз
      description: Әрбір тігіс, қабырға және клапанға өз отбасыларымыз шомылатын сияқты.
      icon: tabler:heart
    - title: Біз сатпас бұрын инженер
      description: Кез келген бассейнге жіберілмес бұрын оның номиналды қысымынан жоғары сыналған жоғары қысымды Drop Stitch конструкциясы.
      icon: tabler:settings
    - title: Маусымнан асып түсетін қолдау
      description: Questions, spare parts, or warranty — contact us at info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: Белгілер
  subtitle: Inflatable Pool Factory әңгімесінің қысқаша нұсқасы.
  isReversed: true
  items:
    - title: Үрлемелі бассейндерге назар аударылған
      description: 'Inflatable Pool Factory бір ғана мақсатпен құрылған: премиум Drop Stitch үрлемелі бассейндер.'
      icon: tabler:pool
    - title: Үш қол жинағы
      description: Тіктөртбұрышты, дөңгелек көк және дөңгелек сұр бассейн сызықтары, әрқайсысының қосымша қақпақтары және реттелетін өлшемдері бар.
      icon: tabler:circle-check
    - title: Дүние жүзіндегі серіктестерге арналған OEM/ODM
      description: Брендтерге, дистрибьюторларға, қонақ үйлерге және глампинг операторларына арналған тапсырыс бойынша өндіріс.
      icon: tabler:world
