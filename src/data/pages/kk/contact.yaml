hero_text:
  tagline: Байланыс
  title: ХАБАРЛАСЫҢЫЗ
contact_form:
  id: form
  title: Бізге хабарлама жіберіңіз
  subtitle: Баға ұсыныстары, техникалық сұрақтар немесе серіктестік туралы сұраулар үшін бізге желіні қалдырыңыз. Біз бір жұмыс күні ішінде жауап береміз.
  email_to: info@inflatablepoolfactory.com
  submit_button: Сұрау жіберу → Баға алу
  success_message: Рахмет! Сіздің хабарламаңыз біздің кіріс жәшігімізге түсті. Біз бір жұмыс күні ішінде жауап береміз.
  error_message: Хабарыңызды жіберу кезінде бірдеңе дұрыс болмады. Қайталап көріңіз немесе бізге тікелей электрондық хат жіберіңіз.
  default_country_code: '+86'
  captcha:
    label: 'Спамға қарсы: мынаны шешіңіз'
  fields:
    - name: firstName
      label: Аты
      row: 1
    - name: lastName
      label: Фамилия
      row: 1
    - name: companyName
      label: Компания атауы
      row: 2
    - name: address
      label: Мекенжай
      row: 3
    - name: zip
      label: Пошталық индекс
      row: 4
    - name: country
      label: Ел
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: Электрондық пошта
      row: 5
      type: email
    - name: tel
      label: ТЕЛ
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Болжалды тапсырыс көлемі
      row: 6
      type: select
      options:
        - value: ''
          label: Болжалды көлемді таңдаңыз...
        - value: sample
          label: Үлгілер/тек прототиптер
        - value: 5-10
          label: 5–10 бірлік (стандартты MOQ)
        - value: 100-500
          label: 100-500 бірлік
        - value: 500-plus
          label: 500+ бірлік (көлемдік баға)
    - name: customization
      label: Теңшеу қажет пе?
      row: 7
      type: select
      options:
        - value: ''
          label: Теңшеу түрін таңдаңыз...
        - value: none
          label: Стандартты өнім (теңшеу жоқ)
        - value: logo
          label: Тек пайдаланушы логотипі/брендинг
        - value: full
          label: Толық OEM (өлшем, түс, графика, орау)
        - value: consultation
          label: Сенімсіз - кеңес қажет
    - name: productInterest
      label: Қызығушылықтар пулы
      row: 8
      type: select
      options:
        - value: ''
          label: Бассейн түрін таңдаңыз...
        - value: all
          label: Барлық бассейндер / Толық каталог
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Тақырып
      row: 9
    - name: message
      label: Хабарлама
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Бізге жетудің басқа жолдары
  columns: 3
  items:
    - title: Сату сұраулары
      description: Пул бағалары, көтерме бағалар және жаппай тапсырыстар.
      icon: tabler:shopping-bag
    - title: Техникалық көмек
      description: Орнату бойынша анықтама, жөндеу, қосалқы бөлшектер және күтім сұрақтары.
      icon: tabler:tool
    - title: OEM / ODM
      description: Таңдамалы өлшемдер, түстер, мұқабалар, брендинг және орау.
      icon: tabler:palette
    - title: Электрондық пошта
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Веб-сайт
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: Жауап беру уақыты
      description: Біз бір жұмыс күні ішінде жауап береміз.
      icon: tabler:clock
map:
  title: Хабарласыңыз
  subtitle: Inflatable Pool Factory хабарласыңыз
  address: inflatablepoolfactory.com
  zoom: 15

