blog_latest:
  title: Бассейнге арналған гидтер және түсініктемелер
  information: |
    Үрлемелі бассейндерді орнату бойынша нұсқаулықтар, күтім бойынша кеңестер және сатып алу бойынша кеңестер
    Inflatable Pool Factory командасынан.
faqs:
  title: Үрлемелі бассейн туралы жиі қойылатын сұрақтар
  subtitle: Inflatable Pool Factory үрлемелі бассейндері туралы жиі қойылатын сұрақтар.
  columns: 2
  items:
    - title: Орнату қанша уақытты алады?
      description: 'Үлгіге байланысты электрлік ауа сорғысының көмегімен үрлеу 5-15 минутты алады. Толтыру уақыты бассейннің сыйымдылығына және сумен қамтамасыз етілуіне байланысты өзгереді.'
      icon: tabler:clock
      category: all
    - title: Drop Stitch бассейні қаншалықты қатты?
      description: Өте қатты. Drop Stitch қабырғалары үрленетін қалақ тақтасына ұқсас 4-5 PSI деңгейінде қатты үрленеді, сондықтан бассейн сумен толтырылған кезде пішінін сақтайды.
      icon: tabler:hexagon
      category: all
    - title: Балалар бассейнді пайдалана ала ма?
      description: Иә, әрқашан ересектердің белсенді бақылауымен. Балаларды ешқашан бассейнде немесе оның жанында қараусыз қалдыруға болмайды — нұсқаулықты және жергілікті қауіпсіздік ережелерін сақтаңыз.
      icon: tabler:users
      category: all
    - title: Қыста бассейнді қалай сақтауға болады?
      description: Суды төгіп тастаңыз, бассейнді сөндіріңіз, оны толығымен құрғатыңыз, содан кейін оны орап, жинақтағы сақтауға арналған қапшықта аязсыз жерде сақтаңыз.
      icon: tabler:package
      category: all
    - title: Бассейнге не кіреді?
      description: Әрбір Inflatable Pool Factory бассейнінде электрлік ауа сорғысы, жөндеу жинағы және сақтауға арналған сөмке бар. Дөңгелек үлгілерде қосымша орнатылған қақпақ бар.
      icon: tabler:box
      category: all
    - title: Қандай өлшемдері бар?
      description: Төрт топтама бойынша 48 стандартты SKU – ені 10 м-ге дейінгі дөңгелек бассейндер, 6 × 5 м-ге дейінгі тікбұрышты бассейндер және кіріктірілген отырғыштары бар SPA ванналары. Жеке өлшемдер іскер серіктестер үшін қол жетімді.
      icon: tabler:ruler-2
      category: all
    - title: Бассейн қандай беттерде тұра алады?
      description: 'Үшкір заттарсыз кез келген тегіс, тегіс бет – көгалдар, патио немесе палуба. Кедір-бұдыр беттерге жер бетін төсеу ұсынылады. Толтырылған бассейн ауыр: тек толық салмақты көтеретін бетке ғана орнатыңыз және алдымен құрылымдық тұрғыдан бағаланған биік палубалар, балкондар және шатырлар болуы керек.'
      icon: tabler:layout-grid
      category: all
    - title: Суды қалай таза ұстаймын?
      description: Орнатылған жерде сүзгі сорғысын пайдаланыңыз, қоқысты тазалаңыз, рН деңгейін тексеріңіз және пайдаланбаған кезде бассейнді жабыңыз. Су қанша уақытқа созылатыны бассейннің көлеміне, пайдалануына және сүзуіне байланысты - бекітілген кестеге сүйенбей, жүйелі түрде сынақтан өткізіңіз.
      icon: tabler:droplet
      category: all
