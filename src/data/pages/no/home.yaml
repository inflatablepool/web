faqs:
  title: Vanlige spørsmål om oppblåsbart basseng
  subtitle: Vanlige spørsmål om Inflatable Pool Factory oppblåsbare svømmebassenger.
  columns: 2
  items:
    - title: Hvor lang tid tar oppsettet?
      description: 'Oppblåsing tar 5-15 minutter med den medfølgende elektriske luftpumpen avhengig av modell. Påfyllingstiden varierer med bassengkapasiteten og vannforsyningen din.'
      icon: tabler:clock
      category: all
    - title: Hvor stiv er en drop stitch pool?
      description: Veldig stiv. Drop Stitch-veggene blåses hardt opp med 4-5 PSI – lik et oppblåsbart padlebrett – slik at bassenget holder formen når det fylles med vann.
      icon: tabler:hexagon
      category: all
    - title: Kan barn bruke bassenget?
      description: Ja, med aktivt voksentilsyn til enhver tid. Barn må aldri etterlates uten tilsyn i eller i nærheten av bassenget – følg bruksanvisningen og lokale sikkerhetsregler.
      icon: tabler:users
      category: all
    - title: Hvordan oppbevarer jeg bassenget om vinteren?
      description: Tøm vannet, tøm bassenget, la det tørke helt, rull det deretter sammen og oppbevar det i den medfølgende oppbevaringsposen på et frostfritt sted.
      icon: tabler:package
      category: all
    - title: Hva følger med bassenget?
      description: Hvert Inflatable Pool Factory-basseng inkluderer en elektrisk luftpumpe, et reparasjonssett og en oppbevaringspose. Runde modeller har et valgfritt montert deksel.
      icon: tabler:box
      category: all
    - title: Hvilke størrelser er tilgjengelige?
      description: 48 standard SKU-er på tvers av fire samlinger — runde bassenger med en diameter på opptil 10 m, rektangulære bassenger på opptil 6 × 5 m, og SPA-kar med innebygde seter. Egendefinerte størrelser er tilgjengelige for forretningspartnere.
      icon: tabler:ruler-2
      category: all
    - title: Hvilke overflater kan bassenget stå på?
      description: 'Enhver flat, jevn overflate fri for skarpe gjenstander - plen, uteplass eller dekk. På grove overflater anbefales en bakkeduk. Et fylt basseng er tungt: installer kun på en overflate som bærer hele vekten, og ha forhøyede dekk, balkonger og hustak strukturelt vurdert først.'
      icon: tabler:layout-grid
      category: all
    - title: Hvordan holder jeg vannet rent?
      description: Bruk en filterpumpe der den er montert, skum av rusk, kontroller pH og dekk til bassenget når det ikke er i bruk. Hvor lenge vannet varer avhenger av bassengstørrelse, bruk og filtrering – test regelmessig i stedet for å stole på en fast tidsplan.
      icon: tabler:droplet
      category: all
