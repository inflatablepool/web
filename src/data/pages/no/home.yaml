content_compliance:
  tagline: Omsorg og sikkerhet
  title: Lett å eie,<br />Lett å elske
  subtitle: Fra levering til første svømmetur til lagring i slutten av sesongen, er det enkelt å eie et Inflatable Pool Factory-basseng.
  items:
    - title: Oppsett på minutter
      description: 'Pakk ut og fyll opp med den medfølgende pumpen på 5-15 minutter, og fyll deretter med en hageslange - fylletiden varierer med bassengstørrelsen og vanntilførselen.'
      icon: tabler:rocket
    - title: Enkel vannpleie
      description: Standard 32/38 mm filterpumpeporter, regelmessige pH-kontroller og et montert deksel på runde modeller holder vannet rent.
      icon: tabler:droplet
    - title: Rengjør, tøm og lagre
      description: Tøm, tørk, rull sammen og pakk bassenget i oppbevaringsposen for vinteren. Ingen permanent installasjon å vedlikeholde.
      icon: tabler:package
    - title: Sikkerhet først
      description: Barn må være aktivt under oppsyn av en voksen til enhver tid. Følg bruksanvisningen, lokale regler og veiledning for sikker bruk.
      icon: tabler:shield-check
