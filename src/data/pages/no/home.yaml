features:
  id: features
  tagline: Drop Stitch-teknologi
  title: Hvorfor et Inflatable Pool Factory-basseng<br />er annerledes
  subtitle: Høytrykks Drop Stitch-konstruksjon gjør bassengene våre stive, holdbare og enkle å lagre.
  columns: 2
  items:
    - title: Stive Drop Stitch-vegger
      description: 'Tusenvis av innvendige gjenger låser vegglagene sammen, slik at bassenget blåser opp stivt med karakterene 4-5 PSI og holder formen når det fylles.'
      icon: tabler:hexagon
    - title: Rask, verktøyfri oppsett
      description: Blås opp med den medfølgende elektriske pumpen på minutter, og fyll deretter med en hageslange. Ingen verktøy, ingen konstruksjon, ingen profesjonell installasjon.
      icon: tabler:rocket
    - title: Pakker bort små
      description: 'Tøm, tøm ut luften, rull sammen og oppbevar bassenget i posen over vinteren – et basseng i full størrelse som pakker seg ned for innendørs oppbevaring.'
      icon: tabler:package
    - title: Slitesterk og UV-bestandig
      description: 'Dobbeltlags PVC drop stitch-stoff, konstruert for å motstå punkteringer og UV-eksponering gjennom en hel sesong med familiebruk.'
      icon: tabler:shield
    - title: Komplett pakke
      description: Hvert basseng leveres med en elektrisk luftpumpe, reparasjonssett og oppbevaringspose. Tilpassede deksler tilgjengelig for runde modeller.
      icon: tabler:box
    - title: Sikkerhetsbevisst design
      description: 'Utforming av boligbasseng som refererer til EN 16582-1 og ASTM F2666 — modellspesifikk sikkerhetsinformasjon er gitt i produktdokumentasjonen. Konstant tilsyn av voksne er alltid nødvendig.'
      icon: tabler:shield-check
