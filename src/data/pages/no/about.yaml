features3_what_we_build:
  title: Det vi bygger
  subtitle: En fokusert produktlinje vi kjenner ut og inn - høytrykks Drop Stitch oppblåsbare svømmebassenger.
  columns: 3
  isBeforeContent: true
  items:
    - title: Rektangulære bassenger
      description: Rektangulære Drop Stitch-bassenger i familiestørrelse som maksimerer svømmeområdet for plassen din.
      icon: tabler:rectangle
    - title: Runde blå bassenger
      description: Det klassiske bakgårdsbassenget – levende blå, stive Drop Stitch-vegger, rask oppsett.
      icon: tabler:circle
    - title: Runde grå bassenger
      description: Vår premium linje med en moderne grå finish og valgfritt montert deksel.
      icon: tabler:circle-dot
