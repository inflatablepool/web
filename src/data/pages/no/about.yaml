hero:
  tagline: Om oss
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory oppblåsbart svømmebasseng
  title: |
    Gjør svømming enkelt, <br />
    på <span class="text-accent dark:text-white">Inflatable Pool Factory</span>-måten
  subtitle: Inflatable Pool Factory er et premium drop stitch oppblåsbart bassengmerke designet av Inflatable Pool Team · Qingdao Vatrad Group. Vi mener at hver familie fortjener et ekte basseng i bakgården - uten konstruksjon, tillatelser eller en permanent installasjon. Bassengene våre blåses opp stive på få minutter, overlever hele somre med familiemoro, og pakker sammen små ved sesongslutt.
