hero_text:
  tagline: تماس بگیرید
  title: تماس بگیرید
contact_form:
  id: form
  title: برای ما پیام ارسال کنید
  subtitle: برای نقل قول، سؤالات فنی یا سؤالات مشارکت، با ما تماس بگیرید. ما ظرف یک روز کاری پاسخ می دهیم.
  email_to: info@inflatablepoolfactory.com
  submit_button: ارسال استعلام → دریافت قیمت
  success_message: با تشکر پیام شما در صندوق ورودی ما قرار گرفت. ما ظرف یک روز کاری پاسخ خواهیم داد.
  error_message: هنگام ارسال پیام شما مشکلی پیش آمد. لطفاً دوباره امتحان کنید یا مستقیماً به ما ایمیل بزنید.
  default_country_code: '+86'
  captcha:
    label: 'ضد اسپم: لطفا موارد زیر را حل کنید'
  fields:
    - name: firstName
      label: نام
      row: 1
    - name: lastName
      label: نام خانوادگی
      row: 1
    - name: companyName
      label: نام شرکت
      row: 2
    - name: address
      label: آدرس
      row: 3
    - name: zip
      label: کد پستی / کد پستی
      row: 4
    - name: country
      label: کشور
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: ایمیل
      row: 5
      type: email
    - name: tel
      label: تلفن
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: حجم تخمینی سفارش
      row: 6
      type: select
      options:
        - value: ''
          label: حجم تخمینی خود را انتخاب کنید...
        - value: sample
          label: فقط نمونه ها / نمونه های اولیه
        - value: 5-10
          label: 5-10 واحد (استاندارد MOQ)
        - value: 100-500
          label: 100-500 واحد
        - value: 500-plus
          label: 500+ واحد (قیمت حجمی)
    - name: customization
      label: سفارشی سازی مورد نیاز است؟
      row: 7
      type: select
      options:
        - value: ''
          label: انتخاب نوع سفارشی سازی...
        - value: none
          label: محصول استاندارد (بدون سفارشی سازی)
        - value: logo
          label: فقط لوگوی سفارشی / نام تجاری
        - value: full
          label: OEM کامل (اندازه، رنگ، گرافیک، بسته بندی)
        - value: consultation
          label: مطمئن نیستم - نیاز به مشاوره دارید
    - name: productInterest
      label: استخر مورد علاقه
      row: 8
      type: select
      options:
        - value: ''
          label: انتخاب نوع استخر...
        - value: all
          label: همه استخرها / کاتالوگ کامل
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: موضوع
      row: 9
    - name: message
      label: پیام
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: راه های دیگر برای رسیدن به ما
  columns: 3
  items:
    - title: استعلام فروش
      description: قیمت استخر، قیمت عمده فروشی، و سفارشات عمده.
      icon: tabler:shopping-bag
    - title: پشتیبانی فنی
      description: راه اندازی راه اندازی، تعمیرات، قطعات یدکی، و سوالات مراقبت.
      icon: tabler:tool
    - title: OEM / ODM
      description: اندازه های سفارشی، رنگ ها، پوشش ها، نام تجاری، و بسته بندی.
      icon: tabler:palette
    - title: ایمیل
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: وب سایت
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: زمان پاسخگویی
      description: ما ظرف یک روز کاری پاسخ می دهیم.
      icon: tabler:clock
map:
  title: تماس بگیرید
  subtitle: با Inflatable Pool Factory تماس بگیرید
  address: inflatablepoolfactory.com
  zoom: 15

