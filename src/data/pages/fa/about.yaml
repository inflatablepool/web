hero:
  tagline: درباره ما
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: استخر بادی Inflatable Pool Factory
  title: |
    ساده کردن شنا، <br />
    به سبک <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory یک برند استخر بادی درجه یک Drop Stitch است که توسط Inflatable Pool Team · Qingdao Vatrad Group طراحی می شود. ما معتقدیم که هر خانواده سزاوار یک استخر واقعی در حیاط خلوت است - بدون ساخت و ساز، مجوز، یا نصب دائمی. استخرهای ما در عرض چند دقیقه به صورت سفت و سخت باد می‌شوند، تابستان‌های کاملی از تفریحات خانوادگی را پشت سر می‌گذارند، و در پایان فصل بسته‌بندی کوچکی را در خود جای می‌دهند.
stats:
