features:
  id: features
  tagline: Drop Stitch Texnologiyası
  title: Niyə Inflatable Pool Factory Hovuzu<br />Fərqlidir
  subtitle: Yüksək təzyiqli Drop Stitch konstruksiyası hovuzlarımızı möhkəm, dayanıqlı və saxlanmasını asanlaşdırır.
  columns: 2
  items:
    - title: Sərt Drop Stitch Divarları
      description: 'Minlərlə daxili iplər divar təbəqələrini bir-birinə bağlayır, beləliklə hovuz 4-5 PSI nominalında sərt şəkildə şişirilir və doldurulduqda formasını saxlayır.'
      icon: tabler:hexagon
    - title: Sürətli, Alətsiz Quraşdırma
      description: Daxil olan elektrik nasosu ilə bir neçə dəqiqə ərzində şişirdin, sonra bağ şlanqı ilə doldurun. Alət yoxdur, tikinti yoxdur, peşəkar quraşdırma yoxdur.
      icon: tabler:rocket
    - title: Paketlər Kiçik
      description: 'Hovuzu boşaltın, söndürün, yuvarlayın və qışda çantasında saxlayın - qapalı saxlama üçün kiçik bir yerə yığılan tam ölçülü hovuz.'
      icon: tabler:package
    - title: Davamlı və UV-Davamlıdır
      description: 'İki qatlı PVC drop stitch parça, ailənin tam mövsümü boyunca deşilmələrə və UV məruz qalmasına müqavimət göstərmək üçün hazırlanmışdır.'
      icon: tabler:shield
    - title: Tam Paket
      description: Hər hovuz elektrik hava nasosu, təmir dəsti və saxlama çantası ilə təchiz olunur. Dəyirmi modellər üçün quraşdırılmış örtüklər mövcuddur.
      icon: tabler:box
    - title: Təhlükəsizlik şüurlu dizayn
      description: 'EN 16582-1 və ASTM F2666 standartlarına istinad edən yaşayış hovuzunun dizaynı — modelə aid təhlükəsizlik məlumatı məhsul sənədlərində verilmişdir. Daimi böyüklərin nəzarəti həmişə tələb olunur.'
      icon: tabler:shield-check
content_customer_types:
  tagline: Hovuz ideyaları
  title: Üçün Doğru Hovuz<br />Sizin Məkanınız
  subtitle: Həqiqi quraşdırmalar, real ölçülər və düzgün hovuz seçmək üçün dürüst rəhbərlik.
  items:
    - title: Ailələr üçün həyət hovuzları
      description: Məkan planlaması, real istifadə edilə bilən ölçülər və həyətdə ailə yayları üçün asan texniki xidmət.
      icon: tabler:home
      cta: İdeyalar əldə edin
      cta_href: /pool-ideas/backyard-pools-for-families
    - title: Kiçik həyətlər üçün hovuzlar
      description: 'Dar açıq məkanlara uyğun olan yığcam yuvarlaq və kvadrat modellər — sərinləmək üçün otaq və ailənin su vaxtı.'
      icon: tabler:layout-grid
      cta: İdeyalar əldə edin
      cta_href: /pool-ideas/pools-for-small-backyards
    - title: Yığıncaqlar üçün böyük hovuzlar
      description: Yay günlərində bütün ekipaj üçün əsl üzgüçülük sahəsi olan böyük düzbucaqlı hovuzlar.
      icon: tabler:users
      cta: İdeyalar əldə edin
      cta_href: /pool-ideas/large-pools-for-family-gatherings
    - title: Açıq havada islatma və istirahət
      description: Daxili oturacaqları və izolyasiyalı dibləri olan SPA vannaları evdə gündəlik istirahət üçün.
      icon: tabler:ripple
      cta: İdeyalar əldə edin
      cta_href: /pool-ideas/outdoor-soaking-pools
    - title: Tətil üçün kirayə hovuzlar
      description: Tez qurulan və mövsümdən kənarda saxlanılan mövsümi qonaq şəraiti.
      icon: tabler:beach
      cta: İdeyalar əldə edin
      cta_href: /pool-ideas/pools-for-vacation-rentals
    - title: Glamping & Qonaqpərvərlik
      description: Fərqli açıq havada qalma yerləri – glampinq saytları, butik obyektləri və tədbir yerləri.
      icon: tabler:tent
      cta: İdeyalar əldə edin
      cta_href: /pool-ideas/pools-for-glamping-and-hospitality
content_categories:
  tagline: Mağaza hovuzları
  title: Hovuzlarımızı kəşf edin
  subtitle: Həyətiniz və ya açıq məkanınız üçün düzgün hovuzu tapmaq üçün formaları, ölçüləri və xüsusiyyətləri müqayisə edin.
content_workshop:
  isReversed: true
  tagline: Bizneslər üçün
  title: Biznes üçün hovuzlar,<br />çox
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Inflatable Pool Factory biznes tərəfdaşları üçün</h3>
  items:
    - title: Tətil İcarəsi və Qonaqpərvərlik
      description: Tətil kirayələri, qlampinq saytları və butik mülkləri üçün mövsümi qonaq şəraiti - yerləşdirmək üçün sürətli, saxlanması asan, saxlanması sadədir.
    - title: Pərakəndə və Brend Tərəfdaşları
      description: Bağ mərkəzləri, hovuz mağazaları və onlayn mağazalar üçün topdansatış proqramları və pərakəndə satışa hazır Drop Stitch hovuzları.
    - title: Fərdi və Şəxsi Etiket
      description: Brendlər üçün fərdi ölçülər, rənglər, üzlüklər, loqo çapı və pərakəndə qablaşdırma - istehsal tərəfdaşlarımız tərəfindən tikilir.
content_compliance:
  tagline: Qulluq və Təhlükəsizlik
  title: Sahibi olmaq asan,<br />Sevmək asan
  subtitle: Çatdırılmadan ilk üzməyə, mövsümün sonunda saxlanmaya qədər Inflatable Pool Factory hovuzuna sahib olmaq sadədir.
  items:
    - title: Dəqiqədə quraşdırma
      description: 'Qutudan çıxarın və daxil olan nasosla 5-15 dəqiqə ərzində doldurun, sonra bağ şlanqı ilə doldurun — doldurma vaxtı hovuzun ölçüsünə və su təchizatına görə dəyişir.'
      icon: tabler:rocket
    - title: Sadə Su Qulluğu
      description: Standart 32/38 mm filtr-nasos portları, müntəzəm pH yoxlamaları və yuvarlaq modellərdə quraşdırılmış qapaq suyu təmiz saxlayır.
      icon: tabler:droplet
    - title: Təmizləyin, Sökün və Saxlayın
      description: Hovuzu boşaltın, qurutun, yuvarlayın və qış üçün saxlama çantasına yığın. Saxlamaq üçün daimi quraşdırma yoxdur.
      icon: tabler:package
    - title: Birinci Təhlükəsizlik
      description: Uşaqlara hər zaman böyüklər tərəfindən fəal nəzarət edilməlidir. Təlimata, yerli qaydalara və təhlükəsiz istifadə təlimatına əməl edin.
      icon: tabler:shield-check
steps:
  title: Qutudan Həyətə
  items:
    - title: 'Addım 1: <span class="font-medium">Hovuzunuzu Seçin</span>'
      description: Məkanınıza, evinizə və sudan necə istifadə etməyi planlaşdırdığınıza uyğun olaraq forma və ölçüləri müqayisə edin.
      icon: tabler:pool
    - title: 'Addım 2: <span class="font-medium">Quraşdırın</span>'
      description: Möhkəm, düz bir yerə qoyun, daxil olan elektrik nasosu ilə şişirdin və bağ şlanqı ilə doldurun.
      icon: tabler:rocket
    - title: 'Addım 3: <span class="font-medium">Bütün Yayı Üzmək</span>'
      description: Sadə qayğı ilə suyu təzə saxlayın - hər hansı kiçik hovuz kimi yağdan təmizləyin, örtün və pH-ı yoxlayın.
      icon: tabler:ripple
    - title: 'Addım 4: <span class="font-medium">Uzaqda Saxlayın</span>'
      description: Mövsüm başa çatdıqda, hovuzu süzün, qurutun, yuvarlayın və gələn yaya qədər çantasında saxlayın.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory dəyirmi Drop Stitch şişmə hovuzu
blog_latest:
  title: Hovuz Bələdçiləri və İnsights
  information: |
    Quraşdırma təlimatları, qulluq tövsiyələri və şişmə hovuzlar üçün satın alma məsləhətləri
    Inflatable Pool Factory komandasından.
faqs:
  title: Şişmə hovuzu haqqında tez-tez verilən suallar
  subtitle: Inflatable Pool Factory şişmə hovuzları haqqında ümumi suallar.
  columns: 2
  items:
    - title: Quraşdırma nə qədər vaxt aparır?
      description: 'Modeldən asılı olaraq daxil olan elektrik hava nasosu ilə şişirmə 5-15 dəqiqə çəkir. Doldurma vaxtı hovuzun tutumu və su təchizatınıza görə dəyişir.'
      icon: tabler:clock
      category: all
    - title: Drop Stitch hovuzu nə qədər sərtdir?
      description: Çox sərt. Drop Stitch divarları 4-5 PSI-da güclü şəkildə şişirilir - şişmə avar taxtasına bənzər - buna görə də hovuz su ilə doldurulduqda öz formasını saxlayır.
      icon: tabler:hexagon
      category: all
    - title: Uşaqlar hovuzdan istifadə edə bilərmi?
      description: Bəli, hər zaman böyüklərin aktiv nəzarəti ilə. Uşaqlar heç vaxt hovuzda və ya yaxınlığında nəzarətsiz buraxılmamalıdır - təlimata və yerli təhlükəsizlik qaydalarına əməl edin.
      icon: tabler:users
      category: all
    - title: Qışda hovuzu necə saxlamaq olar?
      description: Suyu boşaltın, hovuzu söndürün, tam qurumasına icazə verin, sonra yuvarlayın və daxil olan saxlama çantasında şaxtasız yerdə saxlayın.
      icon: tabler:package
      category: all
    - title: Hovuza nə daxildir?
      description: Hər Inflatable Pool Factory hovuzuna elektrik hava nasosu, təmir dəsti və saxlama çantası daxildir. Dəyirmi modellərdə əlavə olaraq quraşdırılmış örtük var.
      icon: tabler:box
      category: all
    - title: Hansı ölçülər mövcuddur?
      description: Dörd kolleksiya üzrə 48 standart SKU - eni 10 m-ə qədər yuvarlaq hovuzlar, 6 × 5 m-ə qədər düzbucaqlı hovuzlar və quraşdırılmış oturacaqları olan SPA vannaları. Biznes tərəfdaşları üçün xüsusi ölçülər mövcuddur.
      icon: tabler:ruler-2
      category: all
    - title: Hovuz hansı səthlərdə dayana bilər?
      description: 'Kəskin əşyalar olmayan hər hansı düz, səviyyəli səth - qazon, veranda və ya göyərtə. Kobud səthlərdə torpaq təbəqəsi tövsiyə olunur. Doldurulmuş hovuz ağırdır: yalnız tam çəkiyə tab gətirən səthə quraşdırın və ilk növbədə yüksək göyərtələr, eyvanlar və dam örtükləri struktur olaraq qiymətləndirilməlidir.'
      icon: tabler:layout-grid
      category: all
    - title: Suyu necə təmiz saxlaya bilərəm?
      description: Quraşdırılmış yerdə filtr nasosundan istifadə edin, zibilləri təmizləyin, pH-ı yoxlayın və istifadə edilmədikdə hovuzu örtün. Suyun nə qədər davam etməsi hovuzun ölçüsündən, istifadəsindən və filtrasiyasından asılıdır - sabit cədvələ etibar etməkdənsə, müntəzəm olaraq sınaqdan keçirin.
      icon: tabler:droplet
      category: all
