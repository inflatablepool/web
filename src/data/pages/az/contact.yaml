hero_text:
  tagline: Əlaqə
  title: ƏLAQƏ EDİN
contact_form:
  id: form
  title: Bizə mesaj göndərin
  subtitle: Kotirovkalar, texniki suallar və ya tərəfdaşlıq sorğuları üçün bizə bir xətt buraxın.
  email_to: info@inflatablepoolfactory.com
  submit_button: Sorğu göndər → Təklif alın
  success_message: Təşəkkürlər! Mesajınız inboxumuza düşdü.
  error_message: Mesajınızı göndərərkən xəta baş verdi. Lütfən, yenidən cəhd edin və ya birbaşa bizə e-poçt göndərin.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: lütfən, aşağıdakıları həll edin'
  fields:
    - name: firstName
      label: Ad
      row: 1
    - name: lastName
      label: Soyadı
      row: 1
    - name: companyName
      label: Şirkət Adı
      row: 2
    - name: address
      label: Ünvan
      row: 3
    - name: zip
      label: Poçt / Poçt Kodu
      row: 4
    - name: country
      label: ölkə
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-poçt
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Təxmini Sifariş Həcmi
      row: 6
      type: select
      options:
        - value: ''
          label: Təxmini həcminizi seçin...
        - value: sample
          label: Yalnız nümunələr / Prototiplər
        - value: 100-500
          label: 100-500 ədəd
        - value: 500-plus
          label: 500+ kontur (həcmi qiymət)
    - name: customization
      label: Fərdiləşdirmə tələb olunur?
      row: 7
      type: select
      options:
        - value: ''
          label: Fərdiləşdirmə növünü seçin...
        - value: none
          label: Standart məhsul (fərdiləşdirmə yoxdur)
        - value: logo
          label: Yalnız Fərdi Loqo / Brendinq
        - value: full
          label: OEM (ölçü, rəng, qrafika, qablaşdırma)
        - value: consultation
          label: Əmin deyiləm - məsləhət lazımdır
    - name: productInterest
      label: Maraq Hovuzu
      row: 8
      type: select
      options:
        - value: ''
          label: Hovuz növünü seçin...
        - value: all
          label: Bütün hovuzlar / Tam kataloq
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Mövzu
      row: 9
    - name: message
      label: Mesaj
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Bizə çatmağın başqa yolları
  columns: 3
  items:
    - title: Satış sorğuları
      description: Hovuz qiymətləri, topdansatış qiymətləri və toplu sifarişlər.
      icon: tabler:shopping-bag
    - title: Texniki dəstək
      description: Quraşdırma yardımı, təmir, ehtiyat hissələri və qayğı sualları.
      icon: tabler:tool
    - title: OEM / ODM
      description: Xüsusi ölçülər, rənglər, örtüklər, marka və qablaşdırma.
      icon: tabler:palette
    - title: E-poçt
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Veb sayt
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Əlaqə saxlayın
  subtitle: Inflatable Pool Factory əlaqə saxlayın
  address: inflatablepoolfactory.com
  zoom: 15

