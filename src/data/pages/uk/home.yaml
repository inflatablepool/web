content_workshop:
  isReversed: true
  tagline: Для бізнесу
  title: Пули для бізнесу,<br />теж
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Inflatable Pool Factory для ділових партнерів</h3>
  items:
    - title: Оренда та готельний бізнес
      description: Сезонні зручності для гостей для оренди на відпочинок, місць для глемпінгу та бутиків — швидко розгортати, легко обслуговувати, легко зберігати.
    - title: Партнери з роздрібної торгівлі та брендів
      description: Оптові програми та готові для роздрібної торгівлі пули Drop Stitch для садових центрів, магазинів басейнів та інтернет-магазинів.
    - title: Спеціальна та приватна торгова марка
      description: Нестандартні розміри, кольори, обкладинки, друк логотипів і роздрібна упаковка для брендів — створені нашими партнерами-виробниками.
content_compliance:
  tagline: Догляд і безпека
  title: Легко володіти,<br />Легко любити
  subtitle: Від доставки до першого запливу до зберігання в кінці сезону – володіти басейном Inflatable Pool Factory залишається простим.
  items:
    - title: Налаштування за лічені хвилини
      description: 'Розпакуйте та накачайте насосом, що входить у комплект, за 5-15 хвилин, а потім заповніть садовим шлангом — час наповнення залежить від розміру басейну та кількості води.'
      icon: tabler:rocket
    - title: Простий догляд за водою
      description: Стандартні порти фільтра-насосу 32/38 мм, регулярні перевірки pH і встановлена ​​кришка на круглих моделях забезпечують чистоту води.
      icon: tabler:droplet
    - title: Очистіть, злийте та зберігайте
      description: Злийте воду, висушіть, згорніть і запакуйте басейн у мішок для зберігання на зиму. Немає постійної установки для обслуговування.
      icon: tabler:package
    - title: Безпека перш за все
      description: Діти повинні постійно перебувати під наглядом дорослих. Дотримуйтеся посібника, місцевих правил і вказівок щодо безпечного використання.
      icon: tabler:shield-check
steps:
  title: Від ящика до заднього двору
  items:
    - title: 'Крок 1: <span class="font-medium">Виберіть свій басейн</span>'
      description: Порівняйте форми та розміри відповідно до вашого простору, домогосподарства та того, як ви плануєте використовувати воду.
      icon: tabler:pool
    - title: 'крок 2: <span class="font-medium">Налаштуйте це</span>'
      description: Поставте на тверду рівну землю, накачайте електричним насосом, що входить у комплект, і заповніть садовим шлангом.
      icon: tabler:rocket
    - title: 'крок 3: <span class="font-medium">Плавати все літо</span>'
      description: Підтримуйте воду свіжою простим доглядом — знімайте, накривайте та перевіряйте pH, як у будь-якому маленькому басейні.
      icon: tabler:ripple
    - title: 'крок 4: <span class="font-medium">Зберігайте це подалі</span>'
      description: Коли сезон закінчиться, осушіть, висушіть, згорніть і зберігайте басейн у сумці до наступного літа.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Круглий надувний басейн Inflatable Pool Factory Drop Stitch
blog_latest:
  title: Посібники та аналітика пулу
  information: |
    Посібники з налаштування, поради з догляду та поради щодо купівлі надувних басейнів
    від команди Inflatable Pool Factory.
faqs:
  title: Часті питання про надувний басейн
  subtitle: Поширені запитання про надувні басейни Inflatable Pool Factory.
  columns: 2
  items:
    - title: Скільки часу займає налаштування?
      description: 'Накачування займає 5-15 хвилин за допомогою включеного електричного повітряного насоса залежно від моделі. Час наповнення залежить від місткості басейну та запасу води.'
      icon: tabler:clock
      category: all
    - title: Наскільки жорстким є пул Drop Stitch?
      description: Дуже жорсткий. Стінки Drop Stitch сильно надуваються при 4-5 PSI — подібно до надувної дошки для веслування — тому басейн зберігає свою форму, коли наповнюється водою.
      icon: tabler:hexagon
      category: all
    - title: Чи можуть діти відвідувати басейн?
      description: Так, постійно під наглядом дорослих. Ні в якому разі не можна залишати дітей без нагляду в басейні або біля нього — дотримуйтесь інструкції та місцевих правил безпеки.
      icon: tabler:users
      category: all
    - title: Як зберігати басейн взимку?
      description: Злийте воду, здуйте басейн, дайте йому повністю висохнути, потім згорніть його та зберігайте в пакеті для зберігання, що додається, у захищеному від морозу місці.
      icon: tabler:package
      category: all
    - title: Що входить в басейн?
      description: До кожного басейну Inflatable Pool Factory входить електричний повітряний насос, ремонтний набір і сумка для зберігання. Круглі моделі мають додаткову кришку.
      icon: tabler:box
      category: all
    - title: Які розміри доступні?
      description: 48 стандартних SKU у чотирьох колекціях — круглі басейни до 10 м у поперечнику, прямокутні басейни до 6 × 5 м і SPA-ванни з вбудованими сидіннями. Для ділових партнерів доступні індивідуальні розміри.
      icon: tabler:ruler-2
      category: all
    - title: На яких поверхнях може стояти басейн?
      description: 'Будь-яка плоска рівна поверхня без гострих предметів — газон, патіо або майданчик. На шорстких поверхнях рекомендується накладати ґрунтовий лист. Наповнений басейн важкий: встановлюйте лише на поверхні, яка витримує повну вагу, і спочатку оцініть структуру піднятих палуб, балконів і дахів.'
      icon: tabler:layout-grid
      category: all
    - title: Як зберегти воду чистою?
      description: Використовуйте фільтруючий насос, якщо він є, зніміть сміття, перевірте рН і накрийте басейн, коли він не використовується. Тривалість води залежить від розміру басейну, використання та фільтрації — перевіряйте регулярно, а не покладайтеся на фіксований графік.
      icon: tabler:droplet
      category: all
