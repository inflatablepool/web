features:
  id: features
  tagline: Технологія Drop Stitch
  title: Чому саме басейн Inflatable Pool Factory?<br />Є різним
  subtitle: Конструкція Drop Stitch високого тиску робить наші басейни жорсткими, довговічними та легкими для зберігання.
  columns: 2
  items:
    - title: Жорсткі стіни Drop Stitch
      description: 'Тисячі внутрішніх ниток скріплюють шари стін разом, тому басейн надувається жорстко при номінальному тиску 4-5 PSI і зберігає свою форму, коли наповнюється.'
      icon: tabler:hexagon
    - title: Швидке налаштування без інструментів
      description: Накачайте за допомогою електричного насоса, що входить у комплект, за лічені хвилини, а потім наповніть садовим шлангом. Без інструментів, без конструкції, без професійного монтажу.
      icon: tabler:rocket
    - title: Packs Away Small
      description: 'Осушіть, спустіть повітря, згорніть і зберігайте басейн у сумці взимку — повнорозмірний басейн, компактний для зберігання в приміщенні.'
      icon: tabler:package
    - title: Міцний і стійкий до УФ-променів
      description: 'Двошарова тканина PVC drop stitch, розроблена для захисту від проколів і впливу UV протягом повного сезону сімейного використання.'
      icon: tabler:shield
    - title: Повний пакет
      description: Кожен басейн поставляється з електричним повітряним насосом, ремонтним набором і сумкою для зберігання. Встановлені чохли доступні для круглих моделей.
      icon: tabler:box
    - title: Дизайн з урахуванням безпеки
      description: 'Конструкція житлового басейну з посиланням на EN 16582-1 і ASTM F2666 — інформація про безпеку для конкретної моделі надається в документації продукту. Завжди потрібен постійний нагляд дорослих.'
      icon: tabler:shield-check
