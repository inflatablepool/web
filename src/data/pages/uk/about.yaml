      amount: 4-5 PSI
    - title: контакт
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: Що ми будуємо
  subtitle: Цілеспрямована лінія продуктів, яку ми знаємо зсередини, — надувні басейни Drop Stitch високого тиску.
  columns: 3
  isBeforeContent: true
  items:
    - title: Прямокутні басейни
      description: Прямокутні басейни Drop Stitch сімейного розміру, які максимізують площу для плавання у вашому просторі.
      icon: tabler:rectangle
    - title: Круглі сині басейни
      description: Класичний басейн на задньому дворі — яскравий блакитний колір, жорсткі стіни Drop Stitch, швидке налаштування.
      icon: tabler:circle
    - title: Круглі сірі басейни
      description: Наша лінійка преміум-класу з сучасним сірим оздобленням і додатковою кришкою.
      icon: tabler:circle-dot
    - title: Гідромасажна ванна SPA басейни
      description: 'Ізольовані моделі гідромасажних ванн із вбудованими сидіннями та ізольованим дном 5 mm — для використання із зовнішніми обігрівачами (нагрівач не входить).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Повні пакети
      description: Кожен басейн поставляється з електричним повітряним насосом, ремонтним набором і сумкою для зберігання.
      icon: tabler:package
    - title: Нестандартні розміри
      description: OEM-розміри, кольори та кришки для брендів, дистриб’юторів і гостинних проектів.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Виробництво під приватною торговою маркою з друком логотипу та роздрібною упаковкою.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Прямокутний надувний басейн Inflatable Pool Factory Drop Stitch
steps2_values:
  title: Наші цінності
  subtitle: Три принципи, які формують кожен басейн, який ми будуємо.
  items:
    - title: Будуйте так, ніби ним користуватиметься ваша родина
      description: Кожен шов, стіна та клапан обробляються так, ніби в них плаватимуть наші власні родини.
      icon: tabler:heart
    - title: Інженер перед продажем
      description: Конструкція Drop Stitch високого тиску, випробувана вище номінального тиску, перед будь-яким транспортуванням басейну.
      icon: tabler:settings
    - title: Підтримка, яка витримає весь сезон
      description: Questions, spare parts, or warranty — reach us any time at info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: Віхи
  subtitle: Коротка версія історії Фелізбея.
  isReversed: true
  items:
    - title: Орієнтований на надувні басейни
      description: 'Компанія Inflatable Pool Factory була заснована з єдиною метою: надувні басейни преміум-класу Drop Stitch.'
      icon: tabler:pool
    - title: Три збори підписів
      description: Прямокутні, круглі сині та круглі сірі лінії басейну, кожна з додатковими кришками та нестандартними розмірами.
      icon: tabler:circle-check
    - title: OEM/ODM для партнерів по всьому світу
      description: Виробництво на замовлення для брендів, дистриб’юторів, готелів і операторів глемпінгу.
      icon: tabler:world
