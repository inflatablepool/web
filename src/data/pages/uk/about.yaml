hero:
  tagline: Про нас
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Надувний басейн Inflatable Pool Factory
  title: |
    Зробити плавання простим, <br />
    у стилі <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory — бренд надувних басейнів преміум-класу Drop Stitch, розроблений Inflatable Pool Team · Qingdao Vatrad Group. Ми віримо, що кожна родина заслуговує на справжній басейн у дворі — без будівництва, дозволів і постійної установки. Наші басейни накачуються за лічені хвилини, переживають повне літо сімейних розваг і збираються в кінці сезону.
