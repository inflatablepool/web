hero_text:
  tagline: Contact
  title: NEEM CONTACT OP
contact_form:
  id: form
  title: Stuur ons een bericht
  subtitle: Voor offertes, technische vragen of vragen over samenwerking kunt u ons een bericht sturen. Wij antwoorden binnen één werkdag.
  email_to: info@inflatablepoolfactory.com
  submit_button: Stuur een aanvraag → Ontvang een offerte
  success_message: Bedankt! Uw bericht is in onze inbox beland. Wij zullen binnen één werkdag antwoorden.
  error_message: Er is iets misgegaan bij het verzenden van uw bericht. Probeer het opnieuw of stuur ons direct een e-mail.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: los het volgende op'
  fields:
    - name: firstName
      label: Voornaam
      row: 1
    - name: lastName
      label: Achternaam
      row: 1
    - name: companyName
      label: Bedrijfsnaam
      row: 2
    - name: address
      label: Adres
      row: 3
    - name: zip
      label: Postcode
      row: 4
    - name: country
      label: Land
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Geschat ordervolume
      row: 6
      type: select
      options:
        - value: ''
          label: Selecteer uw geschatte volume...
        - value: sample
          label: Alleen monsters/prototypes
        - value: 5-10
          label: 5–10 eenheden (standaard MOQ)
        - value: 100-500
          label: 100–500 eenheden
        - value: 500-plus
          label: 500+ eenheden (volumeprijzen)
    - name: customization
      label: Maatwerk nodig?
      row: 7
      type: select
      options:
        - value: ''
          label: Aanpassingstype selecteren...
        - value: none
          label: Standaardproduct (geen maatwerk)
        - value: logo
          label: Alleen aangepast logo/branding
        - value: full
          label: Volledige OEM (grootte, kleur, afbeeldingen, verpakking)
        - value: consultation
          label: Ik weet het niet zeker - overleg nodig
    - name: productInterest
      label: Pool van interesse
      row: 8
      type: select
      options:
        - value: ''
          label: Selecteer zwembadtype...
        - value: all
          label: Alle zwembaden / Volledige catalogus
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Onderwerp
      row: 9
    - name: message
      label: Bericht
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Andere manieren om ons te bereiken
  columns: 3
  items:
    - title: Verkoopvragen
      description: Pooloffertes, groothandelsprijzen en bulkbestellingen.
      icon: tabler:shopping-bag
    - title: Technische ondersteuning
      description: Installatiehulp, reparaties, reserveonderdelen en onderhoudsvragen.
      icon: tabler:tool
    - title: OEM/ODM
      description: Aangepaste formaten, kleuren, covers, branding en verpakking.
      icon: tabler:palette
    - title: E-mail
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Website
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: Reactietijd
      description: Wij antwoorden binnen één werkdag.
      icon: tabler:clock
map:
  title: Neem contact op
  subtitle: Neem contact op met Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

