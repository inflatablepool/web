content_compliance:
  tagline: Zorg en veiligheid
  title: Gemakkelijk te bezitten,<br />Makkelijk om lief te hebben
  subtitle: 'Van de levering tot de eerste zwembeurt tot de opslag aan het einde van het seizoen: het bezitten van een Inflatable Pool Factory-zwembad blijft eenvoudig.'
  items:
    - title: Installatie in enkele minuten
      description: 'Uitpakken en opblazen met de meegeleverde pomp in 5-15 minuten, daarna vullen met een tuinslang. De vultijd varieert afhankelijk van de grootte van het zwembad en de watertoevoer.'
      icon: tabler:rocket
    - title: Eenvoudige waterverzorging
      description: Standaard filterpomppoorten van 32/38 mm, regelmatige pH-controles en een passend deksel op ronde modellen houden het water schoon.
      icon: tabler:droplet
    - title: Reinigen, laten leeglopen en opslaan
      description: Laat het zwembad leeglopen, droog het, rol het op en stop het in de opbergtas voor de winter. Geen permanente installatie om te onderhouden.
      icon: tabler:package
    - title: Veiligheid eerst
      description: Kinderen moeten te allen tijde actief onder toezicht staan ​​van een volwassene. Volg de handleiding, lokale regels en richtlijnen voor veilig gebruik.
      icon: tabler:shield-check
steps:
  title: Van doos tot achtertuin
  items:
    - title: 'Stap 1: <span class="font-medium">Kies uw zwembad</span>'
      description: Vergelijk vormen en maten die passen bij uw ruimte, huishouden en hoe u het water wilt gebruiken.
      icon: tabler:pool
    - title: 'Stap 2: <span class="font-medium">Stel het in</span>'
      description: Zet hem op een stevige, vlakke ondergrond, blaas hem op met de meegeleverde elektrische pomp en vul hem met een tuinslang.
      icon: tabler:rocket
    - title: 'Stap 3: <span class="font-medium">Zwem de hele zomer</span>'
      description: 'Houd het water fris met eenvoudige zorg: afschuimen, afdekken en de pH controleren zoals bij elk klein zwembad.'
      icon: tabler:ripple
    - title: 'Stap 4: <span class="font-medium">Berg het op</span>'
      description: Wanneer het seizoen voorbij is, laat u het zwembad leeglopen, drogen, oprollen en in de zak bewaren tot de volgende zomer.
      icon: tabler:package
