features:
  id: features
  tagline: Drop Stitch-technologie
  title: Waarom een ​​Inflatable Pool Factory-zwembad<br />Is anders
  subtitle: Dankzij de hogedruk-drop-stitch-constructie zijn onze zwembaden stijf, duurzaam en gemakkelijk op te bergen.
  columns: 2
  items:
    - title: Stijve Drop Stitch-wanden
      description: 'Duizenden interne schroefdraden houden de wandlagen aan elkaar vast, zodat het zwembad stijf opblaast met een nominale snelheid van 4-5 PSI en zijn vorm behoudt wanneer het gevuld is.'
      icon: tabler:hexagon
    - title: Snelle, gereedschapsloze installatie
      description: Binnen enkele minuten opblazen met de meegeleverde elektrische pomp en vervolgens vullen met een tuinslang. Geen gereedschap, geen constructie, geen professionele installatie.
      icon: tabler:rocket
    - title: Klein op te bergen
      description: 'Laat het zwembad leeglopen, laat het leeglopen, rol het op en berg het in de winter op in de zak: een groot zwembad dat klein kan worden opgevouwen voor opslag binnenshuis.'
      icon: tabler:package
    - title: Duurzaam en UV-bestendig
      description: 'Dubbellaags PVC drop-stitch-stof, ontworpen om lekrijden en UV-blootstelling te weerstaan ​​gedurende een volledig seizoen gezinsgebruik.'
      icon: tabler:shield
    - title: Compleet pakket
      description: Elk zwembad wordt geleverd met een elektrische luchtpomp, reparatieset en opbergtas. Passende hoezen beschikbaar voor ronde modellen.
      icon: tabler:box
    - title: Veiligheidsbewust ontwerp
      description: 'Ontwerp van residentiële zwembaden met verwijzing naar EN 16582-1 en ASTM F2666 – modelspecifieke veiligheidsinformatie vindt u in de productdocumentatie. Constant toezicht van een volwassene is altijd vereist.'
      icon: tabler:shield-check
