features3_what_we_build:
  title: Wat wij bouwen
  subtitle: 'Een gerichte productlijn die we door en door kennen: hogedruk-drop-stitch opblaasbare zwembaden.'
  columns: 3
  isBeforeContent: true
  items:
    - title: Rechthoekige zwembaden
      description: Rechthoekige drop-stitch-zwembaden voor het hele gezin die het zwemoppervlak voor uw ruimte maximaliseren.
      icon: tabler:rectangle
    - title: Ronde blauwe zwembaden
      description: 'Het klassieke zwembad in de achtertuin: levendig blauw, stevige drop-stitch-wanden, snelle installatie.'
      icon: tabler:circle
    - title: Ronde grijze zwembaden
      description: Onze premium lijn met een moderne grijze afwerking en optioneel gemonteerde hoes.
      icon: tabler:circle-dot
    - title: Hot tub SPA-zwembaden
      description: 'Geïsoleerde hottubmodellen met ingebouwde stoelen en 5 mm geïsoleerde bodems — voor gebruik met externe verwarmingen (verwarming niet inbegrepen).'
      icon: tabler:ripple
