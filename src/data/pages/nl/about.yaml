hero:
  tagline: Over ons
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory opblaasbaar zwembad
  title: |
    Zwemmen eenvoudig maken, <br />
    op de <span class="text-accent dark:text-white">Inflatable Pool Factory</span>-manier
  subtitle: Inflatable Pool Factory is een premium drop-stitch opblaasbaar zwembadmerk, ontworpen door Inflatable Pool Team · Qingdao Vatrad Group. Wij geloven dat elk gezin een echt zwembad in de achtertuin verdient – ​​zonder constructie, vergunningen of permanente installatie. Onze zwembaden worden binnen enkele minuten stevig opgeblazen, overleven hele zomers vol familieplezier en kunnen aan het einde van het seizoen klein worden opgeborgen.
