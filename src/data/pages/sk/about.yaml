hero:
  tagline: O nás
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Nafukovací bazén Inflatable Pool Factory
  title: |
    Zjednodušenie plávania, <br />
    stylem <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory je prémiová značka nafukovacích bazénov Drop Stitch navrhnutá spoločnosťou Inflatable Pool Team · Qingdao Vatrad Group. Veríme, že každá rodina si zaslúži skutočný bazén na dvore – bez výstavby, povolení alebo trvalej inštalácie. Naše bazény sa nafúknu za pár minút, prežijú celé letá rodinnej zábavy a na konci sezóny sa zbalia ako malé.
