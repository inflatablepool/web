hero:
  tagline: O nás
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Nafukovací bazén Inflatable Pool Factory
  title: |
    Zjednodušenie plávania, <br />
    stylem <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory je prémiová značka nafukovacích bazénov Drop Stitch navrhnutá spoločnosťou Inflatable Pool Team · Qingdao Vatrad Group. Veríme, že každá rodina si zaslúži skutočný bazén na dvore – bez výstavby, povolení alebo trvalej inštalácie. Naše bazény sa nafúknu za pár minút, prežijú celé letá rodinnej zábavy a na konci sezóny sa zbalia ako malé.
stats:
  title: Podľa čísel
  columns: 4
  stats:
    - title: Bazénové zbierky
      amount: '4'
    - title: 'Čas nafúknutia'
      amount: '5-15 min'
    - title: Menovitý tlak
      amount: 4-5 PSI
    - title: Kontaktovať
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: Čo staviame
  subtitle: Sústredený produktový rad, ktorý poznáme naruby – vysokotlakové nafukovacie bazény Drop Stitch.
  columns: 3
  isBeforeContent: true
  items:
    - title: Obdĺžnikové bazény
      description: Obdĺžnikové bazény typu Drop Stitch v rodinnej veľkosti, ktoré maximalizujú plochu na plávanie pre váš priestor.
      icon: tabler:rectangle
    - title: Okrúhle modré bazény
      description: Klasický záhradný bazén – žiarivá modrá, pevné steny Drop Stitch, rýchle nastavenie.
      icon: tabler:circle
    - title: Okrúhle sivé bazény
      description: Naša prémiová rada s moderným sivým povrchom a voliteľným krytom.
      icon: tabler:circle-dot
    - title: Bazény s vírivkou SPA
      description: 'Modely s izolovanými vírivkami so vstavanými sedadlami a 5 mm izolovaným dnom — na použitie s externými ohrievačmi (ohrievač nie je súčasťou dodávky).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Kompletné balíčky
      description: Každý bazén sa dodáva s elektrickým vzduchovým čerpadlom, súpravou na opravu a úložným vakom.
      icon: tabler:package
    - title: Vlastné veľkosti
      description: OEM veľkosti, farby a kryty pre značky, distribútorov a pohostinské projekty.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Výroba súkromných značiek s potlačou loga a maloobchodným balením.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Obdĺžnikový nafukovací bazén Inflatable Pool Factory Drop Stitch
steps2_values:
  title: Naše hodnoty
  subtitle: Tri princípy, ktoré formujú každý bazén, ktorý postavíme.
  items:
    - title: Stavajte tak, ako to bude používať vaša rodina
      description: S každým švom, stenou a ventilom sa zaobchádza tak, ako keby v ňom plávali naše vlastné rodiny.
      icon: tabler:heart
    - title: Inžinier pred predajom
      description: Vysokotlaková konštrukcia Drop Stitch, testovaná nad menovitým tlakom, pred odoslaním akéhokoľvek bazéna.
      icon: tabler:settings
    - title: Podpora, ktorá prekoná sezónu
      description: Otázky, náhradné diely alebo záruka — kontaktujte nás na info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: Míľniky
  subtitle: Krátka verzia príbehu Inflatable Pool Factory.
  isReversed: true
  items:
    - title: Zamerané na nafukovacie bazény
      description: 'Inflatable Pool Factory bola založená s jediným zameraním: prémiové nafukovacie bazény Drop Stitch.'
      icon: tabler:pool
    - title: Tri zbierky podpisov
      description: Obdĺžnikové, okrúhle modré a okrúhle sivé rady bazénov, každá s voliteľnými krytmi a vlastnými veľkosťami.
      icon: tabler:circle-check
    - title: OEM/ODM pre partnerov po celom svete
      description: Zákazková výroba pre značky, distribútorov, hotely a prevádzkovateľov glampingu.
      icon: tabler:world
