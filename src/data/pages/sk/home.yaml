content_compliance:
  tagline: Starostlivosť a bezpečnosť
  title: Jednoduché vlastnenie,<br />Ľahké milovať
  subtitle: Od doručenia cez prvé kúpanie až po uskladnenie na konci sezóny je vlastnenie bazéna Inflatable Pool Factory jednoduché.
  items:
    - title: Nastavenie v minútach
      description: 'Rozbaľte a nafúknite priloženou pumpou za 5-15 minút, potom naplňte záhradnou hadicou – čas plnenia sa líši v závislosti od veľkosti bazéna a množstva vody.'
      icon: tabler:rocket
    - title: Jednoduchá starostlivosť o vodu
      description: Štandardné 32/38 mm otvory pre filtračné čerpadlo, pravidelné kontroly pH a namontovaný kryt na okrúhlych modeloch udržujú vodu čistú.
      icon: tabler:droplet
    - title: Vyčistite, vypustite a uskladnite
      description: Vypustite, vysušte, zrolujte a zabaľte bazén do úložného vrecka na zimu. Nevyžaduje trvalú inštaláciu.
      icon: tabler:package
    - title: Bezpečnosť na prvom mieste
      description: Deti musia byť neustále pod aktívnym dohľadom dospelej osoby. Postupujte podľa návodu, miestnych pravidiel a pokynov na bezpečné používanie.
      icon: tabler:shield-check
steps:
  title: Z krabice do dvora
  items:
    - title: 'Krok 1: <span class="font-medium">Vyberte si svoj bazén</span>'
      description: Porovnajte tvary a veľkosti, aby zodpovedali vášmu priestoru, domácnosti a tomu, ako plánujete využívať vodu.
      icon: tabler:pool
    - title: 'Krok 2: <span class="font-medium">Nastaviť</span>'
      description: Položte na pevnú, rovnú zem, nafúknite priloženou elektrickou pumpou a naplňte záhradnou hadicou.
      icon: tabler:rocket
    - title: 'Krok 3: <span class="font-medium">Plávať celé leto</span>'
      description: Udržujte vodu čerstvú pomocou jednoduchej starostlivosti – zbierajte, prikryte a kontrolujte pH ako v každom malom bazéne.
      icon: tabler:ripple
    - title: 'Krok 4: <span class="font-medium">Uložte to preč</span>'
      description: Po skončení sezóny bazén vypustite, vysušte, zrolujte a uložte do vrecka až do budúceho leta.
      icon: tabler:package
  image:
