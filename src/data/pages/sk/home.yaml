features:
  id: features
  tagline: Technológia Drop Stitch
  title: Prečo bazén Inflatable Pool Factory<br />Je iný
  subtitle: Vďaka vysokotlakovej konštrukcii Drop Stitch sú naše bazény pevné, odolné a nenáročné na skladovanie.
  columns: 2
  items:
    - title: Pevné Drop Stitch steny
      description: 'Tisíce vnútorných závitov spájajú vrstvy stien dohromady, takže bazén sa nafúkne pevne pri menovitých 4-5 PSI a po naplnení si zachováva svoj tvar.'
      icon: tabler:hexagon
    - title: Rýchle nastavenie bez použitia nástrojov
      description: Nafúknite pomocou priloženej elektrickej pumpy za pár minút a potom naplňte záhradnou hadicou. Bez náradia, bez konštrukcie, bez odbornej inštalácie.
      icon: tabler:rocket
    - title: Malé balenia
      description: 'Vypustite, vyfúknite, zrolujte a uložte bazén cez zimu do tašky – bazén plnej veľkosti, ktorý sa dá zbaliť ako malý na uskladnenie v interiéri.'
      icon: tabler:package
    - title: Odolný a UV-odolný
      description: 'Dvojvrstvová tkanina PVC drop stitch, navrhnutá tak, aby odolala prepichnutiu a vystaveniu UV počas celej sezóny rodinného používania.'
      icon: tabler:shield
    - title: Kompletný balík
      description: Každý bazén sa dodáva s elektrickým vzduchovým čerpadlom, súpravou na opravu a úložným vakom. Pre okrúhle modely sú k dispozícii namontované kryty.
      icon: tabler:box
    - title: Bezpečný dizajn
      description: 'Dizajn obytného bazéna s odkazom na EN 16582-1 a ASTM F2666 – bezpečnostné informácie špecifické pre daný model sú uvedené v dokumentácii k produktu. Vždy je potrebný neustály dozor dospelej osoby.'
      icon: tabler:shield-check
