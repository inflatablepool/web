hero_text:
  tagline: Kontaktovať
  title: KONTAKTUJTE SA
contact_form:
  id: form
  title: Pošlite nám správu
  subtitle: V prípade cenových ponúk, technických otázok alebo otázok o partnerstve nám napíšte.
  email_to: info@inflatablepoolfactory.com
  submit_button: Odoslať dopyt → Získať cenovú ponuku
  success_message: Ďakujem! Vaša správa pristála v našej doručenej pošte.
  error_message: Pri odosielaní vašej správy sa vyskytla chyba. Skúste to znova alebo nám napíšte priamo.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: prosím vyriešte nasledovné'
  fields:
    - name: firstName
      label: Krstné meno
      row: 1
    - name: lastName
      label: Priezvisko
      row: 1
    - name: companyName
      label: Názov spoločnosti
      row: 2
    - name: address
      label: Adresa
      row: 3
    - name: zip
      label: PSČ
      row: 4
    - name: country
      label: Krajina
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Odhadovaný objem objednávky
      row: 6
      type: select
      options:
        - value: ''
          label: Vyberte odhadovaný objem...
        - value: sample
          label: Len vzorky / prototypy
        - value: 100-500
          label: 100-500 jednotiek
        - value: 500-plus
          label: 500+ jednotiek (množstevná cena)
    - name: customization
      label: Je potrebné prispôsobenie?
      row: 7
      type: select
      options:
        - value: ''
          label: Vyberte typ prispôsobenia...
        - value: none
          label: Štandardný produkt (bez prispôsobenia)
        - value: logo
          label: Iba vlastné logo / branding
        - value: full
          label: OEM (veľkosť, farba, grafika, balenie)
        - value: consultation
          label: Nie ste si istí – potrebujete konzultáciu
    - name: productInterest
      label: Fond záujmov
      row: 8
      type: select
      options:
        - value: ''
          label: Vyberte typ bazéna...
        - value: all
          label: Všetky bazény / Kompletný katalóg
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Predmet
      row: 9
    - name: message
      label: Správa
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Iné spôsoby, ako sa k nám dostať
  columns: 3
  items:
    - title: Predajné dopyty
      description: Spoločné ponuky, veľkoobchodné ceny a hromadné objednávky.
      icon: tabler:shopping-bag
    - title: Technická podpora
      description: Pomoc s nastavením, opravy, náhradné diely a otázky týkajúce sa starostlivosti.
      icon: tabler:tool
    - title: OEM / ODM
      description: Vlastné veľkosti, farby, kryty, značky a balenie.
      icon: tabler:palette
    - title: Email
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Webová stránka
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Kontaktujte nás
  subtitle: Kontaktujte Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

