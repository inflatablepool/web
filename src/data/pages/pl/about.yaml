hero:
  tagline: O nas
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Nadmuchiwany basen Inflatable Pool Factory
  title: |
    Ułatwienie pływania, <br />
    w stylu <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory to marka premium nadmuchiwanych basenów Drop Stitch, zaprojektowana przez Inflatable Pool Team · Qingdao Vatrad Group. Wierzymy, że każda rodzina zasługuje na prawdziwy basen na podwórku – bez budowy, pozwoleń i stałej instalacji. Nasze baseny napompowują się do sztywności w ciągu kilku minut, przetrwają pełne rodzinnej zabawy lato i pakują się do niewielkich rozmiarów pod koniec sezonu.
stats:
  title: Według liczb
  columns: 4
  stats:
    - title: Kolekcje basenowe
      amount: '4'
    - title: 'Czas pompowania'
      amount: '5-15 min'
    - title: Ciśnienie znamionowe
      amount: 4-5 PSI
    - title: Kontakt
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: Co budujemy
  subtitle: Skoncentrowana linia produktów, którą znamy na wylot — wysokociśnieniowe nadmuchiwane baseny Drop Stitch.
  columns: 3
  isBeforeContent: true
  items:
    - title: Baseny prostokątne
      description: Prostokątne baseny typu Drop Stitch dla całej rodziny, które maksymalizują powierzchnię do pływania w Twojej przestrzeni.
      icon: tabler:rectangle
    - title: Okrągłe niebieskie baseny
      description: Klasyczny basen przydomowy — żywy niebieski, sztywne ściany Drop Stitch, szybki montaż.
      icon: tabler:circle
    - title: Okrągłe szare baseny
      description: Nasza linia premium z nowoczesnym szarym wykończeniem i opcjonalną dopasowaną osłoną.
      icon: tabler:circle-dot
    - title: Baseny SPA z hydromasażem
      description: 'Izolowane modele wanien z hydromasażem z wbudowanymi siedziskami i izolowanym dnem o grubości 5 mm — do użytku z zewnętrznymi grzejnikami (grzejnik nie wchodzi w skład zestawu).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Kompletne pakiety
      description: Każdy basen jest dostarczany z elektryczną pompą powietrza, zestawem naprawczym i torbą do przechowywania.
      icon: tabler:package
    - title: Rozmiary niestandardowe
      description: Rozmiary, kolory i okładki OEM dla marek, dystrybutorów i projektów hotelarskich.
      icon: tabler:adjustments
    - title: OEM/ODM
      description: Produkcja pod marką własną z nadrukiem logo i opakowaniami gotowymi do sprzedaży detalicznej.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Prostokątny nadmuchiwany basen Inflatable Pool Factory Drop Stitch
steps2_values:
  title: Nasze wartości
  subtitle: Trzy zasady, które kształtują każdy basen, który budujemy.
  items:
    - title: Buduj tak, aby korzystała z niego Twoja rodzina
      description: Każdy szew, ściana i zawór są traktowane tak, jakby pływały w nich nasze rodziny.
      icon: tabler:heart
    - title: Inżynier przed sprzedażą
      description: Wysokociśnieniowa konstrukcja Drop Stitch, testowana powyżej ciśnienia znamionowego przed każdym statkiem basenowym.
      icon: tabler:settings
    - title: Wsparcie, które przetrwa sezon
      description: Questions, spare parts, or warranty — contact us at info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: Kamienie milowe
  subtitle: Krótka wersja historii Inflatable Pool Factory.
  isReversed: true
  items:
    - title: Koncentruje się na nadmuchiwanych basenach
      description: 'Firma Inflatable Pool Factory została założona z jednym celem: najwyższej jakości nadmuchiwanymi basenami typu drop-stitch.'
      icon: tabler:pool
    - title: Trzy autorskie kolekcje
      description: Prostokątne, okrągłe niebieskie i okrągłe szare linie basenowe, każdy z opcjonalnymi pokrywami i niestandardowymi rozmiarami.
      icon: tabler:circle-check
    - title: OEM/ODM dla partnerów na całym świecie
      description: Produkcja na zamówienie dla marek, dystrybutorów, hoteli i operatorów glampingowych.
      icon: tabler:world
features2_locations:
  title: Skontaktuj się
  tagline: Kontakt
  columns: 3
  items:
    - title: E-mail
      description: info@inflatablepoolfactory.com
    - title: Strona internetowa
      description: inflatablepoolfactory.com — przeglądaj nasze baseny i poproś o wycenę.
    - title: OEM / sprzedaż hurtowa
      description: Niestandardowe rozmiary, kolory i branding dostępne dla partnerów biznesowych.
