faqs:
  title: Często zadawane pytania dotyczące nadmuchiwanego basenu
  subtitle: Często zadawane pytania dotyczące nadmuchiwanych basenów Inflatable Pool Factory.
  columns: 2
  items:
    - title: Jak długo trwa konfiguracja?
      description: 'Napompowanie za pomocą dołączonej elektrycznej pompki zajmuje 5–15 minut, w zależności od modelu. Czas napełniania różni się w zależności od pojemności basenu i zaopatrzenia w wodę.'
      icon: tabler:clock
      category: all
    - title: Jak sztywny jest basen Drop Stitch?
      description: Bardzo sztywny. Ściany Drop Stitch napompowują się mocno przy ciśnieniu 4-5 PSI — podobnie jak nadmuchiwana deska do wiosłowania — dzięki czemu basen zachowuje swój kształt po napełnieniu wodą.
      icon: tabler:hexagon
      category: all
    - title: Czy dzieci mogą korzystać z basenu?
      description: Tak, przez cały czas pod aktywnym nadzorem osoby dorosłej. Nigdy nie wolno pozostawiać dzieci bez opieki w basenie lub w jego pobliżu – należy przestrzegać instrukcji i lokalnych zasad bezpieczeństwa.
      icon: tabler:users
      category: all
    - title: Jak przechowywać basen zimą?
      description: Spuść wodę, wypuść wodę z basenu, pozostaw do całkowitego wyschnięcia, następnie zwiń go i przechowuj w dołączonej torbie do przechowywania, w miejscu chronionym przed mrozem.
      icon: tabler:package
      category: all
    - title: Co jest wliczone w cenę basenu?
      description: Każdy basen Inflatable Pool Factory zawiera elektryczną pompę powietrza, zestaw naprawczy i torbę do przechowywania. Modele okrągłe mają opcjonalną dopasowaną pokrywę.
      icon: tabler:box
      category: all
    - title: Jakie rozmiary są dostępne?
      description: 48 standardowych jednostek SKU w czterech kolekcjach – baseny okrągłe o średnicy do 10 m, baseny prostokątne do 6×5 m oraz wanny SPA z wbudowanymi siedziskami. Rozmiary niestandardowe są dostępne dla partnerów biznesowych.
      icon: tabler:ruler-2
      category: all
    - title: Na jakich powierzchniach może stać basen?
      description: 'Jakakolwiek płaska, pozioma powierzchnia wolna od ostrych przedmiotów – trawnik, patio lub taras. Na szorstkich powierzchniach zaleca się użycie podkładu. Napełniony basen jest ciężki: instaluj go tylko na powierzchni, która wytrzymuje cały ciężar i najpierw przeprowadź ocenę konstrukcyjną podwyższonych pokładów, balkonów i dachów.'
      icon: tabler:layout-grid
      category: all
    - title: Jak utrzymać czystość wody?
      description: Użyj pompy filtrującej, jeśli jest zainstalowana, usuń zanieczyszczenia, sprawdź pH i przykryj basen, gdy nie jest używany. To, jak długo wystarczy woda, zależy od wielkości basenu, sposobu użytkowania i filtracji — testuj regularnie, zamiast polegać na ustalonym harmonogramie.
      icon: tabler:droplet
      category: all
