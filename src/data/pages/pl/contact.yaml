hero_text:
  tagline: Kontakt
  title: SKONTAKTUJ SIĘ
contact_form:
  id: form
  title: Wyślij nam wiadomość
  subtitle: W przypadku wycen, pytań technicznych lub zapytań dotyczących partnerstwa, napisz do nas.
  email_to: info@inflatablepoolfactory.com
  submit_button: Wyślij zapytanie → Uzyskaj wycenę
  success_message: Dzięki! Twoja wiadomość wylądowała w naszej skrzynce odbiorczej.
  error_message: Coś poszło nie tak podczas wysyłania Twojej wiadomości. Spróbuj ponownie lub napisz do nas bezpośrednio.
  default_country_code: '+86'
  captcha:
    label: 'Ochrona przed spamem: proszę rozwiązać następujące problemy'
  fields:
    - name: firstName
      label: Imię
      row: 1
    - name: lastName
      label: Nazwisko
      row: 1
    - name: companyName
      label: Nazwa firmy
      row: 2
    - name: address
      label: Adres
      row: 3
    - name: zip
      label: Kod pocztowy
      row: 4
    - name: country
      label: Kraj
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Szacowana wielkość zamówienia
      row: 6
      type: select
      options:
        - value: ''
          label: Wybierz szacunkową objętość...
        - value: sample
          label: Tylko próbki/prototypy
        - value: 100-500
          label: 100–500 jednostek
        - value: 500-plus
          label: Ponad 500 jednostek (ceny zbiorcze)
    - name: customization
      label: Potrzebne dostosowanie?
      row: 7
      type: select
      options:
        - value: ''
          label: Wybierz typ dostosowania...
        - value: none
          label: Produkt standardowy (bez personalizacji)
        - value: logo
          label: Tylko niestandardowe logo/branding
        - value: full
          label: Pełny OEM (rozmiar, kolor, grafika, opakowanie)
        - value: consultation
          label: Nie jestem pewien – potrzebna konsultacja
    - name: productInterest
      label: Pula zainteresowań
      row: 8
      type: select
      options:
        - value: ''
          label: Wybierz typ basenu...
        - value: all
          label: Wszystkie baseny / Pełny katalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Temat
      row: 9
    - name: message
      label: Wiadomość
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Inne sposoby dotarcia do nas
  columns: 3
  items:
    - title: Zapytania sprzedażowe
      description: Wyceny puli, ceny hurtowe i zamówienia masowe.
      icon: tabler:shopping-bag
    - title: Wsparcie techniczne
      description: Pomoc w konfiguracji, naprawy, części zamienne i pytania dotyczące konserwacji.
      icon: tabler:tool
    - title: OEM/ODM
      description: Niestandardowe rozmiary, kolory, okładki, branding i opakowanie.
      icon: tabler:palette
    - title: E-mail
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Strona internetowa
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Skontaktuj się
  subtitle: Skontaktuj się z Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

