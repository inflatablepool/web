features:
  id: features
  tagline: טכנולוגיית Drop Stitch
  title: למה בריכת Inflatable Pool Factory<br />הוא שונה
  subtitle: בניית Drop Stitch בלחץ גבוה הופכת את הבריכות שלנו לקשיחות, עמידות וללא מאמץ לאחסון.
  columns: 2
  items:
    - title: קירות Drop Stitch קשיחים
      description: 'אלפי חוטים פנימיים נועלים את שכבות הקיר יחד, כך שהבריכה מתנפחת קשיחה בדירוג של 4-5 PSI ושומרת על צורתה בעת מילויה.'
      icon: tabler:hexagon
    - title: התקנה מהירה וללא כלים
      description: יש לנפח עם המשאבה החשמלית הכלולה תוך דקות, ולאחר מכן למלא בצינור גינה. ללא כלים, ללא בנייה, ללא התקנה מקצועית.
      icon: tabler:rocket
    - title: אריזות קטנות
      description: 'רוקנו, רוקנו את האוויר, גלגלו ואחסנו את הבריכה בתיק שלה במהלך החורף - בריכה בגודל מלא שמתארסת בקטנה לאחסון פנימי.'
      icon: tabler:package
    - title: עמיד ועמיד בפני UV
      description: 'בד PVC drop stitch שכבתית כפולה, תוכנן לעמוד בפני פנצ''רים וחשיפה ל-UV דרך עונה מלאה של שימוש משפחתי.'
      icon: tabler:shield
    - title: חבילה שלמה
      description: כל בריכה נשלחת עם משאבת אוויר חשמלית, ערכת תיקון ושקית אחסון. כיסויים מצוידים זמינים לדגמים עגולים.
      icon: tabler:box
    - title: עיצוב מודע לבטיחות
      description: 'תכנון בריכה למגורים בהתייחס ל-EN 16582-1 ו-ASTM F2666 - מידע בטיחות ספציפי לדגם מסופק בתיעוד המוצר. תמיד נדרשת השגחת מבוגר מתמדת.'
      icon: tabler:shield-check
