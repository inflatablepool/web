    - title: לחץ מדורג
      amount: 4-5 PSI
    - title: מַגָע
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: מה אנחנו בונים
  subtitle: קו מוצרים ממוקד שאנו מכירים מבפנים החוצה - בריכות שחייה מתנפחות Drop Stitch בלחץ גבוה.
  columns: 3
  isBeforeContent: true
  items:
    - title: בריכות מלבניות
      description: בריכות Drop Stitch מלבניות בגודל משפחתי הממקסמות את אזור השחייה לחלל שלך.
      icon: tabler:rectangle
    - title: בריכות כחולות עגולות
      description: הבריכה הקלאסית בחצר האחורית - כחול תוסס, קירות Drop Stitch קשיחים, התקנה מהירה.
      icon: tabler:circle
    - title: בריכות אפורות עגולות
      description: קו הפרימיום שלנו עם גימור אפור מודרני וכיסוי אופציונלי מצויד.
      icon: tabler:circle-dot
    - title: ג'קוזי בריכות ספא
      description: 'דגמי ג''קוזי מבודדים עם מושבים מובנים ותחתית מבודדת 5 mm - לשימוש עם תנורי חימום חיצוניים (מחמם לא כלול).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: חבילות שלמות
      description: כל בריכה נשלחת עם משאבת אוויר חשמלית, ערכת תיקון ושקית אחסון.
      icon: tabler:package
    - title: גדלים מותאמים אישית
      description: גדלים, צבעים וכיסויים OEM עבור מותגים, מפיצים ופרויקטי אירוח.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: ייצור במותג פרטי עם הדפסת לוגו ואריזה מוכנה לקמעונאית.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: בריכת שחיה מתנפחת מלבנית של חברת Inflatable Pool Factory Drop Stitch
steps2_values:
  title: הערכים שלנו
  subtitle: שלושה עקרונות שמעצבים כל בריכה שאנו בונים.
  items:
    - title: בנה כאילו המשפחה שלך תשתמש בו
      description: כל תפר, קיר ושסתום מטופלים כאילו המשפחות שלנו ישחו בו.
      icon: tabler:heart
    - title: מהנדס לפני שאנחנו מוכרים
      description: בניית Drop Stitch בלחץ גבוה, נבדקה מעל הלחץ המדורג שלה, לפני כל ספינת בריכה.
      icon: tabler:settings
    - title: תמיכה שנמשכת לאורך העונה
      description: Questions, spare parts, or warranty — contact us at info@inflatablepoolfactory.com.
      icon: tabler:headset
steps2_milestones:
  title: אבני דרך
  subtitle: גרסה קצרה לסיפור Inflatable Pool Factory.
  isReversed: true
  items:
    - title: התמקד בבריכות מתנפחות
      description: 'Inflatable Pool Factory נוסדה עם מיקוד אחד: בריכות שחייה מתנפחות פרימיום Drop Stitch.'
      icon: tabler:pool
    - title: שלושה אוספי חתימות
      description: קווי בריכה מלבניים, כחולים ועגולים אפורים, כל אחד עם כיסויים אופציונליים וגדלים מותאמים אישית.
      icon: tabler:circle-check
    - title: OEM/ODM לשותפים ברחבי העולם
      description: ייצור בהתאמה אישית למותגים, מפיצים, בתי מלון ומפעילי גלמפינג.
      icon: tabler:world
