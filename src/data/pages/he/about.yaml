hero:
  tagline: עלינו
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: בריכת שחיה מתנפחת Inflatable Pool Factory
  title: |
    הופכים את השחייה לפשוטה, <br />
    בסגנון <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory הוא מותג פרימיום לבריכה מתנפחת Drop Stitch שתוכנן על ידי Inflatable Pool Team · Qingdao Vatrad Group. אנו מאמינים שלכל משפחה מגיעה בריכה אמיתית בחצר האחורית - ללא בנייה, אישורים או התקנה קבועה. הבריכות שלנו מתנפחות תוך דקות, שורדות קיץ מלא של כיף משפחתי, ואורזות בקטנה בסוף העונה.
stats:
