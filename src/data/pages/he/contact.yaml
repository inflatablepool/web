hero_text:
  tagline: מַגָע
  title: לְהִתְקַשֵׁר
contact_form:
  id: form
  title: שלחו לנו הודעה
  subtitle: להצעות מחיר, שאלות טכניות או פניות לשותפות, פנו אלינו.
  email_to: info@inflatablepoolfactory.com
  submit_button: שלח פניה ← קבל הצעת מחיר
  success_message: תוֹדָה! ההודעה שלך נחתה בתיבת הדואר הנכנס שלנו.
  error_message: משהו השתבש בשליחת ההודעה שלך. אנא נסה שוב או שלח לנו דוא"ל ישירות.
  default_country_code: '+86'
  captcha:
    label: 'אנטי ספאם: אנא פתור את הדברים הבאים'
  fields:
    - name: firstName
      label: שֵׁם פְּרַטִי
      row: 1
    - name: lastName
      label: שֵׁם מִשׁפָּחָה
      row: 1
    - name: companyName
      label: שם החברה
      row: 2
    - name: address
      label: כְּתוֹבֶת
      row: 3
    - name: zip
      label: מיקוד / מיקוד
      row: 4
    - name: country
      label: מְדִינָה
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: אֶלֶקטרוֹנִי
      row: 5
      type: email
    - name: tel
      label: טל
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: נפח הזמנות משוער
      row: 6
      type: select
      options:
        - value: ''
          label: בחר את הנפח המשוער שלך...
        - value: sample
          label: דוגמאות / אבות טיפוס בלבד
        - value: 100-500
          label: 100-500 יחידות
        - value: 500-plus
          label: 500+ יחידות (תמחור נפח)
    - name: customization
      label: דרושה התאמה אישית?
      row: 7
      type: select
      options:
        - value: ''
          label: בחר סוג התאמה אישית...
        - value: none
          label: מוצר סטנדרטי (ללא התאמה אישית)
        - value: logo
          label: לוגו מותאם אישית / מיתוג בלבד
        - value: full
          label: OEM (גודל, צבע, גרפיקה, אריזה)
        - value: consultation
          label: לא בטוח - צריך התייעצות
    - name: productInterest
      label: מאגר עניין
      row: 8
      type: select
      options:
        - value: ''
          label: בחר סוג בריכה...
        - value: all
          label: כל הבריכות / קטלוג מלא
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: נוֹשֵׂא
      row: 9
    - name: message
      label: הוֹדָעָה
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: דרכים אחרות להגיע אלינו
  columns: 3
  items:
    - title: פניות מכירות
      description: הצעות מחיר לבריכה, תמחור סיטונאי והזמנות בכמויות גדולות.
      icon: tabler:shopping-bag
    - title: תמיכה טכנית
      description: עזרה בהתקנה, תיקונים, חלקי חילוף ושאלות טיפול.
      icon: tabler:tool
    - title: OEM / ODM
      description: גדלים, צבעים, כיסויים, מיתוג ואריזה מותאמים אישית.
      icon: tabler:palette
    - title: אֶלֶקטרוֹנִי
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: אֲתַר אִינטֶרנֶט
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: לְהִתְקַשֵׁר
  subtitle: צור קשר עם Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

