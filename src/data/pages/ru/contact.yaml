hero_text:
  tagline: Контакт
  title: СВЯЗАТЬСЯ
contact_form:
  id: form
  title: Отправьте нам сообщение
  subtitle: Для получения предложений, технических вопросов или запросов о партнерстве напишите нам.
  email_to: info@inflatablepoolfactory.com
  submit_button: Отправить запрос → Получить предложение
  success_message: Спасибо! Ваше сообщение попало в наш почтовый ящик.
  error_message: Что-то пошло не так при отправке вашего сообщения. Пожалуйста, попробуйте еще раз или напишите нам напрямую.
  default_country_code: '+86'
  captcha:
    label: 'Антиспам: пожалуйста, решите следующее'
  fields:
    - name: firstName
      label: Имя
      row: 1
    - name: lastName
      label: Фамилия
      row: 1
    - name: companyName
      label: Название компании
      row: 2
    - name: address
      label: Адрес
      row: 3
    - name: zip
      label: Почтовый индекс
      row: 4
    - name: country
      label: Страна
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: Электронная почта
      row: 5
      type: email
    - name: tel
      label: ТЕЛ.
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Предполагаемый объем заказа
      row: 6
      type: select
      options:
        - value: ''
          label: Выберите предполагаемый объем...
        - value: sample
          label: Только образцы/прототипы
        - value: 100-500
          label: 100–500 единиц
        - value: 500-plus
          label: 500+ единиц (оптовые цены)
    - name: customization
      label: Нужна кастомизация?
      row: 7
      type: select
      options:
        - value: ''
          label: Выберите тип настройки...
        - value: none
          label: Стандартный продукт (без настройки)
        - value: logo
          label: Только индивидуальный логотип/брендинг
        - value: full
          label: OEM (размер, цвет, графика, упаковка)
        - value: consultation
          label: Не уверен — нужна консультация
    - name: productInterest
      label: Пул интересов
      row: 8
      type: select
      options:
        - value: ''
          label: Выберите тип бассейна...
        - value: all
          label: Все бассейны / Полный каталог
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Предмет
      row: 9
    - name: message
      label: Сообщение
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Другие способы связаться с нами
  columns: 3
  items:
    - title: Запросы на продажу
      description: Котировки пула, оптовые цены и оптовые заказы.
      icon: tabler:shopping-bag
    - title: Техническая поддержка
      description: Помощь в настройке, ремонте, запасных частях и вопросах по уходу.
      icon: tabler:tool
    - title: ОЭМ/ОДМ
      description: Нестандартные размеры, цвета, обложки, брендинг и упаковка.
      icon: tabler:palette
    - title: Электронная почта
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Веб-сайт
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Свяжитесь с нами
  subtitle: Связаться с Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

