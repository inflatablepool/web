hero:
  tagline: О нас
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Надувной бассейн Inflatable Pool Factory
  title: |
    Делаем плавание простым, <br />
    в стиле <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory — премиальный бренд надувных бассейнов Drop Stitch, разработанный Inflatable Pool Team · Qingdao Vatrad Group. Мы считаем, что каждая семья заслуживает настоящего бассейна на заднем дворе — без строительства, разрешений или постоянной установки. Наши бассейны надуваются за считанные минуты, выдерживают все летние семейные развлечения и складываются понемногу в конце сезона.
