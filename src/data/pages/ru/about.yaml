      description: К каждому шву, стенке и клапану относятся так, как будто в нем будут купаться наши собственные семьи.
      icon: tabler:heart
    - title: Инженер, прежде чем мы продадим
      description: Конструкция Drop Stitch высокого давления, проверенная давлением выше номинального, перед отправкой в ​​бассейн.
      icon: tabler:settings
    - title: Поддержка, которая переживет сезон
      description: Questions, spare parts, or warranty — reach us any time at info@inflatablepoolfactory.com.
      icon: tabler:headset
