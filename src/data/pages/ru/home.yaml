features:
  id: features
  tagline: Технология Drop Stitch
  title: Почему бассейн Inflatable Pool Factory<br />отличается
  subtitle: Конструкция Drop Stitch под высоким давлением делает наши бассейны жесткими, долговечными и удобными для хранения.
  columns: 2
  items:
    - title: Жесткие стены Drop Stitch
      description: 'Тысячи внутренних нитей скрепляют слои стенок вместе, поэтому бассейн надувается жестко при номинальной скорости 4–5 PSI и сохраняет свою форму при наполнении.'
      icon: tabler:hexagon
    - title: Быстрая установка без инструментов
      description: Накачайте его с помощью прилагаемого электрического насоса за считанные минуты, а затем заполните водой из садового шланга. Никаких инструментов, никаких строительных работ, никакой профессиональной установки.
      icon: tabler:rocket
    - title: Упаковывает маленькие
      description: 'Слейте воду, спустите воздух, сверните и храните бассейн зимой в сумке — полноразмерный бассейн, который можно компактно сложить для хранения в помещении.'
      icon: tabler:package
    - title: Прочный и устойчивый к ультрафиолетовому излучению
      description: 'Двухслойная ткань PVC drop stitch, разработанная для защиты от проколов и воздействия UV в течение всего сезона семейного использования.'
      icon: tabler:shield
    - title: Полный пакет
      description: Каждый бассейн поставляется с электрическим воздушным насосом, ремонтным комплектом и сумкой для хранения. Для круглых моделей доступны встроенные крышки.
      icon: tabler:box
    - title: Дизайн, ориентированный на безопасность
      description: 'Конструкция бассейна для жилых помещений соответствует стандартам EN 16582-1 и ASTM F2666 — информация о безопасности для конкретной модели представлена ​​в документации к продукту. Всегда необходим постоянный присмотр взрослых.'
      icon: tabler:shield-check
