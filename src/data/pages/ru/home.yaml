faqs:
  title: Часто задаваемые вопросы по надувному бассейну
  subtitle: Частые вопросы о надувных бассейнах Inflatable Pool Factory.
  columns: 2
  items:
    - title: Сколько времени занимает установка?
      description: 'Накачивание занимает 5–15 минут с помощью прилагаемого электрического воздушного насоса в зависимости от модели. Время наполнения зависит от вместимости бассейна и вашего водоснабжения.'
      icon: tabler:clock
      category: all
    - title: Насколько жесткий бассейн Drop Stitch?
      description: Очень жесткий. Стенки Drop Stitch надуваются при давлении 4–5 фунтов на квадратный дюйм — подобно надувной доске для серфинга — поэтому бассейн сохраняет свою форму при наполнении водой.
      icon: tabler:hexagon
      category: all
    - title: Могут ли дети пользоваться бассейном?
      description: Да, под постоянным присмотром взрослых. Детей никогда нельзя оставлять без присмотра в бассейне или рядом с ним — соблюдайте инструкции и местные правила безопасности.
      icon: tabler:users
      category: all
    - title: Как хранить бассейн зимой?
      description: Слейте воду, спустите воду из бассейна, дайте ему полностью высохнуть, затем сверните его и храните в прилагаемом пакете для хранения в защищенном от мороза месте.
      icon: tabler:package
      category: all
    - title: Что входит в стоимость бассейна?
      description: Каждый бассейн Inflatable Pool Factory включает в себя электрический воздушный насос, ремонтный комплект и сумку для хранения. Круглые модели имеют дополнительную встроенную крышку.
      icon: tabler:box
      category: all
    - title: Какие размеры доступны?
      description: 48 стандартных артикулов в четырех коллекциях — круглые бассейны диаметром до 10 м, прямоугольные бассейны размером до 6 × 5 м и SPA-ванны со встроенными сиденьями. Для деловых партнеров доступны нестандартные размеры.
      icon: tabler:ruler-2
      category: all
    - title: На каких поверхностях может стоять бассейн?
      description: 'Любая плоская, ровная поверхность без острых предметов — газон, патио или терраса. На шероховатых поверхностях рекомендуется использовать грунтованный лист. Наполненный бассейн тяжелый: устанавливайте только на поверхность, которая выдержит полный вес, и сначала оцените структурную конструкцию приподнятых настилов, балконов и крыш.'
      icon: tabler:layout-grid
      category: all
    - title: Как сохранить воду чистой?
      description: Используйте фильтрующий насос там, где он установлен, удаляйте мусор, проверяйте pH и накрывайте бассейн, когда он не используется. Срок службы воды зависит от размера бассейна, использования и фильтрации — проверяйте регулярно, а не полагайтесь на фиксированный график.
      icon: tabler:droplet
      category: all
