hero:
  tagline: Om oss
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory uppblåsbar pool
  title: |
    Gör simningen enkel, <br />
    på <span class="text-accent dark:text-white">Inflatable Pool Factory</span>-vis
  subtitle: Inflatable Pool Factory är ett premium Drop Stitch uppblåsbar poolmärke designat av Inflatable Pool Team · Qingdao Vatrad Group. Vi tror att varje familj förtjänar en riktig pool på bakgården - utan konstruktion, tillstånd eller en permanent installation. Våra pooler blåser upp styvt på några minuter, överlever hela somrar av familjekul och packar ihop lite vid säsongens slut.
