hero_text:
  tagline: Kontakta
  title: TA KONTAKT
contact_form:
  id: form
  title: Skicka ett meddelande till oss
  subtitle: För offerter, tekniska frågor eller partnerskapsförfrågningar, kontakta oss.
  email_to: info@inflatablepoolfactory.com
  submit_button: Skicka förfrågan → Få en offert
  success_message: Tack! Ditt meddelande har hamnat i vår inkorg.
  error_message: Något gick fel när ditt meddelande skickades. Försök igen eller maila oss direkt.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: lösa följande'
  fields:
    - name: firstName
      label: Förnamn
      row: 1
    - name: lastName
      label: Efternamn
      row: 1
    - name: companyName
      label: Företagsnamn
      row: 2
    - name: address
      label: Adress
      row: 3
    - name: zip
      label: Postnummer
      row: 4
    - name: country
      label: Land
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-post
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Beräknad ordervolym
      row: 6
      type: select
      options:
        - value: ''
          label: Välj din beräknade volym...
        - value: sample
          label: Endast prover/prototyper
        - value: 100-500
          label: 100–500 enheter
        - value: 500-plus
          label: 500+ enheter (volymprissättning)
    - name: customization
      label: Behövs anpassning?
      row: 7
      type: select
      options:
        - value: ''
          label: Välj anpassningstyp...
        - value: none
          label: Standardprodukt (ingen anpassning)
        - value: logo
          label: Endast anpassad logotyp/varumärke
        - value: full
          label: OEM (storlek, färg, grafik, förpackning)
        - value: consultation
          label: Inte säker - behöver konsultation
    - name: productInterest
      label: Intressepool
      row: 8
      type: select
      options:
        - value: ''
          label: Välj pooltyp...
        - value: all
          label: Alla pooler / Fullständig katalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Ämne
      row: 9
    - name: message
      label: Meddelande
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Andra sätt att nå oss
  columns: 3
  items:
    - title: Försäljningsförfrågningar
      description: Poolofferter, grossistpriser och massbeställningar.
      icon: tabler:shopping-bag
    - title: Teknisk support
      description: Installationshjälp, reparationer, reservdelar och skötselfrågor.
      icon: tabler:tool
    - title: OEM / ODM
      description: Anpassade storlekar, färger, omslag, varumärke och förpackning.
      icon: tabler:palette
    - title: E-post
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Webbplats
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Hör av dig
  subtitle: Kontakta Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

