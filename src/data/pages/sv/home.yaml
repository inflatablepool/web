features:
  id: features
  tagline: Drop Stitch-teknik
  title: Varför en Inflatable Pool Factory Pool<br />är annorlunda
  subtitle: Högtrycks-Drop Stitch-konstruktion gör våra pooler styva, hållbara och lätta att lagra.
  columns: 2
  items:
    - title: Styva Drop Stitch-väggar
      description: 'Tusentals invändiga gängor låser ihop vägglagren, så att poolen blåser upp styvt vid nominella 4-5 PSI och behåller sin form när den fylls.'
      icon: tabler:hexagon
    - title: Snabb, verktygsfri installation
      description: Blås upp med den medföljande elektriska pumpen på några minuter och fyll sedan med en trädgårdsslang. Inga verktyg, ingen konstruktion, ingen professionell installation.
      icon: tabler:rocket
    - title: Packar bort små
      description: 'Töm, töm ut luften, rulla ihop och förvara poolen i sin påse över vintern - en fullstor pool som packar ihop lite för inomhusförvaring.'
      icon: tabler:package
    - title: Hållbar och UV-beständig
      description: 'Dubbellager PVC drop stitch-tyg, konstruerat för att motstå punkteringar och UV-exponering genom en hel säsong av familjeanvändning.'
      icon: tabler:shield
    - title: Komplett paket
      description: Varje pool levereras med en elektrisk luftpump, reparationssats och förvaringsväska. Passade överdrag tillgängliga för runda modeller.
      icon: tabler:box
    - title: Säkerhetsmedveten design
      description: 'Bostadspooldesign med hänvisning till EN 16582-1 och ASTM F2666 — modellspecifik säkerhetsinformation finns i produktdokumentationen. Ständig vuxenövervakning krävs alltid.'
      icon: tabler:shield-check
