content_compliance:
  tagline: Vård & Säkerhet
  title: Lätt att äga,<br />Lätt att älska
  subtitle: Från leverans till första simtur till förvaring vid slutet av säsongen är det enkelt att äga en Inflatable Pool Factory-pool.
  items:
    - title: Installation på några minuter
      description: 'Packa upp och blåsa upp med den medföljande pumpen på 5-15 minuter, fyll sedan med en trädgårdsslang – påfyllningstiden varierar med poolstorlek och vattentillförsel.'
      icon: tabler:rocket
    - title: Enkel vattenvård
      description: Standard 32/38 mm filterpumpportar, regelbundna pH-kontroller och ett monterat lock på runda modeller håller vattnet rent.
      icon: tabler:droplet
    - title: Rengör, dränera & förvara
      description: Töm, torka, rulla ihop och packa poolen i förvaringsväskan för vintern. Ingen permanent installation att underhålla.
      icon: tabler:package
    - title: Säkerheten först
      description: Barn måste alltid övervakas aktivt av en vuxen. Följ manualen, lokala regler och vägledning för säker användning.
      icon: tabler:shield-check
steps:
  title: Från box till bakgård
  items:
    - title: 'Steg 1: <span class="font-medium">Välj din pool</span>'
      description: Jämför former och storlekar för att matcha ditt utrymme, hushåll och hur du planerar att använda vattnet.
      icon: tabler:pool
    - title: 'Steg 2: <span class="font-medium">Ställ in den</span>'
      description: Placera på fast, jämn mark, blås upp med den medföljande elektriska pumpen och fyll på med en trädgårdsslang.
      icon: tabler:rocket
    - title: 'Steg 3: <span class="font-medium">Simma hela sommaren</span>'
      description: Håll vattnet fräscht med enkel omsorg - skumma, täck och kontrollera pH som vilken liten pool som helst.
      icon: tabler:ripple
    - title: 'Steg 4: <span class="font-medium">Förvara det undan</span>'
      description: När säsongen är slut, dränera, torka, rulla ihop och förvara poolen i sin påse till nästa sommar.
      icon: tabler:package
