faqs:
  title: Vanliga frågor om uppblåsbar pool
  subtitle: Vanliga frågor om Inflatable Pool Factory uppblåsbara simbassänger.
  columns: 2
  items:
    - title: Hur lång tid tar installationen?
      description: 'Uppblåsningen tar 5-15 minuter med den medföljande elektriska luftpumpen beroende på modell. Påfyllningstiden varierar med poolens kapacitet och din vattenförsörjning.'
      icon: tabler:clock
      category: all
    - title: Hur stel är en Drop Stitch-pool?
      description: Mycket stel. Drop Stitch-väggarna blåser upp hårt vid 4-5 PSI - liknande en uppblåsbar paddelbräda - så poolen behåller sin form när den fylls med vatten.
      icon: tabler:hexagon
      category: all
    - title: Kan barn använda poolen?
      description: Ja, med aktiv vuxenövervakning hela tiden. Barn får aldrig lämnas utan tillsyn i eller nära poolen – följ manualen och lokala säkerhetsregler.
      icon: tabler:users
      category: all
    - title: Hur förvarar jag poolen på vintern?
      description: Töm vattnet, töm poolen, låt den torka helt, rulla sedan ihop den och förvara den i den medföljande förvaringspåsen på ett frostfritt ställe.
      icon: tabler:package
      category: all
    - title: Vad ingår i poolen?
      description: Varje Inflatable Pool Factory-pool inkluderar en elektrisk luftpump, en reparationssats och en förvaringsväska. Runda modeller har en valfri monterad kåpa.
      icon: tabler:box
      category: all
    - title: Vilka storlekar finns tillgängliga?
      description: 48 standard-SKU:er i fyra samlingar — runda pooler upp till 10 m i diameter, rektangulära pooler upp till 6 × 5 m och SPA-badkar med inbyggda säten. Anpassade storlekar är tillgängliga för affärspartners.
      icon: tabler:ruler-2
      category: all
    - title: Vilka ytor kan poolen stå på?
      description: 'Alla plana, jämna ytor fria från vassa föremål - gräsmatta, uteplats eller däck. En markduk rekommenderas på grova ytor. En fylld pool är tung: installera endast på en yta som bär hela vikten och ha förhöjda däck, balkonger och hustak strukturellt bedömda först.'
      icon: tabler:layout-grid
      category: all
    - title: Hur håller jag vattnet rent?
      description: Använd en filterpump där den finns, skumma bort skräp, kontrollera pH och täck över poolen när den inte används. Hur länge vattnet räcker beror på poolens storlek, användning och filtrering - testa regelbundet istället för att förlita sig på ett fast schema.
      icon: tabler:droplet
      category: all
