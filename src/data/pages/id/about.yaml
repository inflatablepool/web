hero:
  tagline: Tentang kami
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Kolam renang tiup Inflatable Pool Factory
  title: |
    Membuat berenang menjadi sederhana, <br />
    gaya <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory adalah merek kolam tiup drop stitch premium yang dirancang oleh Inflatable Pool Team · Qingdao Vatrad Group. Kami percaya setiap keluarga berhak mendapatkan kolam nyata di halaman belakang — tanpa konstruksi, izin, atau instalasi permanen. Kolam renang kami mengembang dalam hitungan menit, bertahan sepanjang musim panas yang penuh kegembiraan keluarga, dan dikemas dalam jumlah kecil di akhir musim.
