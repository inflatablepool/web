production_section:
  tagline: Keunggulan Produksi
  title: Memastikan Keahlian Yang Indah
  description: Lini produksi Inflatable Pool Factory didedikasikan untuk kolam renang tiup berkualitas tinggi, tahan lama, dan bertekanan tinggi.
  cards:
    - title: Tim Teknisi Berpengalaman
      items:
        - Professional knowledge of drop stitch and PVC materials
        - Precise craftsmanship in cutting, welding, and assembly
        - Continuous training to master the latest production technologies
    - title: Peralatan Produksi Lanjutan
      items:
        - Precision cutting equipment for accurate fabric panels
        - High-precision heat welding for airtight, durable seams
        - Professional pressure and airtightness testing equipment
    - title: Sistem Manajemen yang Matang
      items:
        - Standardized production processes with clear quality standards
        - Lean production philosophy reducing waste and improving efficiency
        - Efficient supply chain management with reliable suppliers
    - title: Kontrol Kualitas yang Ketat
      items:
        - 'Multi-stage inspection: raw material, in-process, final outgoing'
        - Pressure testing above the rated 4-5 PSI working range
        - Strict airtightness and durability testing before shipping
