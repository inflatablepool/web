hero_text:
  tagline: Kontak
  title: HUBUNGI
contact_form:
  id: form
  title: Kirimkan pesan kepada kami
  subtitle: Untuk penawaran harga, pertanyaan teknis, atau pertanyaan kemitraan, hubungi kami. Kami membalas dalam satu hari kerja.
  email_to: info@inflatablepoolfactory.com
  submit_button: Kirim Pertanyaan → Dapatkan Penawaran
  success_message: Terima kasih! Pesan Anda telah masuk ke kotak masuk kami. Kami akan membalas dalam satu hari kerja.
  error_message: Terjadi masalah saat mengirim pesan Anda. Silakan coba lagi atau kirim email langsung kepada kami.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: harap selesaikan hal berikut'
  fields:
    - name: firstName
      label: Nama depan
      row: 1
    - name: lastName
      label: Nama Belakang
      row: 1
    - name: companyName
      label: Nama perusahaan
      row: 2
    - name: address
      label: Alamat
      row: 3
    - name: zip
      label: Kode Pos/Kode Pos
      row: 4
    - name: country
      label: Negara
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Perkiraan Volume Pesanan
      row: 6
      type: select
      options:
        - value: ''
          label: Pilih perkiraan volume Anda...
        - value: sample
          label: Sampel / Prototipe saja
        - value: 5-10
          label: 5–10 unit (MOQ Standar)
        - value: 100-500
          label: 100–500 unit
        - value: 500-plus
          label: 500+ unit (Harga volume)
    - name: customization
      label: Diperlukan Kustomisasi?
      row: 7
      type: select
      options:
        - value: ''
          label: Pilih jenis penyesuaian...
        - value: none
          label: Produk standar (tidak ada penyesuaian)
        - value: logo
          label: Logo / Branding Khusus saja
        - value: full
          label: OEM penuh (ukuran, warna, grafik, kemasan)
        - value: consultation
          label: Tidak yakin — perlu konsultasi
    - name: productInterest
      label: Kelompok Kepentingan
      row: 8
      type: select
      options:
        - value: ''
          label: Pilih jenis kolam...
        - value: all
          label: Semua kolam / Katalog lengkap
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Subjek
      row: 9
    - name: message
      label: Pesan
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Cara lain untuk menghubungi kami
  columns: 3
  items:
    - title: Pertanyaan penjualan
      description: Kutipan kumpulan, harga grosir, dan pesanan massal.
      icon: tabler:shopping-bag
    - title: Dukungan teknis
      description: Bantuan pengaturan, perbaikan, suku cadang, dan pertanyaan perawatan.
      icon: tabler:tool
    - title: OEM / ODM
      description: Ukuran, warna, sampul, merek, dan kemasan khusus.
      icon: tabler:palette
    - title: E-mail
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Situs web
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: Waktu respons
      description: Kami membalas dalam satu hari kerja.
      icon: tabler:clock
map:
  title: Hubungi kami
  subtitle: Hubungi Inflatable Pool Factory
  address: inflatablepoolfactory.com
