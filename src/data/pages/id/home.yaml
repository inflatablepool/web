content_compliance:
  tagline: Perawatan & Keamanan
  title: Mudah untuk Dimiliki,<br />Mudah untuk Mencintai
  subtitle: Dari pengiriman hingga renang pertama hingga penyimpanan akhir musim, memiliki kolam Inflatable Pool Factory tetaplah sederhana.
  items:
    - title: Pengaturan dalam hitungan Menit
      description: 'Buka kotak dan kembangkan dengan pompa yang disertakan dalam 5-15 menit, lalu isi dengan selang taman — waktu pengisian bervariasi tergantung ukuran kolam dan persediaan air.'
      icon: tabler:rocket
    - title: Perawatan Air Sederhana
      description: Port pompa filter standar 32/38 mm, pemeriksaan pH rutin, dan penutup terpasang pada model bundar menjaga air tetap bersih.
      icon: tabler:droplet
    - title: Bersihkan, Tiriskan & Simpan
      description: Tiriskan, keringkan, gulung, dan masukkan kolam ke dalam kantong penyimpanannya untuk musim dingin. Tidak ada instalasi permanen yang harus dipelihara.
      icon: tabler:package
    - title: Keselamatan Pertama
      description: Anak-anak harus diawasi secara aktif oleh orang dewasa setiap saat. Ikuti manual, peraturan setempat, dan panduan penggunaan yang aman.
      icon: tabler:shield-check
