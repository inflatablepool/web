features:
  id: features
  tagline: Drop Stitch technológia
  title: Miért egy Inflatable Pool Factory medence?<br />Különböző
  subtitle: A nagynyomású Drop Stitch konstrukció merevvé, tartóssá és könnyedén tárolhatóvá teszi medencéinket.
  columns: 2
  items:
    - title: Merev Drop Stitch falak
      description: 'Több ezer belső menet rögzíti egymáshoz a falrétegeket, így a medence 4-5 PSI névleges nyomással mereven felfújódik, és megtöltéskor megtartja alakját.'
      icon: tabler:hexagon
    - title: Gyors, szerszámmentes beállítás
      description: Fújja fel a mellékelt elektromos szivattyúval percek alatt, majd töltse fel kerti tömlővel. Nincsenek szerszámok, nincs építés, nincs szakszerű telepítés.
      icon: tabler:rocket
    - title: Kicsit csomagolva
      description: 'Engedje le, eressze le, tekerje fel, és tárolja a medencét a táskájában télen – egy teljes méretű medence, amely kis méretű beltéri tárolásra alkalmas.'
      icon: tabler:package
    - title: Tartós és UV-álló
      description: 'Kétrétegű PVC drop stitch szövet, amelyet úgy terveztek, hogy ellenálljon a szúrásoknak és a UV expozíciónak a teljes családi használat során.'
      icon: tabler:shield
    - title: Komplett csomag
      description: Minden medencét elektromos légszivattyúval, javítókészlettel és tárolótáskával szállítunk. Kerek modellekhez felszerelt burkolatok kaphatók.
      icon: tabler:box
    - title: Biztonságtudatos tervezés
      description: 'A lakómedencék tervezése az EN 16582-1 és az ASTM F2666 szabványnak megfelelően – a modellspecifikus biztonsági információk a termékdokumentációban találhatók. Állandó felnőtt felügyelet szükséges.'
      icon: tabler:shield-check
