features3_what_we_build:
  title: Amit építünk
  subtitle: Egy fókuszált termékcsalád, amelyet kívülről ismerünk – nagynyomású Drop Stitch felfújható úszómedencék.
  columns: 3
  isBeforeContent: true
  items:
    - title: Téglalap alakú medencék
      description: Családi méretű téglalap alakú Drop Stitch medencék, amelyek maximalizálják az úszóterületet az Ön számára.
      icon: tabler:rectangle
    - title: Kerek kék medencék
      description: A klasszikus kerti medence – élénkkék, merev Drop Stitch falak, gyors beállítás.
      icon: tabler:circle
    - title: Kerek szürke medencék
      description: Prémium termékcsaládunk modern szürke felülettel és opcionálisan felszerelt burkolattal.
      icon: tabler:circle-dot
    - title: Pezsgőfürdő SPA medencék
      description: 'Szigetelt pezsgőfürdő modellek beépített ülésekkel és 5 mm-es szigetelt fenékrészekkel – külső fűtőtestekhez való használatra (a fűtőtest nem tartozék).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Komplett csomagok
      description: Minden medencét elektromos légszivattyúval, javítókészlettel és tárolótáskával szállítunk.
      icon: tabler:package
    - title: Egyedi méretek
      description: OEM méretek, színek és burkolatok márkákhoz, forgalmazókhoz és vendéglátó projektekhez.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Magáncímkés gyártás logónyomtatással és kiskereskedelmi csomagolással.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Inflatable Pool Factory téglalap alakú Drop Stitch felfújható medence
