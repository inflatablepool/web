hero:
  tagline: Rólunk
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory felfújható medence
  title: |
    Az úszás egyszerűvé tétele, <br />
     <span class="text-accent dark:text-white">Inflatable Pool Factory</span> módra
  subtitle: Az Inflatable Pool Factory egy prémium Drop Stitch felfújható medence márka, amelyet az Inflatable Pool Team · Qingdao Vatrad Group tervezett. Hiszünk abban, hogy minden család megérdemel egy igazi medencét a hátsó udvarban – építkezés, engedélyek vagy állandó telepítés nélkül. Medencéink percek alatt mereven felfújódnak, túlélik a családi szórakozás teljes nyarait, és a szezon végén elpakolnak.
