hero:
  tagline: Meie kohta
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory täispuhutav bassein
  title: |
    Ujumise lihtsaks muutmine, <br />
     <span class="text-accent dark:text-white">Inflatable Pool Factory</span>-viisil
  subtitle: Inflatable Pool Factory on esmaklassiline täispuhutav Drop Stitch basseini bränd, mille on kujundanud Inflatable Pool Team · Qingdao Vatrad Group. Usume, et iga pere väärib tõelist basseini tagahoovis – ilma ehituse, lubade või püsiva paigalduseta. Meie basseinid täituvad mõne minutiga jäigaks, elavad üle terve suvi pere lõbusalt ja pakivad hooaja lõpus väikeseks.
