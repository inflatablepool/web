hero_text:
  tagline: Võtke ühendust
  title: VÕTA ÜHENDUST
contact_form:
  id: form
  title: Saada meile sõnum
  subtitle: Hinnapakkumiste, tehniliste küsimuste või partnerluspäringute korral kirjutage meile.
  email_to: info@inflatablepoolfactory.com
  submit_button: Saada päring → Küsi pakkumist
  success_message: Aitäh! Teie sõnum jõudis meie postkasti.
  error_message: Midagi läks teie sõnumi saatmisel valesti. Proovige uuesti või saatke meile otse e-kiri.
  default_country_code: '+86'
  captcha:
    label: 'Rämpspostitõrje: palun lahendage järgmine'
  fields:
    - name: firstName
      label: Eesnimi
      row: 1
    - name: lastName
      label: Perekonnanimi
      row: 1
    - name: companyName
      label: Ettevõtte nimi
      row: 2
    - name: address
      label: Aadress
      row: 3
    - name: zip
      label: Postiindeks
      row: 4
    - name: country
      label: Riik
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-post
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Hinnanguline tellimuste maht
      row: 6
      type: select
      options:
        - value: ''
          label: Valige oma hinnanguline helitugevus...
        - value: sample
          label: Ainult näidised/prototüübid
        - value: 100-500
          label: 100-500 ühikut
        - value: 500-plus
          label: 500+ ühikut (mahuhinnakujundus)
    - name: customization
      label: Kas vajate kohandamist?
      row: 7
      type: select
      options:
        - value: ''
          label: Valige kohandamise tüüp...
        - value: none
          label: Standardtoode (ilma kohandamiseta)
        - value: logo
          label: Ainult kohandatud logo/bränding
        - value: full
          label: OEM (suurus, värv, graafika, pakend)
        - value: consultation
          label: Pole kindel - vajan konsultatsiooni
    - name: productInterest
      label: Huvikogum
      row: 8
      type: select
      options:
        - value: ''
          label: Valige basseini tüüp...
        - value: all
          label: Kõik basseinid / Täielik kataloog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Teema
      row: 9
    - name: message
      label: Sõnum
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Muud viisid meieni jõudmiseks
  columns: 3
  items:
    - title: Müügipäringud
      description: Basseini hinnapakkumised, hulgihinnad ja hulgitellimused.
      icon: tabler:shopping-bag
    - title: Tehniline tugi
      description: Seadistusabi, remont, varuosad ja hooldusküsimused.
      icon: tabler:tool
    - title: OEM / ODM
      description: Kohandatud suurused, värvid, kaaned, kaubamärk ja pakend.
      icon: tabler:palette
    - title: Meil
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: Veebisait
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: Võtke ühendust
  subtitle: Võtke Inflatable Pool Factory ühendust
  address: inflatablepoolfactory.com
  zoom: 15

