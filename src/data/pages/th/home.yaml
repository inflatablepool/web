compare_collections:
  tagline: 'เปรียบเทียบคอลเลกชัน'
  title: 'สี่คอลเลกชัน หนึ่งทางเลือกที่ชัดเจน'
  subtitle: 'ขนาดและการใช้งานที่ดีที่สุดโดยสรุป — ข้อมูลจำเพาะทั้งหมดแสดงอยู่ในหน้าผลิตภัณฑ์แต่ละหน้า'
  headers:
    collection: 'คอลเลกชัน'
    sizes: 'ขนาด'
    best_for: 'ดีที่สุดสำหรับ'
  rows:
    - collection: 'สระน้ำทรงกลม'
      sizes: 'Ø 2.0 – 10.0 m'
      best_for: 'ว่ายน้ำและเล่นสำหรับครอบครัว — ขนาดที่กว้างที่สุด'
      href: /products/round-blue-drop-stitch-pool
    - collection: 'สระน้ำทรงสี่เหลี่ยม'
      sizes: '2 × 2 m – 6 × 5 m'
      best_for: 'พื้นที่ว่ายน้ำด้านตรงเพื่อการสังสรรค์ที่ใหญ่ขึ้น'
      href: /products/rectangular-drop-stitch-pool
    - collection: 'สปาทรงกลม (อ่างน้ำร้อน)'
      sizes: 'Ø 1.8 – 2.3 m'
      best_for: 'ที่นั่งในตัวสำหรับนั่งแช่'
      href: /products/hot-tub-round
    - collection: 'สปาทรงสี่เหลี่ยม/สี่เหลี่ยมผืนผ้า (อ่างน้ำร้อน)'
      sizes: '1.5 × 1.5 m – 3 × 2 m'
      best_for: 'นั่งแช่ในพื้นที่ขนาดกะทัดรัด'
      href: /products/hot-tub-square-rect
  note: 'คอลเลกชันทั้งหมด: ผนัง 4–5 PSI drop-stitch, การสูบลม 5–15 นาที, พื้นที่จัดเก็บแบบแพ็คแยก การทำความร้อนและการกรองเป็นแบบภายนอก - เครื่องทำความร้อนและปั๊มกรองจำหน่ายแยกต่างหาก'
