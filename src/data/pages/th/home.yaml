      href: /find-your-pool
      icon: tabler:compass
    - text: 'สำหรับธุรกิจ'
      href: /for-businesses
      icon: tabler:briefcase
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: สระว่ายน้ำเป่าลมทรงสี่เหลี่ยม Inflatable Pool Factory Drop Stitch ในสวนหลังบ้าน
