hero_text:
  tagline: ติดต่อ
  title: ได้รับการติดต่อ
contact_form:
  id: form
  title: ส่งข้อความถึงเรา
  subtitle: สำหรับการเสนอราคา คำถามทางเทคนิค หรือสอบถามเกี่ยวกับความร่วมมือ โปรดติดต่อเรา
  email_to: info@inflatablepoolfactory.com
  submit_button: ส่งคำถาม → รับใบเสนอราคา
  success_message: ขอบคุณ! เราได้รับข้อความของคุณแล้ว
  error_message: เกิดข้อผิดพลาดในการส่งข้อความของคุณ โปรดลองอีกครั้งหรือส่งอีเมลถึงเราโดยตรง
  default_country_code: '+86'
  captcha:
    label: 'ป้องกันสแปม: โปรดแก้ไขปัญหาต่อไปนี้'
  fields:
    - name: firstName
      label: ชื่อ
      row: 1
    - name: lastName
      label: นามสกุล
      row: 1
    - name: companyName
      label: ชื่อบริษัท
      row: 2
    - name: address
      label: ที่อยู่
      row: 3
    - name: zip
      label: รหัสไปรษณีย์
      row: 4
    - name: country
      label: ประเทศ
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: อีเมล
      row: 5
      type: email
    - name: tel
      label: โทร
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: ปริมาณการสั่งซื้อโดยประมาณ
      row: 6
      type: select
      options:
        - value: ''
          label: เลือกปริมาณโดยประมาณของคุณ...
        - value: sample
          label: ตัวอย่าง/ต้นแบบเท่านั้น
        - value: 100-500
          label: 100–500 หน่วย
        - value: 500-plus
          label: 500+ หน่วย (ราคาตามปริมาณ)
    - name: customization
      label: จำเป็นต้องปรับแต่งไหม?
      row: 7
      type: select
      options:
        - value: ''
          label: เลือกประเภทการปรับแต่ง...
        - value: none
          label: สินค้ามาตรฐาน (ไม่มีการปรับแต่ง)
        - value: logo
          label: โลโก้ที่กำหนดเอง / การสร้างแบรนด์เท่านั้น
        - value: full
          label: OEM เต็มรูปแบบ (ขนาด สี กราฟิก บรรจุภัณฑ์)
        - value: consultation
          label: ไม่แน่ใจ — ต้องการคำปรึกษา
    - name: productInterest
      label: แหล่งรวมความสนใจ
      row: 8
      type: select
      options:
        - value: ''
          label: เลือกประเภทสระน้ำ...
        - value: all
          label: พูลทั้งหมด / แค็ตตาล็อกฉบับเต็ม
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: เรื่อง
      row: 9
    - name: message
      label: ข้อความ
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: ช่องทางอื่นในการติดต่อเรา
  columns: 3
  items:
    - title: สอบถามข้อมูลการขาย
      description: ราคาพูล ราคาขายส่ง และคำสั่งซื้อจำนวนมาก
      icon: tabler:shopping-bag
    - title: การสนับสนุนด้านเทคนิค
      description: ความช่วยเหลือในการตั้งค่า การซ่อมแซม อะไหล่ และคำถามในการดูแลรักษา
      icon: tabler:tool
    - title: OEM/ODM
      description: ขนาด สี ปก การสร้างแบรนด์ และบรรจุภัณฑ์ที่กำหนดเอง
      icon: tabler:palette
    - title: อีเมล
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: เว็บไซต์
      description: inflatablepoolfactory.com
      icon: tabler:world
map:
  title: ได้รับการติดต่อ
  subtitle: ติดต่อInflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

