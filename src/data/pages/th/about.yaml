hero:
  tagline: เกี่ยวกับเรา
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: สระว่ายน้ำเป่าลม Inflatable Pool Factory
  title: |
    ว่ายน้ำให้เป็นเรื่องง่าย <br />
    สไตล์ <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory คือแบรนด์สระน้ำเป่าลม Drop Stitch ระดับพรีเมียมที่ออกแบบโดย Inflatable Pool Team · Qingdao Vatrad Group เราเชื่อว่าทุกครอบครัวสมควรมีสระว่ายน้ำจริงๆ ในสวนหลังบ้าน โดยไม่ต้องก่อสร้าง ใบอนุญาต หรือติดตั้งถาวร สระน้ำของเราพองตัวได้ภายในไม่กี่นาที สนุกสนานกับครอบครัวในช่วงฤดูร้อน และแพ็คให้เล็กลงเมื่อสิ้นสุดฤดูกาล
stats:
  title: โดยตัวเลข
  columns: 4
  stats:
    - title: คอลเลกชันสระว่ายน้ำ
      amount: '4'
    - title: 'เวลาสูบลม'
      amount: '5-15 min'
    - title: จัดอันดับความดัน
      amount: 4-5 PSI
    - title: ติดต่อ
      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: สิ่งที่เราสร้าง
  subtitle: กลุ่มผลิตภัณฑ์ที่มุ่งเน้นที่เรารู้จักจากภายในสู่ภายนอก — สระว่ายน้ำเป่าลม Drop Stitch แรงดันสูง
  columns: 3
  isBeforeContent: true
  items:
    - title: สระน้ำทรงสี่เหลี่ยม
      description: สระ Drop Stitch ทรงสี่เหลี่ยมขนาดครอบครัวที่เพิ่มพื้นที่ว่ายน้ำให้สูงสุดสำหรับพื้นที่ของคุณ
      icon: tabler:rectangle
    - title: สระน้ำสีฟ้าทรงกลม
      description: สระว่ายน้ำหลังบ้านแบบคลาสสิก — สีฟ้าสดใส ผนัง Drop Stitch ที่แข็งแกร่ง ติดตั้งได้รวดเร็ว
      icon: tabler:circle
    - title: สระน้ำทรงกลมสีเทา
      description: กลุ่มผลิตภัณฑ์ระดับพรีเมี่ยมของเรามีพื้นผิวสีเทาทันสมัยและฝาครอบเสริมแบบพอดีตัว
      icon: tabler:circle-dot
    - title: อ่างน้ำร้อน สระสปา
      description: 'รุ่นอ่างน้ำร้อนหุ้มฉนวนพร้อมที่นั่งในตัวและพื้นหุ้มฉนวน 5 mm — สำหรับใช้กับเครื่องทำความร้อนภายนอก (ไม่รวมเครื่องทำความร้อน)'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: แพ็คเกจสมบูรณ์
      description: สระทุกสระมาพร้อมกับปั๊มลมไฟฟ้า ชุดซ่อม และถุงเก็บของ
      icon: tabler:package
    - title: ขนาดที่กำหนดเอง
      description: ขนาด สี และปก OEM สำหรับแบรนด์ ผู้จัดจำหน่าย และโครงการด้านการบริการ
      icon: tabler:adjustments
    - title: OEM/ODM
      description: การผลิตฉลากส่วนตัวพร้อมการพิมพ์โลโก้และบรรจุภัณฑ์พร้อมขายปลีก
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Inflatable Pool Factory สระว่ายน้ำเป่าลมทรงสี่เหลี่ยม Drop Stitch
steps2_values:
  title: ค่านิยมของเรา
  subtitle: หลักการสามประการที่หล่อหลอมทุกสระที่เราสร้าง
  items:
    - title: สร้างเหมือนครอบครัวของคุณจะใช้มัน
      description: ทุกตะเข็บ ผนัง และวาล์วได้รับการปฏิบัติราวกับว่าครอบครัวของเราเองว่ายน้ำอยู่ในนั้น
      icon: tabler:heart
    - title: วิศวกรก่อนที่เราจะขาย
      description: โครงสร้างแบบ Drop Stitch แรงดันสูง ผ่านการทดสอบเหนือแรงดันที่กำหนด ก่อนลงเรือในสระน้ำ
      icon: tabler:settings
    - title: การสนับสนุนที่ยาวนานกว่าฤดูกาล
      description: คำถาม อะไหล่ หรือการรับประกัน — ติดต่อเราที่ info@inflatablepoolfactory.com
      icon: tabler:headset
steps2_milestones:
  title: เหตุการณ์สำคัญ
  subtitle: เรื่องราวสั้น ๆ ของ Inflatable Pool Factory
  isReversed: true
  items:
    - title: มุ่งเน้นไปที่สระน้ำเป่าลม
      description: 'Inflatable Pool Factory ก่อตั้งขึ้นโดยมุ่งเน้นที่เดียว: สระว่ายน้ำเป่าลม Drop Stitch ระดับพรีเมี่ยม'
      icon: tabler:pool
    - title: คอลเลกชันลายเซ็นสามรายการ
      description: เส้นสระว่ายน้ำทรงสี่เหลี่ยม กลมสีน้ำเงิน และกลมสีเทา แต่ละเส้นมีฝาปิดเสริมและขนาดที่กำหนดเอง
      icon: tabler:circle-check
    - title: OEM/ODM สำหรับพันธมิตรทั่วโลก
      description: การผลิตตามสั่งสำหรับแบรนด์ ผู้จัดจำหน่าย โรงแรม และผู้ประกอบธุรกิจโคมไฟ
      icon: tabler:world
features2_locations:
  title: สนใจติดต่อ
  tagline: ติดต่อ
  columns: 3
  items:
    - title: อีเมล
      description: info@inflatablepoolfactory.com
    - title: เว็บไซต์
      description: inflatablepoolfactory.com — เรียกดูพูลของเราและขอใบเสนอราคา
    - title: OEM/ขายส่ง
      description: ขนาด สี และตราสินค้าที่กำหนดเองสำหรับพันธมิตรทางธุรกิจ
