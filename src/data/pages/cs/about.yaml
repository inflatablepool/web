hero:
  tagline: O nás
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Nafukovací bazén Inflatable Pool Factory
  title: |
    Aby bylo plavání jednoduché, <br />
    stylem <span class="text-accent dark:text-white">Inflatable Pool Factory</span> 
  subtitle: Inflatable Pool Factory je prémiová značka nafukovacích bazénů Drop Stitch navržená společností Inflatable Pool Team · Qingdao Vatrad Group. Věříme, že každá rodina si zaslouží skutečný bazén na dvorku – bez stavby, povolení nebo trvalé instalace. Naše bazény se nafouknou během několika minut, přežijí celá léta rodinné zábavy a na konci sezóny se sbalí.
