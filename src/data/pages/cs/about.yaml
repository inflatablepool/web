      amount: info@inflatablepoolfactory.com
features3_what_we_build:
  title: Co stavíme
  subtitle: Zaměřená produktová řada, kterou známe zevnitř – vysokotlaké nafukovací bazény Drop Stitch.
  columns: 3
  isBeforeContent: true
  items:
    - title: Obdélníkové bazény
      description: Obdélníkové bazény Drop Stitch rodinné velikosti, které maximalizují plavecký prostor pro váš prostor.
      icon: tabler:rectangle
    - title: Kulaté modré bazény
      description: Klasický zahradní bazén – zářivě modrá, pevné stěny Drop Stitch, rychlé nastavení.
      icon: tabler:circle
    - title: Kulaté šedé bazény
      description: Naše prémiová řada s moderním šedým povrchem a volitelným krytem.
      icon: tabler:circle-dot
    - title: Bazény s vířivkou SPA
      description: 'Modely s izolovanými vířivkami s vestavěnými sedadly a 5 mm izolovaným dnem — pro použití s ​​externími ohřívači (topení není součástí dodávky).'
      icon: tabler:ripple
features3_more:
  columns: 3
  isAfterContent: true
  items:
    - title: Kompletní balíčky
      description: Každý bazén je dodáván s elektrickým vzduchovým čerpadlem, opravnou sadou a úložným vakem.
      icon: tabler:package
    - title: Vlastní velikosti
      description: OEM velikosti, barvy a kryty pro značky, distributory a projekty pohostinství.
      icon: tabler:adjustments
    - title: OEM / ODM
      description: Výroba soukromých etiket s potiskem loga a balením připraveným pro maloobchod.
      icon: tabler:palette
  image:
    src: /images/pools/rectangular-pool-2.webp
    alt: Obdélníkový nafukovací bazén Inflatable Pool Factory Drop Stitch
