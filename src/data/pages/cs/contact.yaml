hero_text:
  tagline: Kontakt
  title: KONTAKTUJTE SE
contact_form:
  id: form
  title: Pošlete nám zprávu
  subtitle: V případě cenových nabídek, technických dotazů nebo dotazů na partnerství nám napište. Odpovídáme do jednoho pracovního dne.
  email_to: info@inflatablepoolfactory.com
  submit_button: Odeslat poptávku → Získejte cenovou nabídku
  success_message: Díky! Vaše zpráva přistála v naší doručené poště. Odpovíme do jednoho pracovního dne.
  error_message: Při odesílání vaší zprávy se něco pokazilo. Zkuste to znovu nebo nám napište přímo.
  default_country_code: '+86'
  captcha:
    label: 'Anti-spam: vyřešte prosím následující'
  fields:
    - name: firstName
      label: Křestní jméno
      row: 1
    - name: lastName
      label: Příjmení
      row: 1
    - name: companyName
      label: Název společnosti
      row: 2
    - name: address
      label: Adresa
      row: 3
    - name: zip
      label: PSČ
      row: 4
    - name: country
      label: Země
      row: 4
      type: select
      optionsKey: countries
    - name: email
      label: E-mail
      row: 5
      type: email
    - name: tel
      label: TEL
      row: 5
      type: tel
      withCountryCode: true
    - name: orderVolume
      label: Odhadovaný objem objednávky
      row: 6
      type: select
      options:
        - value: ''
          label: Vyberte odhadovaný objem...
        - value: sample
          label: Pouze vzorky / prototypy
        - value: 5-10
          label: 5–10 jednotek (standardní MOQ)
        - value: 100-500
          label: 100–500 jednotek
        - value: 500-plus
          label: 500+ jednotek (množstevní cena)
    - name: customization
      label: Je potřeba přizpůsobení?
      row: 7
      type: select
      options:
        - value: ''
          label: Vyberte typ přizpůsobení...
        - value: none
          label: Standardní produkt (žádné přizpůsobení)
        - value: logo
          label: Pouze vlastní logo / branding
        - value: full
          label: Kompletní OEM (velikost, barva, grafika, balení)
        - value: consultation
          label: Nejsem si jistý – potřebuji konzultaci
    - name: productInterest
      label: Fond zájmu
      row: 8
      type: select
      options:
        - value: ''
          label: Vyberte typ bazénu...
        - value: all
          label: Všechny bazény / Kompletní katalog
        - value: rectangular
          label: Rectangular Drop Stitch Pool
        - value: round-blue
          label: Round Drop Stitch Pool (Blue)
        - value: round-grey
          label: Round Drop Stitch Pool (Grey)
        - value: cover
          label: Round Pool with Cover
        - value: oem
          label: OEM / Custom Pool
    - name: subject
      label: Podrobit
      row: 9
    - name: message
      label: Zpráva
      row: 10
      type: textarea
      rows: 6
features2_other_ways:
  title: Jiné způsoby, jak se k nám dostat
  columns: 3
  items:
    - title: Prodejní dotazy
      description: Shromáždit citace, velkoobchodní ceny a hromadné objednávky.
      icon: tabler:shopping-bag
    - title: Technická podpora
      description: Pomoc s nastavením, opravy, náhradní díly a otázky týkající se péče.
      icon: tabler:tool
    - title: OEM / ODM
      description: Vlastní velikosti, barvy, kryty, značky a balení.
      icon: tabler:palette
    - title: E-mail
      description: info@inflatablepoolfactory.com
      icon: tabler:mail
    - title: webové stránky
      description: inflatablepoolfactory.com
      icon: tabler:world
    - title: Doba odezvy
      description: Odpovídáme do jednoho pracovního dne.
      icon: tabler:clock
map:
  title: Kontaktujte nás
  subtitle: Kontaktujte Inflatable Pool Factory
  address: inflatablepoolfactory.com
  zoom: 15

