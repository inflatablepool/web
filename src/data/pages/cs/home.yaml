features:
  id: features
  tagline: Technologie Drop Stitch
  title: Proč bazén Inflatable Pool Factory<br />Je Různé
  subtitle: Díky vysokotlaké konstrukci Drop Stitch jsou naše bazény pevné, odolné a snadno se skladují.
  columns: 2
  items:
    - title: Pevné stěny Drop Stitch
      description: 'Tisíce vnitřních závitů spojují vrstvy stěn dohromady, takže se bazén nafoukne pevně na jmenovitý tlak 4-5 PSI a po naplnění si zachovává svůj tvar.'
      icon: tabler:hexagon
    - title: Rychlé nastavení bez použití nářadí
      description: Nafoukněte přiloženou elektrickou pumpou během několika minut a poté naplňte zahradní hadicí. Žádné nářadí, žádná konstrukce, žádná odborná instalace.
      icon: tabler:rocket
    - title: Malé balení
      description: 'Vypusťte, vyfoukněte, srolujte a uskladněte bazén přes zimu v tašce – bazén plné velikosti, který se sbalí jako malý pro vnitřní skladování.'
      icon: tabler:package
    - title: Odolné a UV-odolné
      description: 'Dvouvrstvá tkanina PVC drop stitch, navržená tak, aby odolala propíchnutí a vystavení UV po celou sezónu rodinného používání.'
      icon: tabler:shield
    - title: Kompletní balíček
      description: Každý bazén je dodáván s elektrickým vzduchovým čerpadlem, opravnou sadou a úložným vakem. Pro kulaté modely jsou k dispozici namontované kryty.
      icon: tabler:box
    - title: Design s vědomím bezpečnosti
      description: 'Návrh obytného bazénu s odkazem na EN 16582-1 a ASTM F2666 – bezpečnostní informace specifické pro daný model jsou uvedeny v dokumentaci produktu. Vždy je nutný neustálý dohled dospělé osoby.'
      icon: tabler:shield-check
