    src: /images/pools/round-grey-pool-1.webp
    alt: Kulatý nafukovací bazén Inflatable Pool Factory Drop Stitch
blog_latest:
  title: Pool Guides & Insights
  information: |
    Průvodce nastavením, tipy na péči a rady k nákupu nafukovacích bazénů
    z týmu Inflatable Pool Factory.
faqs:
  title: Často kladené otázky o nafukovacím bazénu
  subtitle: Časté dotazy k nafukovacím bazénům Inflatable Pool Factory.
  columns: 2
  items:
    - title: Jak dlouho trvá nastavení?
      description: 'Nafouknutí trvá 5-15 minut s přiloženou elektrickou vzduchovou pumpou v závislosti na modelu. Doba napouštění se liší podle kapacity bazénu a vašeho zásobování vodou.'
      icon: tabler:clock
      category: all
    - title: Jak pevný je bazén Drop Stitch?
      description: Velmi tuhé. Stěny Drop Stitch se nafouknou tvrdě na 4-5 PSI – podobně jako nafukovací paddleboard – takže bazén si po naplnění vodou drží svůj tvar.
      icon: tabler:hexagon
      category: all
    - title: Mohou bazén využívat děti?
      description: Ano, s aktivním dohledem dospělé osoby po celou dobu. Děti nesmí být nikdy ponechány bez dozoru v bazénu nebo v jeho blízkosti – dodržujte manuál a místní bezpečnostní pravidla.
      icon: tabler:users
      category: all
    - title: Jak skladuji bazén v zimě?
      description: Vypusťte vodu, vypusťte bazén, nechte jej zcela vyschnout, poté jej srolujte a uložte do přiloženého úložného vaku na nemrznoucí místo.
      icon: tabler:package
      category: all
    - title: Co je součástí bazénu?
      description: Každý bazén Inflatable Pool Factory obsahuje elektrické vzduchové čerpadlo, opravnou sadu a úložný vak. Kulaté modely mají volitelný namontovaný kryt.
      icon: tabler:box
      category: all
    - title: Jaké velikosti jsou k dispozici?
      description: 48 standardních SKU ve čtyřech kolekcích — kulaté bazény do 10 m v průměru, obdélníkové bazény do 6 × 5 m a SPA vany s vestavěnými sedadly. Vlastní velikosti jsou k dispozici pro obchodní partnery.
      icon: tabler:ruler-2
      category: all
    - title: Na jakých plochách může bazén stát?
      description: 'Jakýkoli plochý, rovný povrch bez ostrých předmětů – trávník, terasa nebo terasa. Na drsné povrchy se doporučuje podkladová deska. Naplněný bazén je těžký: instalujte pouze na povrch, který unese plnou váhu, a nejprve si nechejte vyvýšené terasy, balkony a střechy konstrukčně posoudit.'
      icon: tabler:layout-grid
      category: all
    - title: Jak udržím vodu čistou?
      description: Použijte filtrační čerpadlo tam, kde je namontováno, seberte nečistoty, zkontrolujte pH a zakryjte bazén, když jej nepoužíváte. Jak dlouho voda vydrží, závisí na velikosti bazénu, využití a filtraci – raději pravidelně testujte, než abyste se spoléhali na pevný plán.
      icon: tabler:droplet
      category: all
