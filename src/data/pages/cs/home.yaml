content_compliance:
  tagline: Péče a bezpečnost
  title: Snadné vlastnictví,<br />Snadno milovat
  subtitle: Od doručení přes první plavání až po uskladnění na konci sezóny je vlastnictví bazénu Inflatable Pool Factory jednoduché.
  items:
    - title: Nastavení v minutách
      description: 'Vybalte a nafoukněte přiloženou pumpou za 5-15 minut, poté naplňte zahradní hadicí — doba plnění se liší podle velikosti bazénu a dodávky vody.'
      icon: tabler:rocket
    - title: Jednoduchá péče o vodu
      description: Standardní 32/38 mm porty filtračního čerpadla, pravidelné kontroly pH a namontovaný kryt u kulatých modelů udržují vodu čistou.
      icon: tabler:droplet
    - title: Vyčistěte, vypusťte a uskladněte
      description: Vypusťte, vysušte, srolujte a na zimu zabalte bazén do úložného vaku. Není nutná trvalá instalace.
      icon: tabler:package
    - title: Bezpečnost především
      description: Děti musí být neustále pod aktivním dohledem dospělé osoby. Dodržujte manuál, místní pravidla a pokyny pro bezpečné používání.
      icon: tabler:shield-check
steps:
  title: Z krabice na dvorek
  items:
    - title: 'Krok 1: <span class="font-medium">Vyberte si svůj bazén</span>'
      description: Porovnejte tvary a velikosti, aby odpovídaly vašemu prostoru, domácnosti a tomu, jak plánujete vodu využívat.
      icon: tabler:pool
    - title: 'Krok 2: <span class="font-medium">Nastavte to</span>'
      description: Umístěte na pevnou, rovnou zem, nafoukněte přiloženou elektrickou pumpou a naplňte zahradní hadicí.
      icon: tabler:rocket
    - title: 'Krok 3: <span class="font-medium">Plavat celé léto</span>'
      description: Udržujte vodu čerstvou jednoduchou péčí – sbírejte, zakryjte a kontrolujte pH jako každý malý bazén.
      icon: tabler:ripple
    - title: 'Krok 4: <span class="font-medium">Uložte to pryč</span>'
      description: Když sezóna skončí, vypusťte, vysušte, srolujte a uložte bazén v tašce do příštího léta.
      icon: tabler:package
