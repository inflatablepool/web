features:
  id: features
  tagline: Τεχνολογία Drop Stitch
  title: Γιατί μια πισίνα Inflatable Pool Factory<br />Είναι Διαφορετικό
  subtitle: Η κατασκευή Drop Stitch υψηλής πίεσης κάνει τις πισίνες μας άκαμπτες, ανθεκτικές και αβίαστη στην αποθήκευση.
  columns: 2
  items:
    - title: Άκαμπτοι τοίχοι Drop Stitch
      description: 'Χιλιάδες εσωτερικά νήματα κλειδώνουν τα στρώματα τοίχων μεταξύ τους, έτσι η πισίνα φουσκώνει άκαμπτη με ονομαστική τιμή 4-5 PSI και διατηρεί το σχήμα της όταν γεμίζει.'
      icon: tabler:hexagon
    - title: Γρήγορη εγκατάσταση χωρίς εργαλεία
      description: Φουσκώστε με την παρεχόμενη ηλεκτρική αντλία μέσα σε λίγα λεπτά και μετά γεμίστε με έναν εύκαμπτο σωλήνα κήπου. Χωρίς εργαλεία, χωρίς κατασκευή, χωρίς επαγγελματική εγκατάσταση.
      icon: tabler:rocket
    - title: Πακέτα μακριά Μικρά
      description: 'Στραγγίστε, ξεφουσκώστε, τυλίξτε και αποθηκεύστε την πισίνα στην τσάντα της κατά τη διάρκεια του χειμώνα - μια πισίνα πλήρους μεγέθους που είναι μικρή για αποθήκευση σε εσωτερικούς χώρους.'
      icon: tabler:package
    - title: Ανθεκτικό & Ανθεκτικό στην UV
      description: 'Ύφασμα PVC drop stitch διπλής στρώσης, σχεδιασμένο για να αντιστέκεται στα τρυπήματα και στην έκθεση UV για μια πλήρη σεζόν οικογενειακής χρήσης.'
      icon: tabler:shield
    - title: Ολοκληρωμένο Πακέτο
      description: Κάθε πισίνα συνοδεύεται από ηλεκτρική αντλία αέρα, κιτ επισκευής και τσάντα αποθήκευσης. Εφαρμοσμένα καλύμματα διαθέσιμα για στρογγυλά μοντέλα.
      icon: tabler:box
    - title: Σχεδιασμός Ασφαλείας-Συνειδητός
      description: 'Σχεδιασμός οικιακής πισίνας με αναφορά στα πρότυπα EN 16582-1 και ASTM F2666 — πληροφορίες ασφαλείας για συγκεκριμένο μοντέλο παρέχονται στην τεκμηρίωση του προϊόντος. Απαιτείται πάντα η συνεχής επίβλεψη από ενήλικα.'
      icon: tabler:shield-check
content_customer_types:
  tagline: Ιδέες για πισίνα
  title: Η σωστή πισίνα για<br />Ο χώρος σας
  subtitle: Πραγματικές ρυθμίσεις, πραγματικά μεγέθη και ειλικρινής καθοδήγηση για την επιλογή της σωστής πισίνας.
  items:
    - title: Πισίνες πίσω αυλής για οικογένειες
      description: Χωροταξικός σχεδιασμός, πραγματικά χρησιμοποιήσιμα μεγέθη και εύκολη συντήρηση για οικογενειακά καλοκαίρια στην πίσω αυλή.
      icon: tabler:home
      cta: Λάβετε ιδέες
      cta_href: /pool-ideas/backyard-pools-for-families
    - title: Πισίνες για μικρές αυλές
      description: 'Συμπαγή στρογγυλά και τετράγωνα μοντέλα που ταιριάζουν σε στενούς εξωτερικούς χώρους — χώρος για δροσιά και οικογενειακό νερό.'
      icon: tabler:layout-grid
      cta: Λάβετε ιδέες
      cta_href: /pool-ideas/pools-for-small-backyards
    - title: Μεγάλες πισίνες για συγκεντρώσεις
      description: Μεγάλες ορθογώνιες πισίνες με πραγματικό χώρο κολύμβησης για όλο το πλήρωμα τις καλοκαιρινές μέρες.
      icon: tabler:users
      cta: Λάβετε ιδέες
      cta_href: /pool-ideas/large-pools-for-family-gatherings
    - title: Υπαίθρια Διασκέδαση & Χαλάρωση
      description: Μπανιέρες SPA με ενσωματωμένα καθίσματα και μονωμένο πάτο για καθημερινή αναρρίχηση στο σπίτι.
      icon: tabler:ripple
      cta: Λάβετε ιδέες
      cta_href: /pool-ideas/outdoor-soaking-pools
    - title: Πισίνες για ενοικιάσεις διακοπών
      description: Μια εποχική ανέσεις επισκεπτών που στήνεται γρήγορα και αποθηκεύεται εκτός εποχής.
      icon: tabler:beach
      cta: Λάβετε ιδέες
      cta_href: /pool-ideas/pools-for-vacation-rentals
    - title: Glamping & Hospitality
      description: Ξεχωριστές υπαίθριες διαμονές — τοποθεσίες με γκλάμ, μπουτίκ και χώρους εκδηλώσεων.
      icon: tabler:tent
      cta: Λάβετε ιδέες
      cta_href: /pool-ideas/pools-for-glamping-and-hospitality
content_categories:
  tagline: Πισίνες καταστημάτων
  title: Εξερευνήστε τις πισίνες μας
  subtitle: Συγκρίνετε σχήματα, μεγέθη και χαρακτηριστικά για να βρείτε τη σωστή πισίνα για την αυλή ή τον εξωτερικό σας χώρο.
content_workshop:
  isReversed: true
  tagline: Για Επιχειρήσεις
  title: Πισίνες για Επιχειρήσεις,<br />Πολύ
  content: |
    <h3 class="text-2xl font-bold tracking-tight dark:text-white sm:text-3xl mb-2">Inflatable Pool Factory για επιχειρηματικούς εταίρους</h3>
  items:
    - title: Ενοικιάσεις διακοπών και φιλοξενίας
      description: Εποχικές ανέσεις επισκεπτών για ενοικιάσεις διακοπών, τοποθεσίες με λάμπινγκ και μπουτίκ — γρήγορη ανάπτυξη, εύκολη συντήρηση, απλή αποθήκευση.
    - title: Συνεργάτες λιανικής & επωνυμίας
      description: Προγράμματα χονδρικής και πισίνες Drop Stitch έτοιμες για λιανική πώληση για κέντρα κήπου, καταστήματα πισίνας και ηλεκτρονικά καταστήματα.
    - title: Προσαρμοσμένη & Ιδιωτική ετικέτα
      description: Προσαρμοσμένα μεγέθη, χρώματα, εξώφυλλα, εκτύπωση λογότυπων και συσκευασίες λιανικής για επωνυμίες — κατασκευασμένες από τους κατασκευαστές μας συνεργάτες.
content_compliance:
  tagline: Φροντίδα & Ασφάλεια
  title: Εύκολο στην κατοχή,<br />Εύκολο να αγαπάς
  subtitle: Από την παράδοση μέχρι το πρώτο κολύμπι μέχρι την αποθήκευση στο τέλος της σεζόν, η ιδιοκτησία μιας πισίνας Inflatable Pool Factory παραμένει απλή.
  items:
    - title: Ρύθμιση σε λεπτά
      description: 'Αποσυσκευάστε και φουσκώστε με την αντλία που περιλαμβάνεται σε 5-15 λεπτά και μετά γεμίστε με έναν εύκαμπτο σωλήνα κήπου — ο χρόνος πλήρωσης ποικίλλει ανάλογα με το μέγεθος της πισίνας και την παροχή νερού.'
      icon: tabler:rocket
    - title: Απλή φροντίδα νερού
      description: Οι τυπικές θύρες αντλίας φίλτρου 32/38 mm, οι τακτικοί έλεγχοι pH και το τοποθετημένο κάλυμμα σε στρογγυλά μοντέλα διατηρούν το νερό καθαρό.
      icon: tabler:droplet
    - title: Καθαρισμός, αποστράγγιση & αποθήκευση
      description: Στραγγίστε, στεγνώστε, τυλίξτε και συσκευάστε την πισίνα στη σακούλα αποθήκευσης για το χειμώνα. Δεν υπάρχει μόνιμη εγκατάσταση για συντήρηση.
      icon: tabler:package
    - title: Πρώτα η ασφάλεια
      description: Τα παιδιά πρέπει να επιβλέπονται ενεργά από ενήλικα ανά πάσα στιγμή. Ακολουθήστε το εγχειρίδιο, τους τοπικούς κανόνες και τις οδηγίες ασφαλούς χρήσης.
      icon: tabler:shield-check
steps:
  title: Από το κουτί στην πίσω αυλή
  items:
    - title: 'Βήμα 1: <span class="font-medium">Επιλέξτε την πισίνα σας</span>'
      description: Συγκρίνετε σχήματα και μεγέθη ώστε να ταιριάζουν με τον χώρο, το νοικοκυριό σας και τον τρόπο που σκοπεύετε να χρησιμοποιήσετε το νερό.
      icon: tabler:pool
    - title: 'Βήμα 2: <span class="font-medium">Ρυθμίστε το</span>'
      description: Τοποθετήστε σε σταθερό, επίπεδο έδαφος, φουσκώστε με την παρεχόμενη ηλεκτρική αντλία και γεμίστε με έναν εύκαμπτο σωλήνα κήπου.
      icon: tabler:rocket
    - title: 'Βήμα 3: <span class="font-medium">Κολυμπήστε όλο το καλοκαίρι</span>'
      description: Διατηρήστε το νερό φρέσκο ​​με απλή φροντίδα — ξαφρίστε, καλύψτε και ελέγξτε το pH όπως κάθε μικρή πισίνα.
      icon: tabler:ripple
    - title: 'Βήμα 4: <span class="font-medium">Αποθηκεύστε το μακριά</span>'
      description: Όταν τελειώσει η σεζόν, στραγγίστε, στεγνώστε, τυλίξτε και αποθηκεύστε την πισίνα στην τσάντα της μέχρι το επόμενο καλοκαίρι.
      icon: tabler:package
  image:
    src: /images/pools/round-grey-pool-1.webp
    alt: Inflatable Pool Factory στρογγυλή φουσκωτή πισίνα Drop Stitch
blog_latest:
  title: Pool Guides & Insights
  information: |
    Οδηγοί εγκατάστασης, συμβουλές φροντίδας και συμβουλές αγοράς για φουσκωτές πισίνες
    από την ομάδα Inflatable Pool Factory.
faqs:
  title: Συχνές ερωτήσεις για φουσκωτή πισίνα
  subtitle: Συνήθεις ερωτήσεις σχετικά με τις φουσκωτές πισίνες Inflatable Pool Factory.
  columns: 2
  items:
    - title: Πόσο χρόνο διαρκεί η εγκατάσταση;
      description: 'Το φούσκωμα διαρκεί 5-15 λεπτά με την παρεχόμενη ηλεκτρική αντλία αέρα ανάλογα με το μοντέλο. Ο χρόνος πλήρωσης ποικίλλει ανάλογα με τη χωρητικότητα της πισίνας και την παροχή νερού.'
      icon: tabler:clock
      category: all
    - title: Πόσο άκαμπτη είναι μια πισίνα Drop Stitch;
      description: Πολύ άκαμπτο. Τα τοιχώματα Drop Stitch φουσκώνουν δυνατά στα 4-5 PSI - παρόμοια με μια φουσκωτή σανίδα κουπιών - έτσι η πισίνα διατηρεί το σχήμα της όταν γεμίζει με νερό.
      icon: tabler:hexagon
      category: all
    - title: Μπορούν τα παιδιά να χρησιμοποιήσουν την πισίνα;
      description: Ναι, με ενεργή επίβλεψη ενηλίκων ανά πάσα στιγμή. Τα παιδιά δεν πρέπει ποτέ να αφήνονται χωρίς επίβλεψη μέσα ή κοντά στην πισίνα — ακολουθήστε το εγχειρίδιο και τους τοπικούς κανόνες ασφαλείας.
      icon: tabler:users
      category: all
    - title: Πώς αποθηκεύω την πισίνα το χειμώνα;
      description: Στραγγίστε το νερό, ξεφουσκώστε την πισίνα, αφήστε την να στεγνώσει τελείως, στη συνέχεια τυλίξτε την σε ρολό και αποθηκεύστε την στην παρεχόμενη σακούλα αποθήκευσης σε μέρος χωρίς παγετό.
      icon: tabler:package
      category: all
    - title: Τι περιλαμβάνει η πισίνα;
      description: Κάθε πισίνα Inflatable Pool Factory περιλαμβάνει ηλεκτρική αντλία αέρα, κιτ επισκευής και τσάντα αποθήκευσης. Τα στρογγυλά μοντέλα διαθέτουν προαιρετικά τοποθετημένο κάλυμμα.
      icon: tabler:box
      category: all
    - title: Τι μεγέθη είναι διαθέσιμα;
      description: 48 τυπικές SKU σε τέσσερις συλλογές — στρογγυλές πισίνες πλάτους έως 10 m, ορθογώνιες πισίνες έως 6 × 5 m και μπανιέρες SPA με ενσωματωμένα καθίσματα. Προσαρμοσμένα μεγέθη είναι διαθέσιμα για επιχειρηματικούς συνεργάτες.
      icon: tabler:ruler-2
      category: all
    - title: Σε ποιες επιφάνειες μπορεί να σταθεί η πισίνα;
      description: 'Οποιαδήποτε επίπεδη, επίπεδη επιφάνεια χωρίς αιχμηρά αντικείμενα — γκαζόν, αίθριο ή κατάστρωμα. Συνιστάται ένα αλεσμένο φύλλο σε τραχιές επιφάνειες. Μια γεμάτη πισίνα είναι βαριά: εγκαταστήστε μόνο σε μια επιφάνεια που αντέχει όλο το βάρος και να έχει πρώτα δομικά αξιολογήσει τα υπερυψωμένα καταστρώματα, τα μπαλκόνια και τις στέγες.'
      icon: tabler:layout-grid
      category: all
    - title: Πώς διατηρώ το νερό καθαρό;
      description: Χρησιμοποιήστε μια αντλία φίλτρου όπου υπάρχει, καθαρίστε τα υπολείμματα, ελέγξτε το pH και καλύψτε την πισίνα όταν δεν τη χρησιμοποιείτε. Το πόσο διαρκεί το νερό εξαρτάται από το μέγεθος της πισίνας, τη χρήση και το φιλτράρισμα — δοκιμάζετε τακτικά αντί να βασίζεστε σε ένα σταθερό πρόγραμμα.
      icon: tabler:droplet
      category: all
