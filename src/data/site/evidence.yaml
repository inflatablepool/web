badge: Proof & Planning
heading: Evidence
description: Representative project scenarios and the documentation questions we review with buyers. Specific test methods, compliance documents, lead times and commercial terms are confirmed per project.

case_studies:
  - id: retail-private-label-pools
    client: Retail private-label program
    product: Private-label pool line
    industry: Retail
    challenge: A retail program may need a private-label line of drop stitch pools with custom graphics, market-specific material documentation, and retail-ready packaging.
    solution: The project scope can cover custom print files, material specification review, sampling and packaging development, with design and production teams working from one approved specification.
    result: Sampling rounds, test requirements, packaging approval and delivery schedule are confirmed in the quotation and production plan.
    image: /images/pools/rectangular-pool-1.jpg
    tags: [OEM, Retail, Pool]
    outcome_metrics:
      - label: Program
        value: Private label
      - label: Customization
        value: Print + packaging
      - label: Documentation
        value: Per market

  - id: resort-round-pool-fleet
    client: Hospitality pool program
    product: Round pool fleet
    industry: Hospitality / Tourism
    challenge: Hospitality projects may need guest pools for villa terraces with consistent branding, UV-resistant materials for tropical sun, and practical seasonal storage.
    solution: The project scope can cover a custom round pool package with UV-stabilized PVC, property branding, a phased delivery schedule and staff setup guidance.
    result: Pool configuration, branding, delivery schedule and any setup support are confirmed per property and project.
    image: /images/pools/round-blue-pool-1.webp
    tags: [OEM, Pool, Hospitality]
    outcome_metrics:
      - label: Configuration
        value: Custom round pools
      - label: Branding
        value: Property graphics
      - label: Delivery
        value: Phased schedule

  - id: dtc-ecommerce-pool-line
    client: DTC e-commerce program
    product: Branded pool + accessory line
    industry: E-commerce / Retail
    challenge: A direct-to-consumer launch may need a complete pool package (pool, pump, cover, repair kit) with packaging designed for parcel fulfilment.
    solution: The project scope can cover a co-branded product line, retail-ready packaging with insert protection, and warranty registration planning.
    result: Product line, packaging, warranty process and launch timing are confirmed per project.
    image: /images/pools/round-grey-pool-1.webp
    tags: [OEM, Pool, DTC, E-commerce]
    outcome_metrics:
      - label: Line
        value: Pool + accessories
      - label: Packaging
        value: Retail-ready
      - label: Launch
        value: Project schedule

