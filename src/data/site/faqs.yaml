faqs:
  - q: Does Inflatable Pool Factory provide OEM/ODM services for inflatable swimming pools?
    a: >-
      Yes. We support OEM and ODM programs for inflatable pools. Custom sizes,
      colors, logos, covers and packaging are reviewed per project; design
      scope and ownership are confirmed before quoting.
  - q: What certifications apply to Inflatable Pool Factory pools?
    a: >-
      Compliance documentation depends on the target market. Share the
      standards and declarations your market requires, and we will confirm
      what can be provided for the project.
  - q: What is the minimum order quantity (MOQ) for OEM pools?
    a: >-
      MOQ depends on the product, customization and order volume. Share your
      requirements and we will confirm the applicable minimum in the quotation.
  - q: Which materials does Inflatable Pool Factory use for its pools?
    a: >-
      We use multi-layer, UV-resistant, puncture-resistant PVC with a
      high-pressure drop stitch core. Material specifications are reviewed
      against the approved product documentation before production.
  - q: Can Inflatable Pool Factory handle large-volume wholesale orders?
    a: >-
      Yes. We ship pools factory-direct worldwide and manage logistics from
      our factory to your warehouse or port. Wholesale pricing is available
      for bulk orders.
  - q: What is the lead time for pool orders?
    a: >-
      Lead time depends on the product, customization, quantity and production
      season. The final schedule is confirmed in the quotation and production plan.
  - q: How does Inflatable Pool Factory ensure pool air-tightness and durability?
    a: >-
      Production pools are checked against the approved pressure and leak-test
      specification before shipment. The applicable method, hold time and
      acceptance criteria are confirmed per product; the PVC shell includes UV
      stabilizers for outdoor use.
  - q: How long does setup really take?
    a: >-
      Fifteen to thirty minutes for most models: unroll on level ground,
      inflate with the included pump, and fill with water. Takedown in fall
      takes about the same.
  - q: How should I care for the water?
    a: >-
      Run a compatible filter pump daily, keep chlorine at 1–3 ppm and pH
      between 7.2 and 7.6, skim debris, and cover the pool when not in use.
      With this routine, water can last several weeks between changes.
  - q: Where can I buy Inflatable Pool Factory pools?
    a: >-
      We sell factory-direct worldwide. Contact info@inflatablepoolfactory.com for a quote
      on any model, wholesale pricing, or OEM inquiries.
