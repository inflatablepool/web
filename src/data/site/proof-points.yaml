points:
  - id: quality
    metric: 'Per spec'
    label: pressure & leak checks
    detail: Production units are checked against the approved pressure and leak-test specification
  - id: setup
    metric: '5–15'
    label: minutes to inflate
    detail: One person, one pump, no tools required; filling time varies with pool size
  - id: storage
    metric: 'UV-resistant'
    label: drop stitch PVC
    detail: Built for repeated seasonal use; folds into the included storage bag for winter
  - id: support
    metric: 'OEM/ODM'
    label: custom programs
    detail: Custom sizes, colors, branding and packaging reviewed per project
