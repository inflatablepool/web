submit_button:
  en: Send Inquiry → Get a Quote
  fr: Envoyer la demande → Obtenir un devis
  de: Anfrage senden → Angebot erhalten
  es: Enviar consulta → Obtener presupuesto
  pt: Enviar consulta → Obter orçamento

success_message:
  en: Thanks! Your message has landed in our inbox. Our team will review your message and follow up with next steps.
  fr: Merci ! Votre message a bien été envoyé.
  de: Vielen Dank! Ihre Nachricht ist eingegangen.
  es: ¡Gracias! Su mensaje ha sido enviado.
  pt: Obrigado! Sua mensagem foi enviada.

error_message:
  en: Something went wrong sending your message. Please try again or email us directly.
  fr: Une erreur est survenue. Veuillez réessayer ou nous envoyer un e-mail directement.
  de: Beim Senden Ihrer Nachricht ist ein Fehler aufgetreten. Bitte versuchen Sie es erneut.
  es: Ocurrió un error al enviar su mensaje. Intente de nuevo o escríbanos directamente.
  pt: Ocorreu um erro ao enviar sua mensagem. Tente novamente ou envie-nos um e-mail.

file_upload_label:
  en: Attachment (optional)
  fr: Pièce jointe (facultatif)
  de: Anhang (optional)
  es: Adjunto (opcional)
  pt: Anexo (opcional)

file_upload_hint:
  en: 'Spec sheet, drawing or catalog — PNG, JPG, SVG, WebP, PDF, AI, PSD, DWG, DXF or ZIP, up to 20 MB.'
  fr: 'Fiche technique, plan ou catalogue — PNG, JPG, SVG, WebP, PDF, AI, PSD, DWG, DXF ou ZIP, 20 Mo max.'
  de: 'Datenblatt, Zeichnung oder Katalog — PNG, JPG, SVG, WebP, PDF, AI, PSD, DWG, DXF oder ZIP, max. 20 MB.'
  es: 'Ficha técnica, plano o catálogo — PNG, JPG, SVG, WebP, PDF, AI, PSD, DWG, DXF o ZIP, hasta 20 MB.'
  pt: 'Ficha técnica, desenho ou catálogo — PNG, JPG, SVG, WebP, PDF, AI, PSD, DWG, DXF ou ZIP, até 20 MB.'

captcha_label:
  en: 'Anti-spam: please solve the following'
  fr: 'Anti-spam : veuillez résoudre'
  de: 'Anti-Spam: bitte lösen Sie'
  es: 'Anti-spam: por favor resuelva'
  pt: 'Anti-spam: por favor resolva'

