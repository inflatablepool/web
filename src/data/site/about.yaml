origin:
  tagline: 'Our Origin'
  heading: "Built for summer,<br />\n<span class=\"text-sky-600\">engineered to last</span>"
  paragraphs:
    - 'Inflatable Pool Factory started with a simple frustration: inflatable pools that sagged, leaked, and lasted a single season. We believed a pool could be better — rigid enough to swim laps in, tough enough to survive year after year, and still small enough to store indoors in winter.'
    - 'Drop stitch construction — the same technology behind high-pressure inflatable stand-up paddleboards — was the answer. Thousands of internal threads lock the walls rigid under pressure, giving a fabric pool the structure of a hard-sided one.'
    - 'Every Inflatable Pool Factory pool is built around that core: quality materials, tested construction, and honest engineering, at a price a family can justify.'
    - 'Inflatable Pool Factory is designed by the Inflatable Pool Team at <strong>Qingdao Vatrad Group</strong>. Our pools are produced at our manufacturing base in Qingdao, China, and production units are checked against the approved pressure and leak-test specification before shipment.'
  image: /images/pools/rectangular-pool-1.jpg
  image_alt: 'Inflatable Pool Factory drop stitch pool'

philosophy:
  tagline: 'Our Philosophy'
  heading: 'Simple, durable, honest'
  description: 'A pool is a promise: fill it on the first hot day of summer and it works. Everything we design serves that promise.'
  cards:
    - emoji: "\U0001F30A"
      title: 'Rigid, Not Saggy'
      description: 'Drop stitch walls inflate rigid and hold their shape at full water pressure. No leaning walls, no sagging water line, no lost depth.'
    - emoji: "\U0001F527"
      title: 'Built to Last, Not to Replace'
      description: 'The most sustainable pool is the one you do not throw away. UV-resistant, puncture-resistant PVC and quality valves mean seasons of use, not one summer.'
    - emoji: "\U0001F3C6"
      title: 'Summer Made Simple'
      description: 'Quick to inflate, ten minutes to fold away. No tools, no frames, no installation crew. Swimming should be the easy part.'

design:
  tagline: 'Design Philosophy'
  heading: "Designed from the<br />\n<span class=\"text-sky-600\">water outward</span>"
  paragraphs:
    - 'Every Inflatable Pool Factory pool starts with one question: <em>what does the water do to it?</em> Full water pressure, UV exposure, chlorine chemistry, ground debris — we design for all of it, then build above it.'
    - 'Our drop stitch chambers are rated well above working pressure, so a hot afternoon does not over-stress a seam. Our PVC is laminated with UV stabilizers, because sunlight — not punctures — is what kills most inflatable pools.'
    - 'We do not design to a price point. We design to a failure point — then build well past it.'
  image: /images/pools/round-grey-pool-1.webp
  image_alt: 'Inflatable Pool Factory pool design'
  stats:
    - value: 'QC'
      label: 'checks<br />before packing'
    - value: '4–5'
      label: 'PSI rated<br />working pressure'
    - value: '5–15'
      label: 'minute<br />inflation'
