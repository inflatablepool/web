site:
  name: Inflatable Pool Factory
  site: 'https://inflatablepoolfactory.com'
  base: '/'
  trailingSlash: true
  googleSiteVerificationId: ''

metadata:
  title:
    default: 'Inflatable Pool Factory | Inflatable Swimming Pools — Drop Stitch Backyard Pools'
    template: '%s — Inflatable Pool Factory'
  description: 'Premium drop stitch inflatable swimming pools by Inflatable Pool Factory. Rigid walls, quick inflation, and easy winter storage.'
  robots:
    index: true
    follow: true
  keywords:
    - Inflatable Pool Factory
    - inflatable swimming pool
    - drop stitch pool
    - inflatable pool
    - rectangular inflatable pool
    - round inflatable pool
    - backyard pool
    - portable swimming pool

apps:
  products:
    isEnabled: true
    productsPerPage: 12
    product:
      isEnabled: true
      permalink: '/products/%slug%'
      robots:
        index: true
        follow: true
    list:
      isEnabled: true
      pathname: 'products'
      robots:
        index: true
        follow: true