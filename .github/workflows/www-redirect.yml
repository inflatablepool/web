name: WWW Redirect Rule

# Idempotent infrastructure task: ensure www.inflatablepoolfactory.com
# returns a single 301 to the apex domain with the path and query preserved.
# Runs when this workflow or its script changes, or manually from Actions.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/www-redirect.yml'
      - 'scripts/ensure-www-redirect.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-www-redirect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Ensure www → apex 301
        continue-on-error: true
        run: node scripts/ensure-www-redirect.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || '' }}
