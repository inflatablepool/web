name: CI

# Quality gate for pull requests: full check + build must pass before merge,
# catching build-breaking regressions before they reach the deployable main branch.
on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Lint + typecheck + prettier + i18n
        run: npm run check

      - name: Full production build
        run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: Internal link audit (dist)
        run: npm run check:links

      - name: SEO route matrix (unique intents, no orphans)
        run: npm run check:routes

      - name: Brand positioning gate (inflatable pools)
        run: python3 scripts/07_positioning_check.py --dist ./dist --strict

      - name: Asset provenance + licence ledger
        run: node scripts/check-asset-ledger.mjs --strict

      - name: AI content review gate (sources, fact check, publishers)
        run: node scripts/check-ai-content.mjs --strict

      - name: Workers compile check (dry-run bundles)
        run: |
          npx wrangler deploy --dry-run -c workers/admin-worker/wrangler.toml
          npx wrangler deploy --dry-run -c workers/contact-worker/wrangler.toml
          npx wrangler deploy --dry-run -c workers/news-worker/wrangler.toml
          npx wrangler deploy --dry-run -c workers/automation-worker/wrangler.toml
          npx wrangler deploy --dry-run -c workers/ai-worker/wrangler.toml