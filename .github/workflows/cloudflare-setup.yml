name: Cloudflare Setup (one-time)

# One-time bootstrap of the Cloudflare resources that CI deploys INTO.
# Idempotent: resources that already exist are skipped, so this workflow can
# be re-run safely. Requires secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# See SETUP.md sections 1-2 (created resources / values this produces).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create D1 database (inflatable-pool-factory-db)
        id: d1
        run: |
          echo "## Cloudflare setup result" >> "$GITHUB_STEP_SUMMARY"
          set +e
          npx wrangler d1 create inflatable-pool-factory-db > /tmp/d1-create.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ] && ! grep -qiE "already exist|duplicate" /tmp/d1-create.log; then
            cat /tmp/d1-create.log
            echo "::error::Failed to create D1 database inflatable-pool-factory-db (check CLOUDFLARE_API_TOKEN has D1:Edit permission)"
            exit 1
          fi
          cat /tmp/d1-create.log
          npx wrangler d1 list --json > /tmp/d1-list.json
          DBID=$(node -e "const j=require('/tmp/d1-list.json');const arr=Array.isArray(j)?j:(j.result||[]);const db=arr.find(d=>d.name==='inflatable-pool-factory-db');if(!db){console.error('inflatable-pool-factory-db not found in account');process.exit(1)}console.log(db.uuid||db.id||db.database_id||'')")
          if [ -z "$DBID" ]; then echo "::error::Could not extract database_id"; exit 1; fi
          echo "D1_DATABASE_ID=$DBID" >> "$GITHUB_OUTPUT"
          echo "- CF_PROD_D1_ID (add as GitHub secret): \`$DBID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "D1_ID_FOR_SECRET=$DBID"

      - name: Create R2 buckets (inflatable-pool-factory-assets, inflatable-pool-factory-data)
        run: |
          for b in inflatable-pool-factory-assets inflatable-pool-factory-data; do
            set +e
            npx wrangler r2 bucket create "$b" > "/tmp/r2-$b.log" 2>&1
            status=$?
            set -e
            if [ $status -ne 0 ] && ! grep -qiE "already exist|code: 10004|duplicate" "/tmp/r2-$b.log"; then
              cat "/tmp/r2-$b.log"
              echo "::error::Failed to create R2 bucket $b (check Workers R2 Storage:Edit permission)"
              exit 1
            fi
            cat "/tmp/r2-$b.log"
            echo "- R2 bucket \`$b\`: ready" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Set R2 CORS rules (inflatable-pool-factory-assets)
        run: |
          npx wrangler r2 bucket cors set inflatable-pool-factory-assets --file scripts/r2-cors.json
          echo "- R2 CORS applied to \`inflatable-pool-factory-assets\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pages project (Inflatable Pool Factory)
        run: |
          set +e
          npx wrangler pages project create inflatable-pool-factory --production-branch main > /tmp/pages.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ] && ! grep -qiE "already exist|duplicate|already taken" /tmp/pages.log; then
            cat /tmp/pages.log
            echo "::error::Failed to create Pages project (check Cloudflare Pages:Edit permission)"
            exit 1
          fi
          cat /tmp/pages.log
          echo "- Pages project \`Inflatable Pool Factory\`: ready (production branch: main)" >> "$GITHUB_STEP_SUMMARY"

      - name: Create Vectorize index (ai-index-v2)
        run: |
          set +e
          npx wrangler vectorize create ai-index-v2 --dimensions=1024 --metric=cosine > /tmp/vec.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ] && ! grep -qiE "already exist|duplicate_name|code: 3002" /tmp/vec.log; then
            cat /tmp/vec.log
            echo "::error::Failed to create Vectorize index (check Vectorize:Edit permission)"
            exit 1
          fi
          cat /tmp/vec.log
          echo "- Vectorize index \`ai-index-v2\` (1024d cosine): ready" >> "$GITHUB_STEP_SUMMARY"

      - name: Claim workers.dev subdomain (required by cron schedules API)
        run: |
          # Accounts that never opened the Workers dashboard have no workers.dev
          # subdomain; wrangler's cron-schedule upload fails with
          # "You need a workers.dev subdomain in order to proceed".
          # GET first, PUT to claim if missing. Idempotent.
          status=$(curl -s -o /tmp/subdomain.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
          echo "GET subdomain -> $status"; cat /tmp/subdomain.json; echo
          if [ "$status" = "200" ] && grep -q '"subdomain"' /tmp/subdomain.json && ! grep -q '"subdomain":null' /tmp/subdomain.json; then
            echo "workers.dev subdomain already claimed"
          else
            # PUT requires an explicit subdomain name (error 10033 otherwise).
            for name in inflatable-pool-factory inflatable-pool-factory-web aquafarer-inflatable-pool-factory; do
              code=$(curl -s -o /tmp/subdomain-put.json -w "%{http_code}" -X PUT \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"enabled\": true, \"preview_urls_enabled\": true, \"subdomain\": \"$name\"}" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")
              echo "PUT subdomain '$name' -> $code"; cat /tmp/subdomain-put.json; echo
              if [ "$code" = "200" ]; then
                echo "claimed workers.dev subdomain: $name"
                echo "- workers.dev subdomain: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
                break
              fi
            done
            if [ "$code" != "200" ]; then
              echo "::error::Could not claim workers.dev subdomain. Open Cloudflare Dashboard -> Workers & Pages once (this creates the subdomain), then re-run this workflow."
              exit 1
            fi
          fi

      - name: Attach R2 custom domain (assets.inflatablepoolfactory.com)
        run: |
          # The Pages middleware 301s /images/* and /files/* to this domain and
          # product data references it directly — without it all images 404/530.
          # Idempotent: skips when the domain is already attached.
          CF_API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          BUCKET=inflatable-pool-factory-assets
          DOMAIN=assets.inflatablepoolfactory.com
          # Resolve the zone id: prefer the live API value (a secret pasted with
          # trailing whitespace/newline produced invalid JSON -> API error 10040),
          # fall back to the trimmed secret. Validate the 32-hex shape.
          ZONE_ID=$(curl -sS "${AUTH[@]}" "${CF_API}/zones?name=inflatablepoolfactory.com" | jq -r '.result[0].id // empty' | tr -d '[:space:]')
          if [ -z "$ZONE_ID" ]; then
            ZONE_ID=$(printf '%s' "${CLOUDFLARE_ZONE_ID:-}" | tr -d '[:space:]')
          fi
          if ! printf '%s' "$ZONE_ID" | grep -qE '^[0-9a-f]{32}$'; then
            echo "::error::Could not resolve a valid inflatablepoolfactory.com zone id (needs Zone:Read permission or a correct CLOUDFLARE_ZONE_ID secret)"
            exit 1
          fi

          # already attached?
          LIST=$(curl -sS "${AUTH[@]}" "${CF_API}/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/domains/custom")
          echo "current custom domains: $(echo "$LIST" | jq -c '.result.domains // .result // []')"
          if echo "$LIST" | jq -e --arg d "$DOMAIN" '[(.result.domains // .result // [])[] | select(.domain == $d)] | length > 0' > /dev/null; then
            echo "custom domain $DOMAIN already attached"
          else
            # jq builds the body so no variable can ever break the JSON.
            BODY=$(jq -nc --arg d "$DOMAIN" --arg z "$ZONE_ID" '{domain: $d, enabled: true, zoneId: $z}')
            RESP=$(curl -sS -X POST "${AUTH[@]}" \
              "${CF_API}/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/domains/custom" \
              -d "$BODY")
            echo "attach response: $RESP"
            if ! echo "$RESP" | jq -e '.success' > /dev/null; then
              echo "::error::Failed to attach $DOMAIN to bucket $BUCKET (check Workers R2 Storage:Edit permission)"
              exit 1
            fi
          fi

          # Ensure the proxied CNAME exists (the attach API usually creates it,
          # but if the record pre-existed as unproxied or was deleted, R2 returns
          # error 530/1001 at the edge).
          REC=$(curl -sS "${AUTH[@]}" "${CF_API}/zones/$ZONE_ID/dns_records?name=$DOMAIN" | jq -r '.result[0] // empty')
          echo "dns record: $REC"
          if [ -z "$REC" ]; then
            DNS_BODY=$(jq -nc --arg n "$DOMAIN" --arg c "${BUCKET}.${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" '{type: "CNAME", name: $n, content: $c, proxied: true}')
            CREATE=$(curl -sS -X POST "${AUTH[@]}" "${CF_API}/zones/$ZONE_ID/dns_records" -d "$DNS_BODY")
            echo "dns create: $CREATE"
            echo "$CREATE" | jq -e '.success' > /dev/null || {
              echo "::error::Failed to create the $DOMAIN CNAME record (check Zone DNS:Edit permission)"
              exit 1
            }
          else
            PROXIED=$(echo "$REC" | jq -r '.proxied')
            if [ "$PROXIED" != "true" ]; then
              REC_ID=$(echo "$REC" | jq -r '.id')
              UPDATE=$(curl -sS -X PATCH "${AUTH[@]}" "${CF_API}/zones/$ZONE_ID/dns_records/$REC_ID" -d '{"proxied":true}')
              echo "dns proxied update: $UPDATE"
              echo "$UPDATE" | jq -e '.success' > /dev/null || {
                echo "::error::Could not proxy the $DOMAIN record (R2 custom domains only work proxied)"
                exit 1
              }
            fi
          fi
          echo "- R2 custom domain \`$DOMAIN\` → bucket \`$BUCKET\` (SSL may take a few minutes to activate)" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Verify R2 assets serving (status + bucket contents + fetch test)
        run: |
          CF_API="https://api.cloudflare.com/client/v4"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          BUCKET=inflatable-pool-factory-assets
          DOMAIN=assets.inflatablepoolfactory.com

          # 1. Custom domain attach status (ownership/ssl must both be "active").
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -sS "${AUTH[@]}" "${CF_API}/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/domains/custom" \
              | jq -c --arg d "$DOMAIN" '[(.result.domains // .result // [])[] | select(.domain == $d)][0] // null')
            echo "domain status (try $i): $STATUS"
            OWNERSHIP=$(echo "$STATUS" | jq -r '.status.ownership // empty')
            SSL=$(echo "$STATUS" | jq -r '.status.ssl // empty')
            if [ "$OWNERSHIP" = "active" ] && [ "$SSL" = "active" ]; then
              break
            fi
            sleep 20
          done
          if [ "$OWNERSHIP" != "active" ] || [ "$SSL" != "active" ]; then
            echo "::warning::$DOMAIN ownership=$OWNERSHIP ssl=$SSL (not fully active yet — re-run this workflow in a few minutes)"
          fi

          # 2. Bucket contents: count objects under images/ (the CI deploy uploads
          # public/images here; an empty prefix means the deploy upload failed).
          LISTING=$(curl -sS "${AUTH[@]}" "${CF_API}/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$BUCKET/objects?prefix=images/&per_page=100")
          COUNT=$(echo "$LISTING" | jq '.result | length')
          echo "objects under images/ (first page): $COUNT"
          echo "$LISTING" | jq -r '.result[]?.key' | head -15

          # 3. End-to-end fetch test from this runner (clean network).
          for path in "images/default.webp" "images/pools/rectangular-pool-2.webp"; do
            CODE=$(curl -sS -o /tmp/obj.bin -w "%{http_code}" --max-time 30 "https://$DOMAIN/$path")
            SIZE=$(wc -c < /tmp/obj.bin 2>/dev/null || echo 0)
            echo "fetch https://$DOMAIN/$path -> HTTP $CODE ($SIZE bytes)"
            if [ "$CODE" != "200" ]; then
              echo "::warning::$DOMAIN/$path returned HTTP $CODE"
            fi
          done
          CODE=$(curl -sSL -o /tmp/obj2.bin -w "%{http_code}" --max-time 30 "https://inflatablepoolfactory.com/images/default.webp")
          echo "fetch (via site 301) https://inflatablepoolfactory.com/images/default.webp -> HTTP $CODE ($(wc -c < /tmp/obj2.bin) bytes)"

      - name: Summary
        run: |
          {
            echo ""
            echo "Resources ready. Next: add \`CF_PROD_D1_ID\` = \`${{ steps.d1.outputs.D1_DATABASE_ID }}\` as a repository secret, then run the Deploy workflow."
          } >> "$GITHUB_STEP_SUMMARY"
