name: SEO / GEO 闸门

# 三层防护：
#   1. PR 时跑构建后闸门（05_ci_gate.py）—— 拦住新增的空壳页、语言串台、箭头污染
#   2. 每周定时跑品牌定位一致性（07_positioning_check.py）
#   （注：04_verify_cloudflare_robots.py 与 01_audit_site.py 未入库，
#    对应定时任务一并移除；脚本恢复后再加回 cloudflare-robots / live-audit job）

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'   # 每周一 02:00 UTC（北京时间 10:00）
  workflow_dispatch:

jobs:
  build-gate:
    name: 构建后 SEO 闸门
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # PR 评论步骤需要写权限
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: 闸门检查（A 语言 / B 箭头 / C 词数 / D-E 标题 / F 内部页 / G sitemap）
        run: |
          python3 scripts/05_ci_gate.py \
            --dist ./dist \
            --min-words 400 \
            --warn-only CEH \
            --report ci-seo-report.md
        # 分期收紧状态（2026-08）：
        #   阻断：A 结构错误（lang 属性不符 / 语言串台）、B 箭头 / D 通用标题 /
        #         F 内部页 noindex / G sitemap 一致性
        #   告警：A-X 内容未翻译（背书语言正文仍是英文，输出清单供内容工程排期）、
        #         C 词数下限、E 标题模板、H 事实一致性 —— 存量内容问题先曝露不阻断，
        #         内容工程补足后再移出 warn-only 名单全职恢复

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seo-gate-report
          path: ci-seo-report.md

      - name: PR 评论
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('ci-seo-report.md')) return;
            let body = fs.readFileSync('ci-seo-report.md', 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n…（已截断，见 artifact）';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## SEO / GEO 闸门结果\n\n' + body,
            });

  positioning-gate:
    name: 品牌定位一致性检查（07）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 检查三条产品线落地页 / OEM-ODM 主路径 / 首页必需词 / schema 统一 / 禁用表述
        run: python3 scripts/07_positioning_check.py --strict --base https://inflatablepoolfactory.com
        # 画像：RIB Boats, Inflatable Boats, SUP Boards Manufacturer & OEM/ODM Solution
        # 阻断项（19 项清单）→ exit 1；告警（5 项）仅提示
