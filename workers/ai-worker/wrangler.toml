name = "inflatable-pool-factory-ai"
main = "index.ts"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "inflatablepoolfactory.com/api/chat*", zone_name = "inflatablepoolfactory.com" },
  { pattern = "inflatablepoolfactory.com/api/ask*", zone_name = "inflatablepoolfactory.com" },
  { pattern = "inflatablepoolfactory.com/api/search*", zone_name = "inflatablepoolfactory.com" },
  { pattern = "inflatablepoolfactory.com/api/embed*", zone_name = "inflatablepoolfactory.com" },
  { pattern = "inflatablepoolfactory.com/api/reindex*", zone_name = "inflatablepoolfactory.com" },
  { pattern = "inflatablepoolfactory.com/api/ai/*", zone_name = "inflatablepoolfactory.com" },
]

[triggers]
crons = ["0 3 * * *"]

[vars]
SITE_ORIGIN = "https://inflatablepoolfactory.com"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "ai-index-v2"

[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "inflatable-pool-factory-data"
